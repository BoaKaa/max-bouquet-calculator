name: Prepare RC dependency lockfile (temporary)

on:
  push:
    branches: [rc-lockfile-preparation]
    paths: [".github/workflows/rc-lockfile-generation.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-verify-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve and save lockfile
        run: |
          cd access-gate
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package-lock.json'); if(p.lockfileVersion!==3 || !p.packages['node_modules/wrangler']?.version || !p.packages['node_modules/wrangler']?.integrity) process.exit(1); console.log('LOCKFILE PASS: wrangler',p.packages['node_modules/wrangler'].version)"
          npm ci --no-audit --no-fund
          npm test
          npm run build
          cmp ../sales-diagnostic/index.html dist/index.html
      - name: Commit lockfile only in temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add access-gate/package-lock.json
          git diff --cached --exit-code && exit 0
          git commit -m "build(rc): generate verified npm lockfile on temporary branch"
          git push origin HEAD:rc-lockfile-preparation
