<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#f6f4ef" />
  <meta name="description" content="Практический B2C-диагност системы продаж для мастеров, услуг, экспертов и обучения." />
  <title>Диагностика системы продаж</title>
  <style>
:root {
  --bg: #f6f4ef;
  --surface: #fffdf9;
  --surface-2: #f0ede6;
  --text: #1f2421;
  --muted: #686b67;
  --line: #ddd8cf;
  --accent: #253a33;
  --accent-soft: #e5ece8;
  --warning: #775f2d;
  --warning-soft: #f5ecd3;
  --danger: #7a3737;
  --danger-soft: #f4e2e2;
  --ok: #315b45;
  --ok-soft: #e2eee7;
  --shadow: 0 12px 35px rgba(42, 40, 35, .08);
  --radius: 22px;
  --max: 760px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.5;
}
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: 3px solid rgba(37,58,51,.22);
  outline-offset: 2px;
}

.app-shell { min-height: 100vh; display: flex; flex-direction: column; }
.topbar {
  width: min(100%, calc(var(--max) + 48px));
  margin: 0 auto;
  padding: 16px 24px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.brand {
  border: 0;
  background: transparent;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: inherit;
  padding: 0;
  text-align: left;
}
.brand-logo { width: 42px; height: 42px; object-fit: contain; }
.brand-text { display: grid; gap: 0; }
.brand-text strong { font-size: 14px; }
.brand-text small { font-size: 12px; color: var(--muted); }

.app {
  width: min(100%, calc(var(--max) + 48px));
  margin: 0 auto;
  padding: 12px 24px 32px;
  flex: 1;
}
.card {
  background: var(--surface);
  border: 1px solid rgba(63,58,49,.09);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.hero { padding: clamp(24px, 6vw, 48px); }
.eyebrow {
  margin-bottom: 10px;
  color: var(--accent);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .06em;
  text-transform: uppercase;
}
h1, h2, p { margin-top: 0; }
h1 {
  margin-bottom: 16px;
  font-size: clamp(30px, 7vw, 48px);
  line-height: 1.05;
  letter-spacing: -.035em;
}
h2 { font-size: 20px; line-height: 1.2; margin-bottom: 14px; }
.lead { font-size: 18px; color: #454944; max-width: 62ch; margin-bottom: 28px; }
.note-box {
  margin-top: 24px;
  padding: 16px 18px;
  border-radius: 16px;
  background: var(--surface-2);
  color: #4e514d;
  font-size: 14px;
}

.mode-grid { display: grid; gap: 12px; }
.mode-card {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: #fff;
  padding: 18px;
  text-align: left;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px 16px;
  align-items: center;
  transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.mode-card:hover { transform: translateY(-1px); border-color: #a9b4ae; box-shadow: 0 8px 18px rgba(42,40,35,.05); }
.mode-card strong { font-size: 17px; }
.mode-card span { color: var(--muted); font-size: 14px; grid-column: 1; }
.mode-card .arrow { grid-column: 2; grid-row: 1 / span 2; font-size: 24px; color: var(--accent); }
.mode-card[disabled] { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }

.wizard-card { overflow: hidden; }
.progress-wrap { padding: 18px 22px 0; }
.progress-track { height: 6px; border-radius: 99px; background: #ebe7df; overflow: hidden; }
.progress-bar { height: 100%; width: 0; border-radius: inherit; background: var(--accent); transition: width .25s ease; }
.progress-meta { display: flex; justify-content: space-between; gap: 12px; padding-top: 8px; color: var(--muted); font-size: 12px; }
.question-wrap { padding: clamp(26px, 7vw, 54px) clamp(22px, 6vw, 48px) 26px; min-height: 430px; }
.question-title { font-size: clamp(27px, 6vw, 40px); max-width: 18ch; }
.question-help { color: var(--muted); max-width: 62ch; margin-bottom: 24px; }
.answer-area { display: grid; gap: 10px; }
.option-card {
  position: relative;
  width: 100%;
  min-height: 58px;
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 15px;
  padding: 14px 16px;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--text);
}
.option-card:hover { border-color: #a6b1ab; }
.option-card.selected { border: 2px solid var(--accent); padding: 13px 15px; background: var(--accent-soft); }
.option-dot {
  width: 20px; height: 20px; border-radius: 50%; border: 2px solid #9c9d98; flex: 0 0 auto;
  display: grid; place-items: center;
}
.option-card.selected .option-dot { border-color: var(--accent); }
.option-card.selected .option-dot::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
.option-text strong { display: block; font-size: 16px; }
.option-text small { display: block; color: var(--muted); margin-top: 2px; }

.text-input, .select-input {
  width: 100%;
  min-height: 54px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #fff;
  padding: 14px 15px;
  color: var(--text);
}
.text-input::placeholder { color: #9a9b96; }
.input-note { color: var(--muted); font-size: 13px; margin-top: 8px; }

.wizard-actions {
  border-top: 1px solid #ece8e0;
  padding: 16px 22px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
}
.primary-btn, .ghost-btn {
  min-height: 48px;
  border-radius: 13px;
  padding: 0 18px;
  font-weight: 750;
}
.primary-btn { border: 1px solid var(--accent); background: var(--accent); color: white; }
.primary-btn:disabled { opacity: .38; cursor: not-allowed; }
.ghost-btn { border: 1px solid var(--line); background: transparent; color: var(--text); }

.result-stack { display: grid; gap: 14px; }
.result-hero { padding: clamp(25px, 6vw, 44px); background: var(--accent); color: white; }
.result-hero .eyebrow { color: #c9d8d0; }
.result-hero h1 { font-size: clamp(30px, 7vw, 46px); margin-bottom: 12px; }
.result-summary { max-width: 62ch; font-size: 18px; color: #edf2ef; }
.confidence { display: inline-flex; margin-top: 8px; border-radius: 999px; padding: 7px 11px; background: rgba(255,255,255,.12); font-size: 13px; font-weight: 700; }
.result-card { padding: 24px; }
.reason-list { display: grid; gap: 10px; }
.reason {
  display: flex; gap: 10px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid #eeeae2;
}
.reason:last-child { border-bottom: 0; }
.reason::before { content: "•"; font-weight: 900; color: var(--accent); }
.action-card { border-color: #cbd9d1; }
.action-text { font-size: 18px; line-height: 1.55; }
.metric-box { margin-top: 18px; background: var(--accent-soft); border-radius: 15px; padding: 15px 16px; display: grid; gap: 4px; }
.metric-box span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; font-weight: 800; }
.metric-box strong { font-size: 16px; }
.tag-list { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { border: 1px solid var(--line); border-radius: 999px; padding: 7px 10px; background: #fff; font-size: 13px; }
.result-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.microcopy { margin: 10px 0 0; color: var(--ok); font-size: 13px; }

.status-card { padding: 18px; border-radius: 16px; margin-top: 12px; }
.status-card.ok { background: var(--ok-soft); color: var(--ok); }
.status-card.warn { background: var(--warning-soft); color: var(--warning); }
.status-card.danger { background: var(--danger-soft); color: var(--danger); }

.footer {
  width: min(100%, calc(var(--max) + 48px));
  margin: 0 auto;
  padding: 0 24px 28px;
  color: var(--muted);
  font-size: 12px;
}
.footer p { margin: 0; }

@media (max-width: 640px) {
  .topbar { padding: 12px 14px 6px; }
  .app { padding: 8px 12px 24px; }
  .footer { padding: 0 14px 22px; }
  .brand-text small { display: none; }
  .top-reset { min-height: 40px; padding: 0 12px; font-size: 13px; }
  .hero { border-radius: 18px; }
  .wizard-card { border-radius: 18px; }
  .question-wrap { min-height: 420px; }
  .wizard-actions { position: sticky; bottom: 0; background: rgba(255,253,249,.96); backdrop-filter: blur(10px); }
  .primary-btn, .ghost-btn { flex: 1; }
  .result-actions .primary-btn, .result-actions .ghost-btn { flex: 1 1 100%; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
}

</style>
</head>

    BUILD_FULFILLMENT: card('Докажите, что продажу можно нормально выполнить', 'Оплата ещё не означает, что система работает.', 'Выполните реальный заказ от начала до конца и зафиксируйте время, расходы, проблемы и результат.', 'Заказ выполнен без критического сбоя; фактическое время и расходы.', 'Не масштабируйте предложение только потому, что первая оплата состоялась.', 'Когда выполнение подтверждено — проверяем реальную пользу для клиента.'),
    BUILD_VALUE: card('Проверьте, получил ли клиент обещанную пользу', 'Продажа и выполнение состоялись, но ценность для клиента ещё не подтверждена.', 'Получите подтверждение результата подходящим способом — не просто «всё понравилось», а решилась ли задача покупки.', 'Фактический результат клиента.', 'Не усиливайте обещание до подтверждения ценности.', 'Если ценность подтверждается — проверяем экономику.'),
    BUILD_ECONOMICS: card('Проверьте экономический смысл продажи', 'Продать и выполнить можно, но пока неясно, стоит ли повторять такую продажу.', 'Посчитайте реальную тестовую продажу: выручка, переменные расходы, ваше время и ограничивающий ресурс.', 'Положительный и правдоподобный результат при нормальной цене и выполнении.', 'Не требуйте идеальной финансовой модели, но не масштабируйте явно убыточную механику.', 'Если экономика приемлема — проверяем устойчивую мощность.'),
    BUILD_CAPACITY: card('Проверьте, можно ли повторять продажу без аврала', 'Одна продажа может работать, а серия таких продаж — уже нет.', 'Определите, что заканчивается первым, и оцените нормальный устойчивый объём без ночных авралов.', 'Повторяемый объём без ухудшения качества и денег.', 'Не считайте экстренный максимум нормальной мощностью.', 'Если механизм повторяем — направление можно переводить в режим обычной оптимизации.'),
    NO_CRITICAL_CONSTRAINT_FOUND: card('Явного критического ограничения не найдено', 'По вашим ответам нет достаточно сильного основания объявить одну зону главной проблемой.', 'Возьмите вашу текущую цель и проверьте одну небольшую управляемую гипотезу. Инструмент сохранит её как возможность, а не как «диагноз».', 'Главный бизнес-результат вашей цели + деньги + нагрузка + качество.', 'Не придумывайте проблему ради того, чтобы что-нибудь срочно переделать.', 'После нового наблюдения или изменения снова пройдите диагностику.'),
  };

  function q(id, eyebrow, title, help, options) { return { id, type: 'single', eyebrow, title, help, options }; }
  function dynamicQ(id, eyebrow, title, help, optionsFn) { return { id, type: 'single', eyebrow, title, help, optionsFn }; }
  function multiQ(id, eyebrow, title, help, options) { return { id, type: 'multi', eyebrow, title, help, options }; }
  function textQ(id, eyebrow, title, help, placeholder) { return { id, type: 'text', eyebrow, title, help, placeholder }; }
  function card(title, summary, action, metric, dont, next) { return { title, summary, action, metric, dont, next }; }

  function getHistory() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; }
  }
  function saveHistory(item) {
    try {
      const history = getHistory();
      history.unshift(item);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history.slice(0, 12)));
      return true;
    } catch {
      return false;
    }
  }

  function showHome() {
    state.mode = null;
    state.answers = {};
    state.path = [];
    state.index = 0;
    state.result = null;
    state.followupBase = null;
    state.deepAdded = false;
    resetButton.hidden = true;
    const tpl = document.getElementById('homeTemplate').content.cloneNode(true);
    app.replaceChildren(tpl);
    const grid = document.getElementById('modeGrid');
    const history = getHistory();
    const modes = [
      { id: 'full', title: 'Проверить текущие продажи', text: 'Короткий скан всей системы, затем вопросы только по подозрительным участкам.' },
      { id: 'build', title: 'Проверить новый продукт или услугу', text: 'Для направления, которое ещё не имеет устойчивых продаж.' },
      { id: 'followup', title: 'Вернуться к прошлой диагностике', text: history.length ? `Есть сохранённый результат от ${formatDate(history[0].date)}.` : 'Появится после первой сохранённой диагностики.', disabled: !history.length },
    ];
    modes.forEach(m => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'mode-card'; b.disabled = !!m.disabled;
      b.innerHTML = `<strong>${m.title}</strong><span>${m.text}</span><span class="arrow">→</span>`;
      b.addEventListener('click', () => startMode(m.id));
      grid.appendChild(b);
    });
  }

  function startMode(mode) {
    state.mode = mode;
    state.answers = {};
    state.index = 0;
    state.result = null;
    state.deepAdded = false;
    resetButton.hidden = false;

    if (mode === 'followup') {
      const history = getHistory();
      state.followupBase = history[0] || null;
      state.path = ['fu_done', 'fu_effect', 'fu_guardrail'];
    } else {
      state.path = mode === 'build'
        ? ['scope_name', 'scope_model', 'scope_route', 'scope_period', 'period_integrity', 'period_context']
        : ['scope_goal', 'scope_name', 'scope_model', 'scope_route', 'scope_period', 'period_integrity', 'period_context'];
      if (mode === 'build') state.answers.scope_goal = 'launch';
      if (mode === 'full') {
        state.path.push('mode_sales', 'gate_legal', 'gate_fulfillment', 'gate_capacity', 'gate_economics',
          'core_demand','core_offer','core_fit','core_access','core_trust','core_conversion','core_start','core_value','core_repeat','core_data');
      } else {
        state.path.push('gate_legal','build_demand','build_offer','build_route','build_access','build_market','build_fulfillment','build_value','build_economics','build_capacity');
      }
    }
    renderQuestion();
  }

  function renderQuestion() {
    const id = state.path[state.index];
    const question = questions[id];
    if (!question) return finalizeDiagnosis();

    const tpl = document.getElementById('questionTemplate').content.cloneNode(true);
    app.replaceChildren(tpl);
    document.getElementById('progressBar').style.width = `${Math.round(((state.index + 1) / state.path.length) * 100)}%`;
    document.getElementById('progressLabel').textContent = `${state.index + 1} из ${state.path.length}`;
    document.getElementById('sectionLabel').textContent = sectionName(id);
    document.getElementById('questionEyebrow').textContent = resolve(question.eyebrow);
    document.getElementById('questionTitle').textContent = resolve(question.title);
    const help = resolve(question.help);
    const helpEl = document.getElementById('questionHelp');
    helpEl.textContent = help || '';
    helpEl.hidden = !help;

    const answerArea = document.getElementById('answerArea');
    const nextButton = document.getElementById('nextButton');
    const backButton = document.getElementById('backButton');
    backButton.disabled = state.index === 0;
    backButton.addEventListener('click', () => { state.index--; renderQuestion(); });
    nextButton.addEventListener('click', goNext);

    const current = state.answers[id];
    if (question.type === 'text') {
      const input = document.createElement('input');
      input.className = 'text-input'; input.type = 'text'; input.placeholder = question.placeholder || '';
      input.value = current || '';
      input.autocomplete = 'off';
      input.addEventListener('input', () => { state.answers[id] = input.value.trim(); nextButton.disabled = !state.answers[id]; });
      input.addEventListener('keydown', e => { if (e.key === 'Enter' && state.answers[id]) goNext(); });
      answerArea.appendChild(input);
      nextButton.disabled = !current;
      setTimeout(() => input.focus(), 0);
    } else {
      const options = question.optionsFn ? question.optionsFn(state) : question.options;
      options.forEach(o => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'option-card';
        const selected = question.type === 'multi' ? Array.isArray(current) && current.includes(o.value) : current === o.value;
        if (selected) b.classList.add('selected');
        b.innerHTML = `<span class="option-dot" aria-hidden="true"></span><span class="option-text"><strong>${o.label}</strong>${o.hint ? `<small>${o.hint}</small>` : ''}</span>`;
        b.addEventListener('click', () => {
          if (question.type === 'multi') {
            const arr = Array.isArray(state.answers[id]) ? [...state.answers[id]] : [];
            if (o.value === 'none') state.answers[id] = ['none'];
            else {
              const cleaned = arr.filter(v => v !== 'none');
              const ix = cleaned.indexOf(o.value);
              if (ix >= 0) cleaned.splice(ix, 1); else cleaned.push(o.value);
              state.answers[id] = cleaned;
            }
          } else state.answers[id] = o.value;
          renderQuestion();
        });
        answerArea.appendChild(b);
      });
      nextButton.disabled = question.type === 'multi' ? !(Array.isArray(current) && current.length) : current == null;
    }

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function goNext() {
    const currentId = state.path[state.index];
    if (!isAnswered(currentId)) return;

    // If a supposedly current business has no repeatable sales yet, switch to BUILD/HYBRID logic.
    if (state.mode === 'full' && currentId === 'mode_sales' && state.answers.mode_sales !== 'repeatable') {
      state.mode = 'build';
      state.deepAdded = false;
      state.path = state.path.slice(0, state.index + 1).concat([
        'gate_legal','build_demand','build_offer','build_route','build_access','build_market','build_fulfillment','build_value','build_economics','build_capacity'
      ]);
    }

    // Stop early in BUILD: the first failed meaningful gate is the current job.
    if (state.mode === 'build') {
      const early = buildEarlyResult(currentId);
      if (early) { state.result = makeResult(early); renderResult(state.result); return; }
    }

    // In a mature route, ask all four hard gates first, then stop if a blocker is already clear.
    if (state.mode === 'full' && currentId === 'gate_economics') {
      const blocker = hardGateResult();
      if (blocker) { state.result = makeResult(blocker); renderResult(state.result); return; }
    }

    // If the general scan already shows decision-critical uncertainty, stop before deep branches.
    if (state.mode === 'full' && currentId === 'core_data') {
      const gap = decisionCriticalUnknown();
      if (gap) { state.result = makeResult('DATA_GAP', [gap]); renderResult(state.result); return; }
    }

    if (state.index < state.path.length - 1) {
      state.index++;
      renderQuestion();
    } else {
      if (state.mode === 'full' && !state.deepAdded) {
        const deeper = chooseDeepBranches();
        if (deeper.length) {
          state.deepAdded = true;
          state.path.push(...deeper);
          state.index++;
          renderQuestion();
          return;
        }
      }
      finalizeDiagnosis();
    }
  }

  function hardGateResult() {
    const a = state.answers;
    if (a.gate_legal === 'yes') return 'LEGAL_SAFETY_BLOCKER';
    if (a.gate_fulfillment === 'regular') return 'FULFILLMENT';
    if (a.gate_economics === 'negative') return 'ECONOMICS';
    if (a.gate_capacity === 'overload') return 'CAPACITY';
    return '';
  }

  function buildEarlyResult(currentId) {
    const a = state.answers;
    if (currentId === 'gate_legal' && a.gate_legal === 'yes') return 'LEGAL_SAFETY_BLOCKER';
    const fail = {
      build_demand: () => !['yes'].includes(a.build_demand),
      build_offer: () => !['yes','mostly'].includes(a.build_offer),
      build_route: () => !['yes','mostly'].includes(a.build_route),
      build_access: () => !['yes','mostly'].includes(a.build_access),
      build_market: () => !['paid','action'].includes(a.build_market),
      build_fulfillment: () => a.build_fulfillment !== 'yes',
      build_value: () => a.build_value !== 'yes',
      build_economics: () => !['yes','maybe'].includes(a.build_economics),
      build_capacity: () => !['yes','small'].includes(a.build_capacity),
    };
    const codes = {
      build_demand:'BUILD_DEMAND', build_offer:'BUILD_OFFER', build_route:'BUILD_ROUTE', build_access:'BUILD_ACCESS',
      build_market:'BUILD_MARKET_TEST', build_fulfillment:'BUILD_FULFILLMENT', build_value:'BUILD_VALUE', build_economics:'BUILD_ECONOMICS', build_capacity:'BUILD_CAPACITY'
    };
    return fail[currentId] && fail[currentId]() ? codes[currentId] : '';
  }

  function chooseDeepBranches() {
    const candidates = collectCandidates();
    const selected = candidates.slice(0, 2).map(c => c.zone);
    const deepMap = {
      D: ['deep_d1','deep_d2','deep_d3'],
      O: ['deep_o1','deep_o2'],
      FIT: ['deep_fit1','deep_fit2'],
      A: ['deep_a1','deep_a2','deep_a3'],
      T: ['deep_t1','deep_t2'],
      C: ['deep_c1','deep_c2'],
      S: ['deep_s1','deep_s2'],
      F: ['deep_f1','deep_f2'],
      V: ['deep_v1','deep_v2'],
      R: ['deep_r1','deep_r2','deep_r3'],
      E: ['deep_e1','deep_e2'],
      CAP: ['deep_cap1','deep_cap2'],
    };
    return selected.flatMap(z => deepMap[z] || []);
  }

  function collectCandidates() {
    const a = state.answers;
    const list = [];
    pushCandidate(list, 'F', Math.max(severity(a.gate_fulfillment, { regular:4, sometimes:2, unknown:1 }), severity(a.core_fulfillment, { no:4, regular_problem:3 })), 95);
    pushCandidate(list, 'V', severity(a.core_value, { no:4, issues:3, unknown:1 }), 90);
    pushCandidate(list, 'E', Math.max(severity(a.gate_economics, { negative:4, low:3, mixed:2, unknown:1 }), severity(a.core_economics, { many:3, some:2, unknown:1 })), 88);
    pushCandidate(list, 'CAP', Math.max(severity(a.gate_capacity, { overload:4, limit:3, unknown:1 }), severity(a.core_capacity, { quality:4, rush:3 })), 86);
    pushCandidate(list, 'S', severity(a.core_start, { problem:4, losses:3, unknown:1 }), 82);
    pushCandidate(list, 'C', severity(a.core_conversion, { breaks:4, hard:3, unknown:1 }), 78);
    pushCandidate(list, 'T', severity(a.core_trust, { almost_always:4, often:3, unknown:1 }), 74);
    pushCandidate(list, 'FIT', severity(a.core_fit, { bad:4, half:3, unknown:1 }), 72);
    pushCandidate(list, 'O', severity(a.core_offer, { no:4, mostly_no:3, unknown:1 }), 70);
    pushCandidate(list, 'A', severity(a.core_access, { none:4, unstable:3, unknown:1 }), 68);
    pushCandidate(list, 'D', severity(a.core_demand, { rare:4, sometimes:2, new:2, unknown:1 }), 66);
    pushCandidate(list, 'R', severity(a.core_repeat, { rare:3, unknown:1 }), 45);

    const goalBoost = { new_sales:['A','D','O','FIT','T','C'], stable:['A','R','CAP'], income:['E','CAP','O'], overload:['CAP','F','E'], repeat:['R','V'], unknown:[] };
    const boost = goalBoost[a.scope_goal] || [];
    list.forEach(x => { if (boost.includes(x.zone)) x.rank += 7; });
    return list.filter(x => x.sev > 0).sort((x,y) => (y.sev*100 + y.rank) - (x.sev*100 + x.rank));
  }

  function pushCandidate(list, zone, sev, rank) { if (sev > 0) list.push({ zone, sev, rank }); }
  function severity(value, map) { return map[value] || 0; }

  function finalizeDiagnosis() {
    if (state.mode === 'followup') return finalizeFollowup();
    const diagnosis = state.mode === 'build' ? diagnoseBuild() : diagnoseFull();
    state.result = diagnosis;
    renderResult(diagnosis);
  }

  function diagnoseBuild() {
    const a = state.answers;
    if (a.gate_legal === 'yes') return makeResult('LEGAL_SAFETY_BLOCKER');
    const buildChecks = [
      ['build_demand', v => v === 'yes', 'BUILD_DEMAND'],
      ['build_offer', v => ['yes','mostly'].includes(v), 'BUILD_OFFER'],
      ['build_route', v => ['yes','mostly'].includes(v), 'BUILD_ROUTE'],
      ['build_access', v => ['yes','mostly'].includes(v), 'BUILD_ACCESS'],
      ['build_market', v => ['paid','action'].includes(v), 'BUILD_MARKET_TEST'],
      ['build_fulfillment', v => v === 'yes', 'BUILD_FULFILLMENT'],
      ['build_value', v => v === 'yes', 'BUILD_VALUE'],
      ['build_economics', v => ['yes','maybe'].includes(v), 'BUILD_ECONOMICS'],
      ['build_capacity', v => ['yes','small'].includes(v), 'BUILD_CAPACITY'],
    ];
    for (const [id, pass, code] of buildChecks) if (!pass(a[id])) return makeResult(code);
    return makeResult('NO_CRITICAL_CONSTRAINT_FOUND', ['Новый маршрут прошёл основные проверки первой версии. Следующий шаг — начать обычную диагностику уже на реальных повторяющихся продажах.']);
  }

  function diagnoseFull() {
    const a = state.answers;
    if (a.gate_legal === 'yes') return makeResult('LEGAL_SAFETY_BLOCKER');
    if (a.gate_fulfillment === 'regular' || a.core_fulfillment === 'no') return makeResult('FULFILLMENT');
    if (a.core_value === 'no') return makeResult('VALUE_FAILURE');
    if (a.gate_economics === 'negative') return makeResult('ECONOMICS');
    if (a.gate_capacity === 'overload' || a.core_capacity === 'quality') return makeResult('CAPACITY');

    const decisionGap = decisionCriticalUnknown();
    if (decisionGap) return makeResult('DATA_GAP', [decisionGap]);

    const candidates = collectCandidates();
    const zone = candidates[0]?.zone;
    let code = 'NO_CRITICAL_CONSTRAINT_FOUND';

    if (zone === 'D') code = diagnoseDemand();
    if (zone === 'O') code = 'OFFER';
    if (zone === 'FIT') code = 'FIT';
    if (zone === 'A') code = diagnoseAccess();
    if (zone === 'T') code = 'DECISION_GAP';
    if (zone === 'C') code = 'PURCHASE_FRICTION';
    if (zone === 'S') code = diagnoseStart();
    if (zone === 'F') code = 'FULFILLMENT';
    if (zone === 'V') code = 'VALUE_FAILURE';
    if (zone === 'R') code = diagnoseRepeat();
    if (zone === 'E') code = 'ECONOMICS';
    if (zone === 'CAP') code = 'CAPACITY';

    return makeResult(code);
  }

  function diagnoseDemand() {
    const a = state.answers;
    if (a.deep_d2 === 'ask_not_buy') return 'OFFER';
    if (a.deep_d2 === 'few_requests' && a.deep_d3 !== 'yes') return 'DEMAND_WEAK';
    if (a.deep_d2 === 'unknown' || a.core_access === 'unknown') return 'DEMAND_UNCLEAR';
    if (a.core_access === 'none' || a.deep_d3 === 'yes') return 'ACCESS';
    return 'DEMAND_UNCLEAR';
  }

  function diagnoseAccess() {
    const a = state.answers;
    if (a.deep_a2 === 'views_down') return 'DISTRIBUTION';
    if (a.deep_a2 === 'responses_down') return a.core_offer === 'no' || a.core_offer === 'mostly_no' ? 'OFFER' : 'DECISION_GAP';
    if (a.deep_a2 === 'buy_down') return a.core_conversion === 'hard' || a.core_conversion === 'breaks' ? 'PURCHASE_FRICTION' : 'DECISION_GAP';
    return 'ACCESS';
  }

  function diagnoseStart() {
    const a = state.answers;
    if (a.scope_model === 'EDUCATION') {
      if (a.deep_s1 === 'few') return 'ACTIVATION_FAILURE';
      if (a.deep_s2 === 'rare') return 'FIRST_VALUE_GAP';
    }
    return 'START_FAILURE';
  }
  function diagnoseRepeat() {
    const a = state.answers;
    if (a.deep_r1 === 'no' || a.core_repeat === 'na') return 'NO_CRITICAL_CONSTRAINT_FOUND';
    if (a.deep_r3 === 'no') return 'CUSTOMER_MEMORY_GAP';
    return 'NEXT_CYCLE';
  }

  function decisionCriticalUnknown() {
    const a = state.answers;
    const unknownCount = ['core_demand','core_offer','core_fit','core_access','core_trust','core_conversion','core_start','core_fulfillment','core_value','core_repeat','core_economics'].filter(id => a[id] === 'unknown').length;
    if (a.core_data === 'feelings' && unknownCount >= 3) return 'Слишком много ключевых ответов сейчас основано на ощущениях. Сначала нужен один факт, который отделит разные причины.';
    if (a.core_access === 'unknown' && a.core_demand === 'unknown') return 'Непонятно одновременно, есть ли реальный спрос и есть ли у вас доступ к нему. Эти две причины требуют разных действий.';
    if (a.gate_economics === 'unknown' && ['new_sales','income'].includes(a.scope_goal) && ['reserve','small_reserve'].includes(a.gate_capacity)) return 'Перед увеличением объёма нужно хотя бы грубо понимать, оставляет ли типичная продажа деньги после расходов и вашего времени.';
    return '';
  }

  function makeResult(code, extraWhy = []) {
    const base = adaptResultToModel(code, resultLibrary[code] || resultLibrary.NO_CRITICAL_CONSTRAINT_FOUND);
    return {
      code,
      ...base,
      confidence: confidenceFor(code),
      why: [...buildWhy(code), ...extraWhy].slice(0, 4),
      secondary: secondaryRisks(code),
      date: new Date().toISOString(),
    };
  }

  function adaptResultToModel(code, base) {
    const model = state.answers.scope_model;
    const out = { ...base };
    if (code === 'START_FAILURE') {
      if (model === 'APPOINTMENT') {
        out.title = 'Разберитесь, почему клиент записывается, но не приходит';
        out.summary = 'Запись происходит, но часть клиентов теряется до фактического визита.';
        out.action = 'Разберите реальные отмены, переносы и неявки и найдите самую частую устранимую причину.';
        out.metric = 'Пришли / записались. Отмены, переносы и неявки считать отдельно.';
      } else if (model === 'PRODUCT') {
        out.title = 'Разберитесь, почему оплаченный заказ не доходит до клиента';
        out.summary = 'Покупка происходит, но часть заказов теряется между оплатой и фактическим получением.';
        out.action = 'Разберите реальные случаи между оплатой и получением: подтверждение, готовность, выдачу, доставку и связь с клиентом.';
        out.metric = 'Успешно получили / оплаченные заказы.';
      } else if (model === 'EXPERT') {
        out.title = 'Разберитесь, почему работа не начинается после оплаты';
        out.summary = 'Клиент покупает услугу, но часть работ откладывается или срывается до фактического старта.';
        out.action = 'Разберите, что мешает перейти от оплаты к началу работы: подготовка, согласование, явка, материалы или расписание.';
        out.metric = 'Фактически начали работу / оплатили.';
      }
    }
    return out;
  }

  function buildWhy(code) {
    const a = state.answers;
    const lines = [];
    const add = (cond, text) => { if (cond) lines.push(text); };
    add(a.period_integrity && a.period_integrity !== 'normal', 'Выбранный период был не совсем обычным, поэтому сравнивать продажи нужно осторожно.');
    add(code === 'ACCESS' && ['none','unstable'].includes(a.core_access), 'Новых подходящих покупателей приходит мало или нерегулярно.');
    add(code === 'OFFER' && ['no','mostly_no'].includes(a.core_offer), 'Покупателю трудно быстро понять предложение и основные условия.');
    add(code === 'FIT' && ['half','bad'].includes(a.core_fit), 'Среди обращений заметно много людей, которым предложение изначально не подходит.');
    add(code === 'DECISION_GAP' && ['often','almost_always'].includes(a.core_trust), 'Перед покупкой повторяются одинаковые вопросы или сомнения.');
    add(code === 'PURCHASE_FRICTION' && ['hard','breaks'].includes(a.core_conversion), 'Даже готовая покупка или запись проходит с заметными сложностями.');
    add(['START_FAILURE','ACTIVATION_FAILURE','FIRST_VALUE_GAP'].includes(code) && ['losses','problem'].includes(a.core_start), 'Потери происходят уже после решения купить или записаться.');
    add(code === 'FULFILLMENT' && (a.gate_fulfillment === 'regular' || ['regular_problem','no'].includes(a.core_fulfillment)), 'Существующие продажи уже регулярно создают проблемы с выполнением обещанного.');
    add(code === 'VALUE_FAILURE' && ['issues','no'].includes(a.core_value), 'Есть признаки, что часть клиентов не получает ожидаемую пользу.');
    add(['NEXT_CYCLE','CUSTOMER_MEMORY_GAP'].includes(code) && a.core_repeat === 'rare', 'Естественный повтор возможен, но происходит редко.');
    add(code === 'ECONOMICS' && ['negative','low','mixed','unknown'].includes(a.gate_economics), 'Экономика части продаж слабая или пока неясна.');
    add(code === 'CAPACITY' && ['limit','overload'].includes(a.gate_capacity), 'Свободной мощности мало или её уже не хватает.');
    add(['DEMAND_WEAK','DEMAND_UNCLEAR'].includes(code) && ['rare','unknown'].includes(a.core_demand), 'Реальный спрос по выбранной ситуации пока виден слабо или неясно.');
    if (!lines.length) lines.push('Диагноз выбран по совокупности ваших ответов и приоритету более сильных ограничений над косметическими улучшениями.');
    return lines;
  }

  function secondaryRisks(primary) {
    const a = state.answers;
    const risks = [];
    const add = (code, text, cond) => { if (cond && code !== primary) risks.push(text); };
    add('ECONOMICS','Неясная или слабая экономика', ['low','mixed','unknown'].includes(a.gate_economics));
    add('CAPACITY','Небольшой запас мощности', ['limit'].includes(a.gate_capacity) || a.core_capacity === 'rush');
    add('ACCESS','Нестабильный приток новых покупателей', a.core_access === 'unstable');
    add('FIT','Много неподходящих обращений', ['half','bad'].includes(a.core_fit));
    add('R','Слабый повторный цикл', a.core_repeat === 'rare');
    add('K','Данные в основном по ощущениям', a.core_data === 'feelings');
    add('CHANNEL','Зависимость от одного источника', ['mostly','all'].includes(a.deep_a3));
    return risks.slice(0, 4);
  }

  function confidenceFor(code) {
    const a = state.answers;
    if (code === 'LEGAL_SAFETY_BLOCKER' || code === 'FULFILLMENT' && a.gate_fulfillment === 'regular' || code === 'CAPACITY' && a.gate_capacity === 'overload') return 'Высокая';
    if (state.mode === 'build') return 'Средняя';
    if (a.core_data === 'facts') return 'Высокая';
    if (a.core_data === 'mixed') return 'Средняя';
    return 'Низкая';
  }

  function finalizeFollowup() {
    const a = state.answers;
    const base = state.followupBase;
    let title, summary, action, metric, dont, next;
    const guard = Array.isArray(a.fu_guardrail) ? a.fu_guardrail : [];
    const guardProblem = guard.some(x => x !== 'none');
    if (a.fu_done === 'no') {
      title = 'Сначала нужно понять, что помешало выполнить действие';
      summary = 'Гипотезу нельзя оценивать, если сама проверка не состоялась.';
      action = 'Зафиксируйте, что именно помешало: время, деньги, техническая сложность, непонятная задача или другое ограничение. После этого упростите проверку.';
      metric = 'Удалось ли провести проверку в реальных условиях.';
      dont = 'Не объявляйте прошлую рекомендацию работающей или неработающей.';
      next = 'После нормальной проверки вернитесь и оцените результат.';
    } else if (a.fu_effect === 'better' && !guardProblem) {
      title = 'Изменение выглядит полезным';
      summary = 'Главный показатель улучшился, а защитные показатели по вашим ответам не пострадали.';
      action = 'Сохраните изменение как рабочее и запустите новую диагностику: теперь ограничение могло переместиться.';
      metric = 'Сохраняется ли эффект на следующих реальных случаях.';
      dont = 'Не масштабируйте резко только по одному удачному эпизоду.';
      next = 'Повторная диагностика покажет, что теперь ограничивает результат сильнее всего.';
    } else if (a.fu_effect === 'worse' || guardProblem) {
      title = 'Это изменение не стоит закреплять в нынешнем виде';
      summary = guardProblem ? 'Даже если локальный показатель улучшился, пострадал важный защитный показатель.' : 'Главный показатель ухудшился.';
      action = 'Остановите или откатите изменение, если это возможно. Сохраните вывод и пройдите диагностику заново с учётом нового факта.';
      metric = 'Возвращается ли система к нормальному уровню после отката.';
      dont = 'Не продолжайте действие только потому, что уже потратили на него время или деньги.';
      next = 'Новая диагностика должна проверить конкурирующую причину.';
    } else if (a.fu_effect === 'invalid') {
      title = 'Проверка получилась ненадёжной';
      summary = 'Условия не позволяют честно понять, помогло действие или нет.';
      action = 'Исправьте измерение или условия проверки и повторите только если ответ всё ещё влияет на решение.';
      metric = 'Надёжный результат следующей проверки.';
      dont = 'Не делайте вывод по испорченному тесту.';
      next = 'После нормального измерения вернитесь к результату.';
    } else {
      title = 'Пока рано объявлять победу или провал';
      summary = 'Существенной разницы пока не видно либо наблюдений мало.';
      action = 'Решите, даст ли ещё несколько реальных случаев полезную информацию. Если нет — лучше проверить следующую сильную гипотезу.';
      metric = 'Главный показатель из прошлой диагностики.';
      dont = 'Не растягивайте слабую проверку бесконечно.';
      next = 'После достаточного наблюдения сохраните вывод или начните новую диагностику.';
    }
    state.result = { code:'FOLLOWUP', title, summary, action, metric, dont, next, confidence:'—', why:[base ? `Прошлая диагностика: ${base.result?.title || base.title || 'сохранённый результат'}.` : 'Использован предыдущий сохранённый результат.'], secondary:[], date:new Date().toISOString(), followup:true };
    renderResult(state.result);
  }

  function renderResult(result) {
    const tpl = document.getElementById('resultTemplate').content.cloneNode(true);
    app.replaceChildren(tpl);
    document.getElementById('resultTitle').textContent = result.title;
    document.getElementById('resultSummary').textContent = result.summary;
    const badge = document.getElementById('confidenceBadge');
    badge.textContent = result.followup ? 'Повторная проверка' : `Уверенность вывода: ${result.confidence.toLowerCase()}`;
    const why = document.getElementById('resultWhy');
    result.why.forEach(x => { const d=document.createElement('div'); d.className='reason'; d.textContent=x; why.appendChild(d); });
    document.getElementById('resultAction').textContent = result.action;
    document.getElementById('resultMetric').textContent = result.metric;
    document.getElementById('resultDont').textContent = result.dont;
    document.getElementById('resultNext').textContent = result.next;

    const secCard = document.getElementById('secondaryCard');
    const sec = document.getElementById('secondaryRisks');
    if (!result.secondary?.length) secCard.hidden = true;
    else result.secondary.forEach(x => { const t=document.createElement('span'); t.className='tag'; t.textContent=x; sec.appendChild(t); });

    const saveButton = document.getElementById('saveResultButton');
    saveButton.textContent = result.followup ? 'Сохранить проверку' : 'Сохранить результат';
    saveButton.addEventListener('click', () => {
      const item = {
        appVersion: APP_VERSION,
        date: result.date,
        mode: state.mode,
        scope: state.answers.scope_name || state.followupBase?.scope || '',
        answers: state.answers,
        result,
      };
      const saved = saveHistory(item);
      const msg = document.getElementById('saveMessage');
      msg.hidden = false;
      if (saved) {
        msg.textContent = 'Результат сохранён в этом браузере.';
        saveButton.disabled = true;
      } else {
        msg.textContent = 'Браузер не разрешил сохранить историю. Скопируйте результат, чтобы не потерять его.';
      }
    });
    document.getElementById('restartResultButton').addEventListener('click', showHome);
    document.getElementById('copyResultButton').addEventListener('click', async () => {
      const text = resultText(result);
      try {
        await navigator.clipboard.writeText(text);
        document.getElementById('copyResultButton').textContent = 'Скопировано';
      } catch {
        window.prompt('Скопируйте результат:', text);
      }
    });
    resetButton.hidden = false;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resultText(r) {
    return `${r.title}

Почему:
${r.why.map(x=>'• '+x).join('
')}

Что сделать:
${r.action}

Что смотреть:
${r.metric}

Пока не делать:
${r.dont}

Что дальше:
${r.next}`;
  }

  function isAnswered(id) {
    const v = state.answers[id];
    if (Array.isArray(v)) return v.length > 0;
    return v !== undefined && v !== null && String(v).trim() !== '';
  }
  function resolve(value) { return typeof value === 'function' ? value(state) : value; }
  function sectionName(id) {
    if (id.startsWith('scope') || id.startsWith('period') || id.startsWith('mode')) return 'Контекст';
    if (id.startsWith('gate')) return 'Защитная проверка';
    if (id.startsWith('core')) return 'Общий скан';
    if (id.startsWith('deep')) return 'Уточнение';
    if (id.startsWith('build')) return 'Новый продукт';
    if (id.startsWith('fu')) return 'Повторная проверка';
    return '';
  }
  function formatDate(iso) { try { return new Intl.DateTimeFormat('ru-RU', { day:'numeric', month:'long', year:'numeric' }).format(new Date(iso)); } catch { return ''; } }

  resetButton.addEventListener('click', showHome);
  brandButton.addEventListener('click', showHome);
  showHome();
})();

</script>
</body>
</html>
