<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#f6f4ef" />
  <meta name="description" content="Практический инструмент для проверки продаж у мастеров, услуг, экспертов и обучения." />
  <title>Диагностика системы продаж</title>
  <style>
:root {
  --bg: #f6f4ef;
  --surface: #fffdf9;
  --surface-2: #f0ede6;
  --text: #1f2421;
  --muted: #686b67;
  --line: #ddd8cf;
  --accent: #253a33;
  --accent-soft: #e5ece8;
  --warning: #775f2d;
  --warning-soft: #f5ecd3;
  --danger: #7a3737;
  --danger-soft: #f4e2e2;
  --ok: #315b45;
  --ok-soft: #e2eee7;
  --shadow: 0 12px 35px rgba(42, 40, 35, .08);
  --radius: 22px;
  --max: 760px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.5;
}
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: 3px solid rgba(37,58,51,.22);
  outline-offset: 2px;
}

.app-shell { min-height: 100vh; display: flex; flex-direction: column; }
.topbar {
  width: min(100%, calc(var(--max) + 48px));
  margin: 0 auto;
  padding: 16px 24px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.brand {
  border: 0;
  background: transparent;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: inherit;
  padding: 0;
  text-align: left;
}
.brand-logo { width: 42px; height: 42px; object-fit: contain; }
.brand-text { display: grid; gap: 0; }
.brand-text strong { font-size: 14px; }
.brand-text small { font-size: 12px; color: var(--muted); }

.app {
  width: min(100%, calc(var(--max) + 48px));
  margin: 0 auto;
  padding: 12px 24px 32px;
  flex: 1;
}
.card {
  background: var(--surface);
  border: 1px solid rgba(63,58,49,.09);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.hero { padding: clamp(24px, 6vw, 48px); }
.eyebrow {
  margin-bottom: 10px;
  color: var(--accent);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .06em;
  text-transform: uppercase;
}
h1, h2, p { margin-top: 0; }
h1 {
  margin-bottom: 16px;
  font-size: clamp(30px, 7vw, 48px);
  line-height: 1.05;
  letter-spacing: -.035em;
}
h2 { font-size: 20px; line-height: 1.2; margin-bottom: 14px; }
.lead { font-size: 18px; color: #454944; max-width: 62ch; margin-bottom: 28px; }
.note-box {
  margin-top: 24px;
  padding: 16px 18px;
  border-radius: 16px;
  background: var(--surface-2);
  color: #4e514d;
  font-size: 14px;
}

.mode-grid { display: grid; gap: 12px; }
.mode-card {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: #fff;
  padding: 18px;
  text-align: left;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px 16px;
  align-items: center;
  transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.mode-card:hover { transform: translateY(-1px); border-color: #a9b4ae; box-shadow: 0 8px 18px rgba(42,40,35,.05); }
.mode-card strong { font-size: 17px; }
.mode-card span { color: var(--muted); font-size: 14px; grid-column: 1; }
.mode-card .arrow { grid-column: 2; grid-row: 1 / span 2; font-size: 24px; color: var(--accent); }
.mode-card[disabled] { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }

.wizard-card { overflow: hidden; }
.progress-wrap { padding: 18px 22px 0; }
.progress-track { height: 6px; border-radius: 99px; background: #ebe7df; overflow: hidden; }
.progress-bar { height: 100%; width: 0; border-radius: inherit; background: var(--accent); transition: width .25s ease; }
.progress-meta { display: flex; justify-content: space-between; gap: 12px; padding-top: 8px; color: var(--muted); font-size: 12px; }
.question-wrap { padding: clamp(26px, 7vw, 54px) clamp(22px, 6vw, 48px) 26px; min-height: 430px; }
.question-title { font-size: clamp(27px, 6vw, 40px); max-width: 18ch; }
.question-help { color: var(--muted); max-width: 62ch; margin-bottom: 24px; }
.answer-area { display: grid; gap: 10px; }
.option-card {
  position: relative;
  width: 100%;
  min-height: 58px;
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 15px;
  padding: 14px 16px;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--text);
}
.option-card:hover { border-color: #a6b1ab; }
.option-card.selected { border: 2px solid var(--accent); padding: 13px 15px; background: var(--accent-soft); }
.option-dot {
  width: 20px; height: 20px; border-radius: 50%; border: 2px solid #9c9d98; flex: 0 0 auto;
  display: grid; place-items: center;
}
.option-card.selected .option-dot { border-color: var(--accent); }
.option-card.selected .option-dot::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
.option-text strong { display: block; font-size: 16px; }
.option-text small { display: block; color: var(--muted); margin-top: 2px; }

.text-input, .select-input {
  width: 100%;
  min-height: 54px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #fff;
  padding: 14px 15px;
  color: var(--text);
}
.text-input::placeholder { color: #9a9b96; }
.input-note { color: var(--muted); font-size: 13px; margin-top: 8px; }

.wizard-actions {
  border-top: 1px solid #ece8e0;
  padding: 16px 22px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
}
.primary-btn, .ghost-btn {
  min-height: 48px;
  border-radius: 13px;
  padding: 0 18px;
  font-weight: 750;
}
.primary-btn { border: 1px solid var(--accent); background: var(--accent); color: white; }
.primary-btn:disabled { opacity: .38; cursor: not-allowed; }
.ghost-btn { border: 1px solid var(--line); background: transparent; color: var(--text); }

.result-stack { display: grid; gap: 14px; }
.result-hero { padding: clamp(25px, 6vw, 44px); background: var(--accent); color: white; }
.result-hero .eyebrow { color: #c9d8d0; }
.result-hero h1 { font-size: clamp(30px, 7vw, 46px); margin-bottom: 12px; }
.result-summary { max-width: 62ch; font-size: 18px; color: #edf2ef; }
.confidence { display: inline-flex; margin-top: 8px; border-radius: 999px; padding: 7px 11px; background: rgba(255,255,255,.12); font-size: 13px; font-weight: 700; }
.result-card { padding: 24px; }
.reason-list { display: grid; gap: 10px; }
.reason {
  display: flex; gap: 10px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid #eeeae2;
}
.reason:last-child { border-bottom: 0; }
.reason::before { content: "•"; font-weight: 900; color: var(--accent); }
.action-card { border-color: #cbd9d1; }
.action-text { font-size: 18px; line-height: 1.6; white-space: pre-line; }
.metric-box { margin-top: 18px; background: var(--accent-soft); border-radius: 15px; padding: 15px 16px; display: grid; gap: 4px; }
.metric-box span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; font-weight: 800; }
.metric-box strong { font-size: 16px; white-space: pre-line; }
.tag-list { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { border: 1px solid var(--line); border-radius: 999px; padding: 7px 10px; background: #fff; font-size: 13px; }
.result-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.microcopy { margin: 10px 0 0; color: var(--ok); font-size: 13px; }

.status-card { padding: 18px; border-radius: 16px; margin-top: 12px; }
.status-card.ok { background: var(--ok-soft); color: var(--ok); }
.status-card.warn { background: var(--warning-soft); color: var(--warning); }
.status-card.danger { background: var(--danger-soft); color: var(--danger); }

.footer {
  width: min(100%, calc(var(--max) + 48px));
  margin: 0 auto;
  padding: 0 24px 28px;
  color: var(--muted);
  font-size: 12px;
}
.footer p { margin: 0; }

@media (max-width: 640px) {
  .topbar { padding: 12px 14px 6px; }
  .app { padding: 8px 12px 24px; }
  .footer { padding: 0 14px 22px; }
  .brand-text small { display: none; }
  .top-reset { min-height: 40px; padding: 0 12px; font-size: 13px; }
  .hero { border-radius: 18px; }
  .wizard-card { border-radius: 18px; }
  .question-wrap { min-height: 420px; }
  .wizard-actions { position: sticky; bottom: 0; background: rgba(255,253,249,.96); backdrop-filter: blur(10px); }
  .primary-btn, .ghost-btn { flex: 1; }
  .result-actions .primary-btn, .result-actions .ghost-btn { flex: 1 1 100%; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
}

</style>
</head>

  function q(id, eyebrow, title, help, options) { return { id, type: 'single', eyebrow, title, help, options }; }
  function dynamicQ(id, eyebrow, title, help, optionsFn) { return { id, type: 'single', eyebrow, title, help, optionsFn }; }
  function multiQ(id, eyebrow, title, help, options) { return { id, type: 'multi', eyebrow, title, help, options }; }
  function dynamicMultiQ(id, eyebrow, title, help, optionsFn) { return { id, type: 'multi', eyebrow, title, help, optionsFn }; }
  function textQ(id, eyebrow, title, help, placeholder) { return { id, type: 'text', eyebrow, title, help, placeholder }; }
  function numberQ(id, eyebrow, title, help, placeholder, numericKind = 'count') { return { id, type: 'number', eyebrow, title, help, placeholder, numericKind }; }
  function dynamicNumberQ(id, eyebrow, title, help, placeholder, numericKind = 'count') { return { id, type: 'number', eyebrow, title, help, placeholder, numericKind }; }
  function card(title, summary, action, metric, dont, next) { return { title, summary, action, metric, dont, next }; }

  function emptyHistoryStore() {
    return {
      schemaVersion:HISTORY_SCHEMA_VERSION,
      cycles:[],
      activeCycleIds:[],
      lastActiveCycleId:null,
      legacyMigratedAt:null,
      updatedAt:new Date().toISOString()
    };
  }

  function readLegacyHistory() {
    try {
      const parsed = JSON.parse(localStorage.getItem(LEGACY_STORAGE_KEY) || '[]');
      return Array.isArray(parsed) ? parsed : [];
    } catch {
      return [];
    }
  }

  function legacyCycleFromItem(item, index) {
    const date = item?.date || item?.result?.date || new Date().toISOString();
    return {
      cycleId:'legacy_' + index + '_' + String(date).replace(/[^0-9]/g,'').slice(0,14),
      scopeId:null,
      schemaVersion:HISTORY_SCHEMA_VERSION,
      legacyReadonly:true,
      status:'LEGACY_READONLY',
      createdAt:date,
      updatedAt:date,
      appVersion:item?.appVersion || 'legacy',
      scope:{
        name:item?.scope || item?.answers?.scope_name || '',
        businessGoal:item?.answers?.scope_goal || item?.result?.businessGoal || null,
        diagnosticTarget:item?.answers?.scope_target || item?.result?.diagnosticTarget || null,
        diagnosticMode:item?.mode || item?.result?.diagnosticMode || null
      },
      answers:null,
      result:item?.result || null,
      precisionSnapshots:item?.result?.precisionSnapshot ? [item.result.precisionSnapshot] : [],
      experimentPlan:item?.experimentPlan || item?.result?.experimentPlan || null,
      followups:item?.result?.followupSnapshot ? [item.result.followupSnapshot] : [],
      transition:item?.result?.stateTransition || null,
      parentCycleId:null,
      nextCycleId:null
    };
  }

  function migrateLegacyHistory(store) {
    if (store.legacyMigratedAt) return store;
    const legacy = readLegacyHistory();
    const knownResultIds = new Set(store.cycles.map(c => c.result?.resultId).filter(Boolean));
    legacy.forEach((item,index) => {
      const resultId = item?.result?.resultId;
      if (resultId && knownResultIds.has(resultId)) return;
      store.cycles.push(legacyCycleFromItem(item,index));
    });
    store.legacyMigratedAt = new Date().toISOString();
    return store;
  }

  function loadHistoryStore() {
    let store;
    try {
      const parsed = JSON.parse(localStorage.getItem(HISTORY_STORAGE_KEY) || 'null');
      store = parsed && parsed.schemaVersion === HISTORY_SCHEMA_VERSION && Array.isArray(parsed.cycles)
        ? parsed
        : emptyHistoryStore();
    } catch {
      store = emptyHistoryStore();
    }
    store = migrateLegacyHistory(store);
    store.activeCycleIds = Array.isArray(store.activeCycleIds) ? store.activeCycleIds : [];
    return store;
  }

  function isOpenCycleStatus(status) {
    return [CYCLE_STATUS.DIAGNOSED,CYCLE_STATUS.PLANNED,CYCLE_STATUS.ACTIVE,CYCLE_STATUS.WAITING_FOR_EVIDENCE,CYCLE_STATUS.FOLLOWUP_DUE].includes(status);
  }

  function pruneHistoryStore(store) {
    const active = store.cycles.filter(cycle => isOpenCycleStatus(cycle.status));
    const closed = store.cycles
      .filter(cycle => !isOpenCycleStatus(cycle.status))
      .sort((a,b) => String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')));
    const keptClosed = closed.slice(0, Math.max(0, HISTORY_MAX_CYCLES - active.length));
    store.cycles = [...active, ...keptClosed].sort((a,b) => String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')));
    store.activeCycleIds = store.cycles.filter(cycle => isOpenCycleStatus(cycle.status)).map(cycle => cycle.cycleId);
    if (store.lastActiveCycleId && !store.cycles.some(c => c.cycleId === store.lastActiveCycleId)) store.lastActiveCycleId = null;
    return store;
  }

  function writeHistoryStore(store) {
    try {
      store.updatedAt = new Date().toISOString();
      pruneHistoryStore(store);
      localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(store));
      return true;
    } catch {
      return false;
    }
  }

  function cycleAdapter(cycle) {
    if (!cycle) return null;
    return {
      cycleId:cycle.cycleId,
      appVersion:cycle.appVersion,
      date:cycle.updatedAt || cycle.createdAt,
      mode:cycle.scope?.diagnosticMode || cycle.result?.diagnosticMode || null,
      scope:cycle.scope?.name || '',
      answers:cycle.answers || {},
      result:cycle.result || null,
      experimentPlan:cycle.experimentPlan || cycle.result?.experimentPlan || null,
      cycleStatus:cycle.status,
      precisionSnapshots:cycle.precisionSnapshots || [],
      followups:cycle.followups || [],
      transition:cycle.transition || null,
      legacyReadonly:!!cycle.legacyReadonly
    };
  }

  function getHistory() {
    return loadHistoryStore().cycles.map(cycleAdapter);
  }

  function resolveCycleForItem(store, item) {
    if (item?.cycleId) {
      const direct = store.cycles.find(c => c.cycleId === item.cycleId);
      if (direct) return direct;
    }
    const experimentId = item?.experimentPlan?.experimentId || item?.result?.followupSnapshot?.experimentId || item?.result?.experimentPlan?.experimentId;
    if (experimentId) {
      const byExperiment = store.cycles.find(c => c.experimentPlan?.experimentId === experimentId);
      if (byExperiment) return byExperiment;
    }
    const resultId = item?.result?.resultId;
    if (resultId) {
      const byResult = store.cycles.find(c => c.result?.resultId === resultId);
      if (byResult) return byResult;
    }
    return null;
  }

  function createCycleFromItem(item) {
    const now = new Date().toISOString();
    const cycleId = 'cycle_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
    const scopeId = state.scopeId || ('scope_' + Date.now() + '_' + Math.random().toString(36).slice(2,7));
    state.scopeId = scopeId;
    state.activeCycleId = cycleId;
    return {
      cycleId,
      scopeId,
      schemaVersion:HISTORY_SCHEMA_VERSION,
      legacyReadonly:false,
      status:item?.cycleStatus || CYCLE_STATUS.DIAGNOSED,
      createdAt:item?.date || now,
      updatedAt:now,
      appVersion:item?.appVersion || APP_VERSION,
      scope:{
        name:item?.scope || item?.answers?.scope_name || '',
        businessGoal:item?.result?.businessGoal || item?.answers?.scope_goal || null,
        diagnosticTarget:item?.result?.diagnosticTarget || item?.answers?.scope_target || null,
        diagnosticMode:item?.result?.diagnosticMode || item?.mode || null
      },
      answers:item?.answers ? {...item.answers} : {},
      result:item?.result || null,
      precisionSnapshots:item?.result?.precisionSnapshot ? [item.result.precisionSnapshot] : [],
      experimentPlan:item?.experimentPlan || item?.result?.experimentPlan || null,
      followups:item?.result?.followupSnapshot ? [item.result.followupSnapshot] : [],
      transition:item?.result?.stateTransition || null,
      parentCycleId:item?.parentCycleId || state.parentCycleId || null,
      nextCycleId:null
    };
  }

  function mergeItemIntoCycle(cycle, item) {
    cycle.updatedAt = new Date().toISOString();
    cycle.appVersion = item?.appVersion || cycle.appVersion || APP_VERSION;
    cycle.status = item?.cycleStatus || cycle.status;
    if (item?.scope || item?.answers || item?.result) {
      cycle.scope = {
        ...(cycle.scope || {}),
        name:item?.scope || item?.answers?.scope_name || cycle.scope?.name || '',
        businessGoal:item?.result?.businessGoal || item?.answers?.scope_goal || cycle.scope?.businessGoal || null,
        diagnosticTarget:item?.result?.diagnosticTarget || item?.answers?.scope_target || cycle.scope?.diagnosticTarget || null,
        diagnosticMode:item?.result?.diagnosticMode || item?.mode || cycle.scope?.diagnosticMode || null
      };
    }
    if (item?.answers) cycle.answers = {...item.answers};
    if (item?.result) cycle.result = item.result;
    const precision = item?.result?.precisionSnapshot;
    if (precision && !(cycle.precisionSnapshots || []).some(x => x.precisionCode === precision.precisionCode)) {
      cycle.precisionSnapshots = [...(cycle.precisionSnapshots || []), precision];
    }
    const experiment = item?.experimentPlan || item?.result?.experimentPlan;
    if (experiment) cycle.experimentPlan = experiment;
    const followup = item?.result?.followupSnapshot;
    if (followup && !(cycle.followups || []).some(x => x.followupId === followup.followupId)) {
      cycle.followups = [...(cycle.followups || []), followup];
    }
    if (item?.result?.stateTransition) cycle.transition = item.result.stateTransition;
    return cycle;
  }

  function saveHistory(item) {
    const store = loadHistoryStore();
    let cycle = resolveCycleForItem(store,item);
    if (cycle?.legacyReadonly) cycle = null;
    if (!cycle) {
      cycle = createCycleFromItem(item);
      store.cycles.unshift(cycle);
    } else {
      mergeItemIntoCycle(cycle,item);
      state.activeCycleId = cycle.cycleId;
      state.scopeId = cycle.scopeId || state.scopeId;
    }
    if (isOpenCycleStatus(cycle.status)) store.lastActiveCycleId = cycle.cycleId;
    else if (store.lastActiveCycleId === cycle.cycleId) store.lastActiveCycleId = null;
    return writeHistoryStore(store);
  }

  function deleteCycle(cycleId) {
    const store = loadHistoryStore();
    const cycle = store.cycles.find(c => c.cycleId === cycleId);
    if (!cycle || isOpenCycleStatus(cycle.status)) return false;
    store.cycles = store.cycles.filter(c => c.cycleId !== cycleId);
    return writeHistoryStore(store);
  }

  function clearClosedHistory() {
    const store = loadHistoryStore();
    store.cycles = store.cycles.filter(cycle => isOpenCycleStatus(cycle.status));
    return writeHistoryStore(store);
  }

  function exportHistory() {
    const store = loadHistoryStore();
    const payload = {
      exportVersion:1,
      exportedAt:new Date().toISOString(),
      historySchemaVersion:store.schemaVersion,
      cycles:store.cycles
    };
    try {
      const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const link=document.createElement('a');
      link.href=url;
      link.download='sales-diagnostic-history.json';
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      return true;
    } catch {
      return false;
    }
  }

  function resumeCycle(cycleId) {
    const store = loadHistoryStore();
    const cycle = store.cycles.find(c => c.cycleId === cycleId);
    if (!cycle || cycle.legacyReadonly) return false;
    state.activeCycleId = cycle.cycleId;
    state.scopeId = cycle.scopeId || null;
    state.parentCycleId = cycle.parentCycleId || null;
    state.answers = {...(cycle.answers || {})};
    state.businessGoal = cycle.scope?.businessGoal || state.answers.scope_goal || null;
    state.diagnosticTarget = cycle.scope?.diagnosticTarget || state.answers.scope_target || null;
    state.diagnosticMode = cycle.scope?.diagnosticMode || cycle.result?.diagnosticMode || null;
    state.mode = state.diagnosticMode;
    state.result = cycle.result || null;
    state.activeExperiment = cycle.experimentPlan || null;
    state.followupBase = cycleAdapter(cycle);
    if (cycle.result) {
      renderResult(cycle.result);
      return true;
    }
    return false;
  }

  function startLinkedCycle(parentCycleId, nextResult) {
    const store = loadHistoryStore();
    const parent = store.cycles.find(c => c.cycleId === parentCycleId);
    if (!parent || !nextResult) return false;
    state.activeCycleId = null;
    state.parentCycleId = parentCycleId;
    state.scopeId = parent.scopeId || state.scopeId;
    state.answers = {...(parent.answers || {})};
    state.businessGoal = parent.scope?.businessGoal || null;
    state.diagnosticTarget = parent.scope?.diagnosticTarget || null;
    state.diagnosticMode = nextResult.diagnosticMode || parent.scope?.diagnosticMode || null;
    state.mode = state.diagnosticMode;
    state.result = nextResult;
    const item = {
      parentCycleId,
      appVersion:APP_VERSION,
      date:nextResult.date || new Date().toISOString(),
      mode:state.mode,
      scope:parent.scope?.name || '',
      answers:state.answers,
      result:nextResult,
      experimentPlan:nextResult.experimentPlan || null,
      cycleStatus:nextResult.experimentPlan ? CYCLE_STATUS.PLANNED : CYCLE_STATUS.DIAGNOSED
    };
    const saved = saveHistory(item);
    if (!saved) return false;
    const refreshed = loadHistoryStore();
    const child = refreshed.cycles.find(c => c.cycleId === state.activeCycleId);
    parent.nextCycleId = child?.cycleId || null;
    writeHistoryStore(refreshed);
    renderResult(nextResult);
    return true;
  }

    state.diagnosticMode = null;
    state.entryMode = null;
    state.businessGoal = null;
    state.diagnosticTarget = null;
    state.maturityState = null;
    state.answers = {};
    state.path = [];
    state.index = 0;
    state.result = null;
    state.followupBase = null;
    state.deepAdded = false;
    state.precisionBase = null;
    state.precisionOriginMode = null;
    state.precisionSnapshot = null;
    state.precisionExcludedZones = [];
    state.activeExperiment = null;
    state.activeCycleId = null;
    state.scopeId = null;
    state.parentCycleId = null;
    resetButton.hidden = true;
    const tpl = document.getElementById('homeTemplate').content.cloneNode(true);

          resume.addEventListener('click',()=>resumeCycle(cycle.cycleId));

  function setDiagnosticMode(mode) {
    state.diagnosticMode = mode;
    state.mode = mode; // compatibility with the v1.8 diagnosis/render layer
  }

  function resolveDiagnosticMode(maturityState) {
    if (maturityState === MATURITY_STATE.REPEATABLE) return DIAGNOSTIC_MODE.FULL;
    if (maturityState === MATURITY_STATE.CHANGED) return DIAGNOSTIC_MODE.HYBRID;
    return DIAGNOSTIC_MODE.BUILD;
  }

  function invalidateDownstreamAnswers(fromIndex = state.index) {
    const staleIds = state.path.slice(fromIndex + 1);
    staleIds.forEach(id => { delete state.answers[id]; });
    state.result = null;
    state.deepAdded = false;
  }

  function progressMeta(id) {
    if (state.mode === DIAGNOSTIC_MODE.PRECISION) return { label:'Проверяем вывод цифрами', percent:75 };
    if (state.mode === DIAGNOSTIC_MODE.FOLLOWUP) return { label:'Проверяем прошлое изменение', percent:70 };
    if (/^(scope_|maturity_state)/.test(id)) return { label:'Что проверяем', percent:15 };
    if (/^(period_|gate_|shared_)/.test(id)) return { label:'Что происходит сейчас', percent:35 };
    if (/^core_/.test(id)) return { label:'Проверяем ключевой участок', percent:55 };
    if (/^(deep_|post_|sub_)/.test(id)) return { label:'Уточняем причину', percent:75 };
    if (/^(build_|hybrid_|inheritance_)/.test(id)) {
      return state.mode === DIAGNOSTIC_MODE.HYBRID
        ? { label:'Что нужно перепроверить', percent:60 }
        : { label:'Проверяем следующий шаг запуска', percent:60 };
    }
    return { label:'Диагностика', percent:50 };
  }

  function latestFollowupBase() {
    const store = loadHistoryStore();
    const cycle = store.cycles.find(item =>
      !item.legacyReadonly &&
      item.experimentPlan?.experimentId &&
      [CYCLE_STATUS.ACTIVE,CYCLE_STATUS.WAITING_FOR_EVIDENCE,CYCLE_STATUS.FOLLOWUP_DUE].includes(item.status)
    );
    return cycle ? cycleAdapter(cycle) : null;
  }

  function startMode(mode) {
    state.entryMode = mode;
    state.answers = {};
    state.index = 0;
    state.result = null;
    state.deepAdded = false;
    state.businessGoal = null;
    state.diagnosticTarget = null;
    state.maturityState = null;
    state.activeCycleId = null;
    state.scopeId = mode === DIAGNOSTIC_MODE.FOLLOWUP ? null : ('scope_' + Date.now() + '_' + Math.random().toString(36).slice(2,7));
    resetButton.hidden = false;

    if (mode === DIAGNOSTIC_MODE.FOLLOWUP) {
      setDiagnosticMode(DIAGNOSTIC_MODE.FOLLOWUP);
      state.followupBase = latestFollowupBase();
      if (!state.followupBase) return showHome();
      state.activeCycleId = state.followupBase.cycleId || null;
      state.scopeId = loadHistoryStore().cycles.find(c => c.cycleId === state.activeCycleId)?.scopeId || null;
      state.activeExperiment = state.followupBase?.experimentPlan || null;
      state.path = ['fu_done'];
    } else {
      // FULL/BUILD is resolved from maturity, not from the home-card label.
      state.mode = mode; // temporary compatibility until maturity_state is answered
      state.diagnosticMode = null;
      state.path = ['scope_goal', 'scope_name', 'scope_model', 'scope_target', 'maturity_state'];
    }
    renderQuestion();
  }

  function renderQuestion() {
    const id = state.path[state.index];
    const question = questions[id];
    if (!question) return finalizeDiagnosis();

    const tpl = document.getElementById('questionTemplate').content.cloneNode(true);
    app.replaceChildren(tpl);
    const progress = progressMeta(id);
    document.getElementById('progressBar').style.width = `${progress.percent}%`;
    document.getElementById('progressLabel').textContent = progress.label;
    document.getElementById('sectionLabel').textContent = sectionName(id);
    document.getElementById('questionEyebrow').textContent = resolve(question.eyebrow);
    document.getElementById('questionTitle').textContent = resolve(question.title);
    const help = resolve(question.help);
    const helpEl = document.getElementById('questionHelp');
    helpEl.textContent = help || '';
    helpEl.hidden = !help;

    const answerArea = document.getElementById('answerArea');
    const nextButton = document.getElementById('nextButton');
    const backButton = document.getElementById('backButton');
    backButton.disabled = state.index === 0;
    backButton.addEventListener('click', () => { state.index--; renderQuestion(); });
    nextButton.addEventListener('click', goNext);

    const current = state.answers[id];
    if (question.type === 'text' || question.type === 'number') {
      const input = document.createElement('input');
      input.className = 'text-input';
      input.type = question.type === 'number' ? 'text' : 'text';
      input.inputMode = question.type === 'number' ? 'decimal' : 'text';
      input.placeholder = question.placeholder || '';
      input.value = current ?? '';
      input.autocomplete = 'off';
      const updateInput = () => {
        const previous = state.answers[id];
        const raw = input.value.trim();
        if (question.type === 'number') {
          const normalized = raw.replace(',', '.').replace(/\s+/g, '');
          const num = normalized === '' ? null : Number(normalized);
          const valid = num !== null && Number.isFinite(num) && num >= 0 && (question.numericKind !== 'count' || Number.isInteger(num));
          if (valid) state.answers[id] = num;
          else delete state.answers[id];
          nextButton.disabled = !valid;
        } else {
          state.answers[id] = raw;
          nextButton.disabled = !raw;
        }
        if (previous !== state.answers[id]) invalidateDownstreamAnswers(state.index);
      };
      input.addEventListener('input', updateInput);
      input.addEventListener('keydown', e => { if (e.key === 'Enter' && isAnswered(id)) goNext(); });
      answerArea.appendChild(input);
      nextButton.disabled = !isAnswered(id);
      setTimeout(() => input.focus(), 0);
    } else {
      const options = question.optionsFn ? question.optionsFn(state) : question.options;
      options.forEach(o => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'option-card';
        const selected = question.type === 'multi' ? Array.isArray(current) && current.includes(o.value) : current === o.value;
        if (selected) b.classList.add('selected');
        b.innerHTML = `<span class="option-dot" aria-hidden="true"></span><span class="option-text"><strong>${o.label}</strong>${o.hint ? `<small>${o.hint}</small>` : ''}</span>`;
        b.addEventListener('click', () => {
          const previous = JSON.stringify(state.answers[id]);
          if (question.type === 'multi') {
            const arr = Array.isArray(state.answers[id]) ? [...state.answers[id]] : [];
            if (['none','unknown','normal'].includes(o.value)) state.answers[id] = [o.value];
            else {
              const cleaned = arr.filter(v => !['none','unknown','normal'].includes(v));
              const ix = cleaned.indexOf(o.value);
              if (ix >= 0) cleaned.splice(ix, 1); else cleaned.push(o.value);
              state.answers[id] = cleaned;
            }
          } else state.answers[id] = o.value;
          if (previous !== JSON.stringify(state.answers[id])) invalidateDownstreamAnswers(state.index);
          renderQuestion();
        });
        answerArea.appendChild(b);
      });
      nextButton.disabled = question.type === 'multi' ? !(Array.isArray(current) && current.length) : current == null;
    }

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  const CANDIDATE_TIER = Object.freeze({
    SAFETY: 0,
    HARD_BLOCKER: 1,
    TARGET_CRITICAL: 2,
    MODERATE: 3,
    OPPORTUNITY: 4,
  });

  function fullQuestionsForTarget(s = state) {
    const a = s.answers;
    const goal = a.scope_goal;
    const target = a.scope_target;
    const model = a.scope_model;
    const out = ['gate_legal'];
    const add = (...ids) => ids.forEach(id => { if (!out.includes(id)) out.push(id); });

    if (goal === 'income') {
      add('gate_economics','gate_capacity');
      if (target === 'revenue') add('core_access','core_offer');
      return out;
    }
    if (goal === 'overload') {
      add('gate_capacity','gate_fulfillment','gate_economics');
      return out;
    }
    if (goal === 'repeat') {
      add('gate_fulfillment','core_value','core_repeat');
      return out;
    }
    if (goal === 'stable') {
      add('gate_capacity','gate_economics','core_access');
      if (target !== 'less_channel_dependency') add('core_repeat');
      return out;
    }
    add('gate_fulfillment','gate_capacity','gate_economics',
        'core_demand','core_access','core_offer','core_fit','core_trust','core_conversion');
    if (model === 'SUBSCRIPTION' && target === 'active_members') add('core_start','core_value');
    return out;
  }

  function fullPeriodQuestions(s = state) {
    const goal = s.answers.scope_goal;
    const out = ['scope_period','period_integrity'];
    if (['new_sales','stable'].includes(goal)) out.push('period_context');
    return out;
  }

  function targetRelevanceForZone(zone, a = state.answers) {
    const goalMap = {
      new_sales:['A','D','O','FIT','T','C','S'],
      stable:['A','R','CAP','E'],
      income:['E','CAP','A','O'],
      overload:['CAP','F','E'],
      repeat:['V','R','REC','REACT'],
    };
    const targetMap = {
      attended_visits:['C','S','CAP'], fill_slots:['A','C','CAP'], new_customers:['A','D','FIT','O'],
      completed_orders:['C','F','CAP','A'], paid_clients:['C','FIT','T','A'], paid_students:['C','A','O'],
      revenue:['E','A','C','CAP'], owner_money:['E','CAP'], per_sale:['E'], same_money_less_time:['E','CAP','F'],
      steady_orders:['A','R','CAP'], steady_income:['E','R','A'], less_channel_dependency:['A'],
      less_hours:['CAP','E','F'], fewer_urgent:['F','CAP'], stable_quality:['F','CAP'],
      repeat_orders:['R','V'], repeat_visits:['R','V'], repeat_work:['R','V'], next_learning:['R','V'],
      repeat_income:['R','E','V'], new_subscribers:['A','D','O','C'], renewals:['R','V'],
      active_members:['S','V','R'], less_churn:['R','V','F'], reactivate_members:['REACT','R'],
    };
    if ((targetMap[a.scope_target] || []).includes(zone)) return 2;
    if ((goalMap[a.scope_goal] || []).includes(zone)) return 1;
    return 0;
  }

  const BUILD_PHASE = Object.freeze({
    B0: 'B0_TEST_FEASIBILITY',
    B1: 'B1_TEST_READINESS',
    B2: 'B2_MARKET_EVIDENCE',
    B3: 'B3_DELIVERY_VALIDATION',
  });

  function shouldAskScopeRoute(s = state) {
    return [DIAGNOSTIC_MODE.FULL, DIAGNOSTIC_MODE.HYBRID].includes(s.mode);
  }

  function shouldAskScopeGeography(s = state) {
    const goal = s.answers.scope_goal;
    const model = s.answers.scope_model;
    if (['PRODUCT','APPOINTMENT'].includes(model) && ['new_sales','stable'].includes(goal)) return true;
    if ([DIAGNOSTIC_MODE.BUILD, DIAGNOSTIC_MODE.HYBRID].includes(s.mode) && ['PRODUCT','APPOINTMENT'].includes(model)) return true;
    return false;
  }

  function currentBuildPhase(s = state) {
    const a = s.answers;
    if (!a.build_offer || !a.build_route || !a.build_access) return BUILD_PHASE.B1;
    if (!a.build_market || ['unknown','no'].includes(a.build_market)) return BUILD_PHASE.B2;
    return BUILD_PHASE.B3;
  }

  function shouldAskSharedResources(s = state) {
    const a = s.answers;
    const realCommitment = ['preorder','payment'].includes(a.build_test_type) || a.build_market === 'paid';
    if (!realCommitment) return false;
    const changed = Array.isArray(a.inheritance_map) ? a.inheritance_map : [];
    return changed.includes('capacity') || a.inheritance_entry !== 'almost_all';
  }

  function shouldAskSharedImpact(s = state) {
    const shared = meaningful(s.answers.shared_resources);
    return shouldAskSharedResources(s) && shared.length > 0 && !shared.includes('none');
  }

  function hybridPlausibilityQuestions(changed) {
    const xs = Array.isArray(changed) ? changed : [];
    if (!xs.length || xs.includes('unknown')) return ['build_econ_plausibility','build_pilot_capacity'];
    const out = [];
    if (xs.some(v => ['offer','price','route','fulfillment','capacity'].includes(v))) out.push('build_econ_plausibility');
    if (xs.some(v => ['offer','fulfillment','capacity'].includes(v))) out.push('build_pilot_capacity');
    return out;
  }

  function hybridBuildQuestions(changed) {
    const xs = Array.isArray(changed) ? changed : [];
    if (!xs.length || xs.includes('unknown')) return ['build_offer','build_route','build_access','build_market_context','build_market'];
    const out = [];
    const add = (...ids) => ids.forEach(id => { if (!out.includes(id)) out.push(id); });
    if (xs.includes('offer')) add('build_offer','build_market');
    if (xs.includes('price')) add('build_offer','build_market');
    if (xs.includes('audience')) add('build_access','build_market_context','build_market');
    if (xs.includes('channel')) add('build_access','build_market');
    if (xs.includes('route')) add('build_route','build_market');
    if (xs.includes('fulfillment')) add('build_fulfillment','build_value');
    if (xs.includes('capacity')) add('build_economics','build_capacity');
    return out;
  }

  function baseBuildRoute() {
    return [
      'build_test_type',
      'gate_legal',
      'build_econ_plausibility',
      'build_pilot_capacity',
      'build_offer',
      'build_route',
      'build_access',
      'build_market_context',
      'build_market'
    ];
  }

  const PRECISION_CONFIG = Object.freeze({
    FIT:{ fields:['p_comparable','p_inquiries','p_fit'] },
    PURCHASE_FRICTION:{ fields:['p_comparable','p_ready_to_buy','p_orders'] },
    START_FAILURE:{ fields:['p_comparable','p_confirmed','p_started'] },
    ACTIVATION_FAILURE:{ fields:['p_comparable','p_confirmed','p_started'] },
    FIRST_VALUE_GAP:{ fields:['p_comparable','p_started','p_first_value'] },
    FULFILLMENT:{ fields:['p_comparable','p_completed','p_problems'] },
    VALUE_FAILURE:{ fields:['p_comparable','p_value_total','p_value_problems'] },
    NEXT_CYCLE:{ fields:['p_comparable','p_repeat_eligible','p_repeat_returned'] },
    CUSTOMER_MEMORY_GAP:{ fields:['p_comparable','p_repeat_eligible','p_repeat_returned'] },
    SUB_RENEWAL:{ fields:['p_comparable','p_renewal_due','p_renewed'] },
    ECONOMICS:{ fields:['p_comparable','p_revenue','p_direct_costs','p_hours'] },
    CAPACITY:{ fields:['p_comparable','p_capacity_period','p_current_volume','p_sustainable_volume'] },
    DEMAND_WEAK:{ fields:['p_comparable','p_market_people','p_market_actions','p_market_paid'] },
    DEMAND_UNCLEAR:{ fields:['p_comparable','p_market_people','p_market_actions','p_market_paid'] },
    BUILD_DEMAND:{ fields:['p_comparable','p_market_people','p_market_actions','p_market_paid'] },
    BUILD_MARKET_TEST:{ fields:['p_comparable','p_market_people','p_market_actions','p_market_paid'] },
    BUILD_ECONOMICS:{ fields:['p_comparable','p_revenue','p_direct_costs','p_hours'] },
    BUILD_CAPACITY:{ fields:['p_comparable','p_capacity_period','p_current_volume','p_sustainable_volume'] },
  });

  function precisionQuestionsFor(code) {
    return PRECISION_CONFIG[code]?.fields || [];
  }


  function startPrecision(result) {
    const code = result.primaryCode || result.code;
    const path = precisionQuestionsFor(code);
    if (!path.length) return;
    state.precisionBase = result;
    state.precisionSnapshot = null;
    state.precisionOriginMode = state.mode;
    state.mode = 'precision';
    state.path = path;
    state.index = 0;
    renderQuestion();
  }

  function goNext() {
    const currentId = state.path[state.index];
    if (!isAnswered(currentId)) return;

    if (state.mode === DIAGNOSTIC_MODE.FOLLOWUP) {
      if (currentId === 'fu_done') {
        if (['no','different'].includes(state.answers.fu_done)) {
          finalizeFollowup();
          return;
        }
        state.path = state.path.slice(0, state.index + 1).concat(['fu_execution_match']);
      } else if (currentId === 'fu_execution_match') {
        if (['one','several'].includes(state.answers.fu_execution_match)) {
          finalizeFollowup();
          return;
        }
        state.path = state.path.slice(0, state.index + 1).concat(['fu_sample_ready']);
      } else if (currentId === 'fu_sample_ready') {
        if (['not_yet','cap','stopped','unknown'].includes(state.answers.fu_sample_ready)) {
          finalizeFollowup();
          return;
        }
        state.path = state.path.slice(0, state.index + 1).concat(['fu_measurement_valid']);
      } else if (currentId === 'fu_measurement_valid') {
        if (['no'].includes(state.answers.fu_measurement_valid)) {
          finalizeFollowup();
          return;
        }
        state.path = state.path.slice(0, state.index + 1).concat(['fu_effect']);
      } else if (currentId === 'fu_effect') {
        state.path = state.path.slice(0, state.index + 1).concat(['fu_guardrail']);
      }
    }

    if (currentId === 'gate_legal' && ['yes','maybe','unknown'].includes(state.answers.gate_legal)) {
      state.result = makeResult('LEGAL_SAFETY_BLOCKER');
      renderResult(state.result);
      return;
    }

    if (currentId === 'gate_fulfillment' && state.answers.scope_model === 'PRODUCT' && state.answers.gate_fulfillment === 'never') {
      state.path = state.path.filter(id => !['core_start','core_value'].includes(id));
    }

    // Maturity selects the diagnostic algorithm. Business goal stays untouched.
    if (currentId === 'maturity_state') {
      state.businessGoal = state.answers.scope_goal || null;
      state.diagnosticTarget = state.answers.scope_target || null;
      state.maturityState = state.answers.maturity_state || null;
      const nextMode = resolveDiagnosticMode(state.maturityState);
      setDiagnosticMode(nextMode);
      state.deepAdded = false;

      const scoped = [];
      if (shouldAskScopeRoute(state)) scoped.push('scope_route');
      if (shouldAskScopeGeography(state)) scoped.push('scope_geography');

      if (nextMode === DIAGNOSTIC_MODE.FULL) {
        state.path = state.path.slice(0, state.index + 1).concat([
          ...scoped,
          ...fullPeriodQuestions(state),
          ...fullQuestionsForTarget(state)
        ]);
      } else {
        state.path = state.path.slice(0, state.index + 1).concat([...scoped, 'inheritance_entry']);
      }
    }

    if ([DIAGNOSTIC_MODE.BUILD, DIAGNOSTIC_MODE.HYBRID].includes(state.mode) && currentId === 'inheritance_entry') {
      const inherited = state.answers.inheritance_entry;
      if (['existing','almost_all','unknown'].includes(inherited)) {
        setDiagnosticMode(DIAGNOSTIC_MODE.HYBRID);
        state.path = state.path.slice(0, state.index + 1).concat(['inheritance_map']);
      } else {
        setDiagnosticMode(DIAGNOSTIC_MODE.BUILD);
        state.path = state.path.slice(0, state.index + 1).concat(baseBuildRoute());
      }
    }

    if (state.mode === DIAGNOSTIC_MODE.HYBRID && currentId === 'inheritance_map') {
      const changed = state.answers.inheritance_map;
      const plausibility = hybridPlausibilityQuestions(changed);
      const checks = hybridBuildQuestions(changed);
      state.path = state.path.slice(0, state.index + 1).concat(['build_test_type','gate_legal', ...plausibility, ...checks]);
    }

    // Shared resources are conditional and separate from pilot capacity.
    if (['build_pilot_capacity','build_market'].includes(currentId) && shouldAskSharedResources(state) && !state.path.includes('shared_resources')) {
      state.path.splice(state.index + 1, 0, 'shared_resources');
    }
    if (currentId === 'shared_resources' && shouldAskSharedImpact(state) && !state.path.includes('shared_impact')) {
      state.path.splice(state.index + 1, 0, 'shared_impact');
    }

    if ([DIAGNOSTIC_MODE.BUILD, DIAGNOSTIC_MODE.HYBRID].includes(state.mode) && currentId === 'build_market') {
      if (['paid','action'].includes(state.answers.build_market) && !state.path.includes('build_market_quality')) {
        state.path.splice(state.index + 1, 0, 'build_market_quality');
      } else if (state.answers.build_market === 'no') {
        const add = [];
        if (!state.path.includes('build_market_sample')) add.push('build_market_sample');
        if (!state.path.includes('build_market_audience')) add.push('build_market_audience');
        if (add.length) state.path.splice(state.index + 1, 0, ...add);
      }
    }

    // Stop early in BUILD/HYBRID: the first failed meaningful gate is the current job.
    if (state.mode === 'build' || state.mode === 'hybrid') {
      const early = buildEarlyResult(currentId);
      if (early) { state.result = makeResult(early); renderResult(state.result); return; }
    }

    // Shared resources can block growth even when the selected product itself looks healthy.
    if (currentId === 'shared_impact' && ['other_suffer','current_suffer','overload','cash'].includes(state.answers.shared_impact)) {
      state.result = makeResult(state.answers.shared_impact === 'cash' ? 'ECONOMICS' : 'CAPACITY');
      renderResult(state.result);
      return;
    }

    // In FULL, a hard blocker gets a short targeted clarification as soon as it is known.
    if (state.mode === DIAGNOSTIC_MODE.FULL && ['gate_legal','gate_fulfillment','gate_capacity','gate_economics'].includes(currentId)) {
      const blocker = hardGateResult();
      if (blocker === 'LEGAL_SAFETY_BLOCKER') {
        state.result = makeResult(blocker); renderResult(state.result); return;
      }
      const blockerMatchesCurrent =
        (currentId === 'gate_fulfillment' && blocker === 'FULFILLMENT') ||
        (currentId === 'gate_capacity' && blocker === 'CAPACITY') ||
        (currentId === 'gate_economics' && blocker === 'ECONOMICS');
      if (blockerMatchesCurrent) {
        const blockerQuestions = {
          FULFILLMENT: ['deep_f1','deep_f2'],
          ECONOMICS: ['deep_e1','deep_e3'],
          CAPACITY: ['deep_cap1','deep_cap2'],
        }[blocker] || [];
        state.deepAdded = true;
        state.path = state.path.slice(0, state.index + 1).concat(blockerQuestions);
      }
    }

    if (currentId === 'deep_v2' && state.answers.deep_v2 === 'yes' && !state.path.includes('deep_v3')) {
      state.path.splice(state.index + 1, 0, 'deep_v3');
    }

    if (currentId === 'deep_s1') {
      const learningModel = ['EDUCATION','SUBSCRIPTION'].includes(state.answers.scope_model);
      if (learningModel) {
        if (!state.path.includes('deep_s2')) state.path.splice(state.index + 1, 0, 'deep_s2');
      } else if (['some','many'].includes(state.answers.deep_s1) && !state.path.includes('deep_s2')) {
        state.path.splice(state.index + 1, 0, 'deep_s2');
      }
    }

    if (currentId === 'deep_s2') {
      const learningModel = ['EDUCATION','SUBSCRIPTION'].includes(state.answers.scope_model);
      const a = state.answers;
      const needCause = learningModel
        ? (['half','few'].includes(a.deep_s1) || (a.deep_s1 === 'most' && ['some','rare'].includes(a.deep_s2)))
        : ['yes','partly'].includes(a.deep_s2);
      if (needCause && !state.path.includes('deep_s3')) state.path.splice(state.index + 1, 0, 'deep_s3');
    }

    if (currentId === 'deep_r1' && ['yes','sometimes'].includes(state.answers.deep_r1)) {
      const add = [];
      if (!state.path.includes('deep_r2')) add.push('deep_r2');
      if (!state.path.includes('deep_r3')) add.push('deep_r3');
      if (state.answers.scope_target === 'reactivate_members' && !state.path.includes('post_reactivation')) add.push('post_reactivation');
      if (add.length) state.path.splice(state.index + 1, 0, ...add);
    }

    if (currentId === 'core_repeat') {
      const a = state.answers;
      const extra = [];
      const hasProblemToRecover = ['sometimes','regular'].includes(a.gate_fulfillment) || ['mostly','issues','no'].includes(a.core_value);
      const repeatPossible = ['rare','sometimes'].includes(a.core_repeat);

      if (hasProblemToRecover && !state.path.includes('post_recovery')) extra.push('post_recovery');

      if (a.scope_model === 'SUBSCRIPTION') {
        if (repeatPossible && !state.path.includes('sub_cancel_known')) extra.push('sub_cancel_known');
      }

      if (extra.length) state.path.splice(state.index + 1, 0, ...extra);
    }

    if (currentId === 'sub_cancel_known') {
      if (['yes','partly'].includes(state.answers.sub_cancel_known)) {
        if (!state.path.includes('sub_cancel_reason')) state.path.splice(state.index + 1, 0, 'sub_cancel_reason');
      } else if (state.answers.scope_target === 'reactivate_members' && !state.path.includes('post_reactivation')) {
        state.path.splice(state.index + 1, 0, 'post_reactivation');
      }
    }

    if (currentId === 'sub_cancel_reason') {
      const reasons = meaningful(state.answers.sub_cancel_reason);
      const shouldAskReactivation = state.answers.scope_target === 'reactivate_members' || reasons.some(v => ['temporary','fit'].includes(v));
      if (shouldAskReactivation && !state.path.includes('post_reactivation')) state.path.splice(state.index + 1, 0, 'post_reactivation');
    }

    if (currentId === 'deep_f2' && state.answers.deep_f2 === 'yes' && meaningful(state.answers.deep_f1).includes('overload') && !state.path.includes('deep_cap1')) {
      state.path.splice(state.index + 1, 0, 'deep_cap1', 'deep_cap2');
    }

    if (state.index < state.path.length - 1) {
      state.index++;
      renderQuestion();
    } else {
      if (state.mode === 'full' && !state.deepAdded) {
        const deeper = chooseDiscriminatorQuestions();
        if (deeper.length) {
          state.deepAdded = true;
          state.path.push(...deeper);
          state.index++;
          renderQuestion();
          return;
        }
      }
      finalizeDiagnosis();
    }
  }

  function primaryCodeZone(code) {
    return ({
      DEMAND_WEAK:'D', DEMAND_UNCLEAR:'D',
      OFFER:'O', FIT:'FIT', ACCESS:'A', DISTRIBUTION:'A',
      DECISION_GAP:'T', PURCHASE_FRICTION:'C',
      START_FAILURE:'S', ACTIVATION_FAILURE:'S', FIRST_VALUE_GAP:'S',
      FULFILLMENT:'F', VALUE_FAILURE:'V',
      NEXT_CYCLE:'R', CUSTOMER_MEMORY_GAP:'R', SUB_RENEWAL:'R',
      RECOVERY_FAILURE:'REC', REACTIVATION_GAP:'REACT', ADVOCACY_GAP:'ADV',
      ECONOMICS:'E', CAPACITY:'CAP'
    })[code] || null;
  }

  function isPrecisionExcludedCode(code) {
    const zone = primaryCodeZone(code);
    return zone ? state.precisionExcludedZones.includes(zone) : false;
  }

  function hardGateResult() {
    const a = state.answers;
    if (a.gate_legal === 'yes') return 'LEGAL_SAFETY_BLOCKER';
    if (a.gate_fulfillment === 'regular' && !isPrecisionExcludedCode('FULFILLMENT')) return 'FULFILLMENT';
    if (a.gate_economics === 'negative' && !isPrecisionExcludedCode('ECONOMICS')) return 'ECONOMICS';
    if (a.gate_capacity === 'overload' && !isPrecisionExcludedCode('CAPACITY')) return 'CAPACITY';
    return '';
  }

  function buildEarlyResult(currentId) {
    const a = state.answers;
    if (currentId === 'gate_legal' && ['yes','maybe','unknown'].includes(a.gate_legal)) return 'LEGAL_SAFETY_BLOCKER';
    if (currentId === 'build_market' && a.build_market === 'unknown') return 'BUILD_MARKET_TEST';
    if (currentId === 'build_market' && a.build_market === 'no') return '';
    if (currentId === 'build_market_audience' && ['no','mixed','unknown'].includes(a.build_market_audience)) return 'BUILD_MARKET_TEST';
    if (currentId === 'build_market_audience' && a.build_market_audience === 'yes') {
      return Number.isFinite(a.build_market_sample) && a.build_market_sample > 0 ? 'BUILD_DEMAND' : 'BUILD_MARKET_TEST';
    }
    const fail = {
      build_econ_plausibility: () => !['yes','plausible'].includes(a.build_econ_plausibility),
      build_pilot_capacity: () => !['yes','plausible'].includes(a.build_pilot_capacity),
      build_offer: () => !['yes','mostly'].includes(a.build_offer),
      build_route: () => !['yes','mostly'].includes(a.build_route),
      build_access: () => !['yes','mostly'].includes(a.build_access),
      build_market_quality: () => false,
      build_fulfillment: () => a.build_fulfillment !== 'yes',
      build_value: () => a.build_value !== 'yes',
      build_economics: () => !['yes','maybe'].includes(a.build_economics),
      build_capacity: () => !['yes','small'].includes(a.build_capacity),
    };
    const codes = {
      build_econ_plausibility:'BUILD_ECONOMICS', build_pilot_capacity:'BUILD_CAPACITY',
      build_offer:'BUILD_OFFER', build_route:'BUILD_ROUTE', build_access:'BUILD_ACCESS',
      build_market:'BUILD_MARKET_TEST', build_market_quality:'BUILD_MARKET_TEST', build_fulfillment:'BUILD_FULFILLMENT', build_value:'BUILD_VALUE', build_economics:'BUILD_ECONOMICS', build_capacity:'BUILD_CAPACITY'
    };
    return fail[currentId] && fail[currentId]() ? codes[currentId] : '';
  }

  function deepQuestionsForZone(zone) {
    const deepMap = {
      D:['deep_d1','deep_d2','deep_d3'], O:['deep_o1','deep_o2'],
      FIT:['deep_fit1','deep_fit2'], A:['deep_a1','deep_a2','deep_a3','deep_a4'],
      T:['deep_t1','deep_t2'], C:['deep_c1','deep_c2'], S:['deep_s1'],
      F:['deep_f1','deep_f2'], V:['deep_v1','deep_v2'], R:['deep_r1'],
      E:['deep_e1','deep_e2','deep_e3'], CAP:['deep_cap1','deep_cap2'],
      REC:[], REACT:[], ADV:[]
    };
    if (zone === 'R' && state.answers.scope_model === 'SUBSCRIPTION') return [];
    return deepMap[zone] || [];
  }

  function sameLikelyAction(a, b) {
    const family = zone => ({
      D:'ACQUISITION_EVIDENCE', A:'ACQUISITION_EVIDENCE',
      O:'PREPURCHASE_CLARITY', T:'PREPURCHASE_CLARITY',
      FIT:'QUALIFICATION', C:'PURCHASE_FLOW', S:'POST_PURCHASE_START',
      F:'OPERATIONS', CAP:'OPERATIONS', E:'ECONOMICS', V:'VALUE',
      R:'RETENTION', REC:'RECOVERY', REACT:'REACTIVATION', ADV:'ADVOCACY'
    }[zone] || zone);
    return family(a?.zone) === family(b?.zone);
  }

  function chooseDiscriminatorQuestions() {
    const candidates = collectCandidates().filter(x => x.tier < CANDIDATE_TIER.OPPORTUNITY);
    if (!candidates.length) return [];
    const first = candidates[0], second = candidates[1];
    if (!second || first.tier < second.tier || first.strength > second.strength) {
      return deepQuestionsForZone(first.zone);
    }
    if (sameLikelyAction(first, second)) return deepQuestionsForZone(first.zone);
    return [...new Set([
      ...deepQuestionsForZone(first.zone).slice(0,1),
      ...deepQuestionsForZone(second.zone).slice(0,1)
    ])];
  }

  function collectCandidates() {
    const a = state.answers;
    const list = [];
    const add = (zone, strength, tier=CANDIDATE_TIER.MODERATE, evidenceQuality=1) => {
      if (!strength || state.precisionExcludedZones.includes(zone)) return;
      list.push({zone, sev:strength, strength, tier, evidenceQuality, targetRelevance:targetRelevanceForZone(zone,a)});
    };

    const fulfillmentContradicted = meaningful(a.deep_f1).includes('none') && a.deep_f2 === 'no';
    add('F', fulfillmentContradicted ? 0 : severity(a.gate_fulfillment,{regular:4}),
      a.gate_fulfillment === 'regular' ? CANDIDATE_TIER.HARD_BLOCKER : CANDIDATE_TIER.MODERATE, 3);

    const economicsContradicted = a.deep_e1 === 'no' && ['yes','likely'].includes(a.deep_e2) && Array.isArray(a.deep_e3) && a.deep_e3.includes('none');
    add('E', economicsContradicted ? 0 : severity(a.gate_economics,{negative:4,low:3}),
      a.gate_economics === 'negative' ? CANDIDATE_TIER.HARD_BLOCKER : CANDIDATE_TIER.TARGET_CRITICAL, 3);
    add('CAP', severity(a.gate_capacity,{overload:4,limit:3}),
      a.gate_capacity === 'overload' ? CANDIDATE_TIER.HARD_BLOCKER : CANDIDATE_TIER.TARGET_CRITICAL, 3);

    const valueContradicted = a.deep_v2 === 'no' && meaningful(a.deep_v1).some(v => ['repeat','feedback','observable','usage','progress'].includes(v)) && !meaningful(a.deep_v1).includes('complaints');
    add('V', valueContradicted ? 0 : severity(a.core_value,{no:4,issues:3}), CANDIDATE_TIER.TARGET_CRITICAL, 2);

    const startContradicted = ['EDUCATION','SUBSCRIPTION'].includes(a.scope_model) ? (a.deep_s1 === 'most' && a.deep_s2 === 'most') : (a.deep_s1 === 'no');
    add('S', startContradicted ? 0 : severity(a.core_start,{problem:4,losses:3}), CANDIDATE_TIER.TARGET_CRITICAL, 2);

    const conversionContradicted = Array.isArray(a.deep_c1) && meaningful(a.deep_c1).length === 0 && a.deep_c2 === 'no';
    add('C', conversionContradicted ? 0 : severity(a.core_conversion,{breaks:4,hard:3}), CANDIDATE_TIER.TARGET_CRITICAL, 2);

    const trustContradicted = Array.isArray(a.deep_t1) && meaningful(a.deep_t1).length === 0 && a.deep_t2 === 'yes';
    add('T', trustContradicted ? 0 : severity(a.core_trust,{almost_always:4,often:3}), CANDIDATE_TIER.TARGET_CRITICAL, 2);
    add('FIT', severity(a.core_fit,{bad:4,half:3}), CANDIDATE_TIER.TARGET_CRITICAL, 2);

    const offerContradicted = Array.isArray(a.deep_o1) && meaningful(a.deep_o1).length === 0 && a.deep_o2 === 'easy';
    add('O', offerContradicted ? 0 : severity(a.core_offer,{no:4,mostly_no:3}), CANDIDATE_TIER.TARGET_CRITICAL, 2);
    add('A', severity(a.core_access,{none:4,unstable:3}), CANDIDATE_TIER.TARGET_CRITICAL, 2);
    add('D', severity(a.core_demand,{rare:4}), CANDIDATE_TIER.TARGET_CRITICAL, 1);

    const repeatStrength = a.scope_model === 'SUBSCRIPTION' ? severity(a.core_repeat,{rare:3,sometimes:2}) : severity(a.core_repeat,{rare:3});
    add('R', repeatStrength, CANDIDATE_TIER.TARGET_CRITICAL, 2);
    add('REC', severity(a.post_recovery,{often_unresolved:3}), CANDIDATE_TIER.TARGET_CRITICAL, 3);

    const reactTier = a.scope_target === 'reactivate_members' ? CANDIDATE_TIER.TARGET_CRITICAL : CANDIDATE_TIER.OPPORTUNITY;
    add('REACT', severity(a.post_reactivation,{many:1}), reactTier, 2);
    add('ADV', severity(a.post_referral,{no:1}), CANDIDATE_TIER.OPPORTUNITY, 1);

    return list.sort((x,y) => x.tier-y.tier || y.evidenceQuality-x.evidenceQuality || y.targetRelevance-x.targetRelevance || y.strength-x.strength);
  }

  function severity(value, map) { return map[value] || 0; }

  function finalizeDiagnosis() {
    if (state.mode === 'followup') return finalizeFollowup();
    if (state.mode === 'precision') return finalizePrecision();
    const diagnosis = (state.mode === 'build' || state.mode === 'hybrid') ? diagnoseBuild() : diagnoseFull();
    state.result = diagnosis;
    renderResult(diagnosis);
  }

function fmtNumber(value, maxFraction = 1) {
  if (!Number.isFinite(value)) return '';
  return new Intl.NumberFormat('ru-RU', { maximumFractionDigits:maxFraction }).format(value);
}

function percentPart(num, den) {
  if (!Number.isFinite(num) || !Number.isFinite(den) || den <= 0) return '';
  return fmtNumber((num / den) * 100, 1) + '%';
}

function precisionValues(config) {
  const out = {};
  for (const id of config.fields) out[id] = state.answers[id];
  return out;
}

function precisionSanity(config, values) {
  if (values.p_comparable === 'no' || values.p_comparable === 'unknown') {
    return {
      outcome:PRECISION_OUTCOME.INCOMPARABLE_DATA,
      message:'Эти цифры нельзя честно использовать для подтверждения или отмены предыдущего вывода: период, предложение или способ покупки не сопоставимы.'
    };
  }

  const pairs = [
    ['p_fit','p_inquiries'],
    ['p_orders','p_ready_to_buy'],
    ['p_started','p_confirmed'],
    ['p_first_value','p_started'],
    ['p_problems','p_completed'],
    ['p_value_problems','p_value_total'],
    ['p_repeat_returned','p_repeat_eligible'],
    ['p_renewed','p_renewal_due'],
    ['p_market_actions','p_market_people'],
    ['p_market_paid','p_market_actions']
  ];
  for (const [num,den] of pairs) {
    if (Number.isFinite(values[num]) && Number.isFinite(values[den]) && values[num] > values[den]) {
      return {
        outcome:PRECISION_OUTCOME.INVALID_INPUT,
        message:'Проверьте введённые числа: числитель не может быть больше соответствующего знаменателя.'
      };
    }
  }
  return null;
}

function precisionEvaluate(code, values) {
  const sanity = precisionSanity(PRECISION_CONFIG[code] || {fields:[]}, values);
  if (sanity) return sanity;

  const zero = (id, message) => Number.isFinite(values[id]) && values[id] === 0
    ? { outcome:PRECISION_OUTCOME.INSUFFICIENT_DENOMINATOR, message } : null;

  if (code === 'FIT') {
    const z = zero('p_inquiries','За этот период не было обращений. По нулевому знаменателю нельзя оценить качество входящего потока.');
    if (z) return z;
    if (values.p_inquiries > 0 && values.p_fit === values.p_inquiries) {
      return {outcome:PRECISION_OUTCOME.CONTRADICTED,message:'Все обращения в выбранном периоде были от людей, которым вы могли продать. FIT не подтверждается этими цифрами.'};
    }
    return {outcome:PRECISION_OUTCOME.SUPPORTED_NOT_PROVEN,message:'Цифры совместимы с гипотезой о неподходящих обращениях, но без универсального порога не доказывают, что именно это главное ограничение.'};
  }

  if (code === 'PURCHASE_FRICTION') {
    const z = zero('p_ready_to_buy','Не было людей, которые уже решили купить и дошли до оформления. По этому периоду нельзя оценить потерю на оформлении.');
    if (z) return z;
    if (values.p_ready_to_buy > 0 && values.p_orders === values.p_ready_to_buy) {
      return {outcome:PRECISION_OUTCOME.CONTRADICTED,message:'Все люди, которые уже решили купить, завершили оформление. Потеря на этом шаге не подтверждается.'};
    }
    return {outcome:PRECISION_OUTCOME.SUPPORTED_NOT_PROVEN,message:'В выбранной группе есть незавершённые покупки. Это поддерживает гипотезу, но не сравнивается с универсальной нормой.'};
  }

  if (['START_FAILURE','ACTIVATION_FAILURE'].includes(code)) {
    const z = zero('p_confirmed','Нет подтверждённых покупок или записей, от которых можно считать начало.');
    if (z) return z;
    if (values.p_started === values.p_confirmed) return {outcome:PRECISION_OUTCOME.CONTRADICTED,message:'Все подтверждённые случаи дошли до фактического начала. Потеря на старте в этом периоде не подтверждается.'};
    return {outcome:PRECISION_OUTCOME.SUPPORTED_NOT_PROVEN,message:'Часть подтверждённых случаев не дошла до старта. Цифры поддерживают вывод без рыночного benchmark.'};
  }

  if (code === 'FIRST_VALUE_GAP') {
    const z = zero('p_started','Никто не начал, поэтому нельзя оценить достижение первой пользы после старта.');
    if (z) return z;
    if (values.p_first_value === values.p_started) return {outcome:PRECISION_OUTCOME.CONTRADICTED,message:'Все начавшие дошли до первого полезного результата. First Value Gap в этом периоде не подтверждается.'};
    return {outcome:PRECISION_OUTCOME.SUPPORTED_NOT_PROVEN,message:'Не все начавшие дошли до первой пользы. Это поддерживает вывод, но не задаёт универсальную «норму».'};
  }

  if (code === 'FULFILLMENT') {
    const z = zero('p_completed','Нет выполненных случаев, по которым можно оценить сбои выполнения.');
    if (z) return z;
    if (values.p_problems === 0) {
      return values.p_completed === 1
        ? {outcome:PRECISION_OUTCOME.WEAKENED,message:'В одном выполненном случае серьёзного сбоя не было. Это ослабляет вывод, но одного случая недостаточно, чтобы отменить ранее отмеченный повторяющийся паттерн.'}
        : {outcome:PRECISION_OUTCOME.CONTRADICTED,message:'В нескольких выполненных случаях не было ни одного серьёзного сбоя. Эти цифры противоречат выводу о регулярно повторяющейся проблеме выполнения.'};
    }
    return {outcome:PRECISION_OUTCOME.SUPPORTED_NOT_PROVEN,message:'Серьёзные сбои есть среди выполненных случаев. Цифры поддерживают вывод; силу паттерна оцениваем по реальным повторениям, а не по универсальному проценту.'};
  }

  if (code === 'VALUE_FAILURE') {
    const z = zero('p_value_total','Нет случаев с известным клиентским результатом. Нельзя оценить Value по отсутствующему знаменателю.');
    if (z) return z;
    if (values.p_value_problems === 0) return {outcome:PRECISION_OUTCOME.CONTRADICTED,message:'Среди случаев с известным результатом нет подтверждённых проблем. Текущий вывод о Value не подтверждается.'};
    return {outcome:PRECISION_OUTCOME.SUPPORTED_NOT_PROVEN,message:'Есть подтверждённые проблемные результаты. Это поддерживает вывод без универсального порога.'};
  }

  if (['NEXT_CYCLE','CUSTOMER_MEMORY_GAP'].includes(code)) {
    const z = zero('p_repeat_eligible','Ни у одного клиента не возник реальный повод вернуться. Repeat-диагноз по этому периоду запрещён.');
    if (z) return z;
    if (values.p_repeat_returned === values.p_repeat_eligible) return {outcome:PRECISION_OUTCOME.WEAKENED,message:'Все eligible-клиенты вернулись. Repeat как текущее ограничение стал заметно слабее.'};
    return {outcome:PRECISION_OUTCOME.SUPPORTED_NOT_PROVEN,message:'Не все клиенты с реальным поводом вернуться вернулись. Это поддерживает repeat-гипотезу, но не создаёт норматив процента.'};
  }

  if (code === 'SUB_RENEWAL') {
    const z = zero('p_renewal_due','Ни у кого не наступил срок продления. Диагноз по renewal сейчас нельзя делать.');
    if (z) return z;
    if (values.p_renewed === values.p_renewal_due) return {outcome:PRECISION_OUTCOME.CONTRADICTED,message:'Все участники, у которых наступил срок продления, продлили. Renewal-проблема в этом периоде не подтверждается.'};
    return {outcome:PRECISION_OUTCOME.SUPPORTED_NOT_PROVEN,message:'Есть непродления среди реально наступивших продлений. Причину всё равно нужно определять по фактам, а не по проценту.'};
  }

  if (['ECONOMICS','BUILD_ECONOMICS'].includes(code)) {
    const contribution = values.p_revenue - values.p_direct_costs;
    const hourly = values.p_hours > 0 ? contribution / values.p_hours : null;
    if (contribution < 0) return {outcome:PRECISION_OUTCOME.CONFIRMED,message:'Выручка не покрывает даже прямые расходы.',derived:{contribution,contributionPerHour:hourly},confidence:CONFIDENCE.HIGH};
    if (contribution >= 0) return {outcome:PRECISION_OUTCOME.WEAKENED,message:'После прямых расходов остаётся положительная сумма. Это не доказывает «хорошую экономику»: нужно сравнить её с вашим собственным приемлемым заработком и временем.',derived:{contribution,contributionPerHour:hourly}};
  }

  if (['CAPACITY','BUILD_CAPACITY'].includes(code)) {
    const reserve = values.p_sustainable_volume - values.p_current_volume;
    if (reserve <= 0) return {outcome:PRECISION_OUTCOME.CONFIRMED,message:'Текущая загрузка уже равна или выше объёма, который вы считаете устойчивым.',derived:{capacityReserve:reserve},confidence:CONFIDENCE.HIGH};
    return {outcome:PRECISION_OUTCOME.WEAKENED,message:'По вашей оценке есть положительный рабочий запас. Это ослабляет Capacity как главное ограничение, но не вводит универсальную норму необходимого резерва.',derived:{capacityReserve:reserve}};
  }

  if (['DEMAND_WEAK','DEMAND_UNCLEAR','BUILD_DEMAND','BUILD_MARKET_TEST'].includes(code)) {
    const z = zero('p_market_people','Предложение не было показано ни одному подходящему человеку. 0/0 не является evidence слабого спроса.');
    if (z) return z;
    if (values.p_market_actions > 0) {
      return {
        outcome:PRECISION_OUTCOME.CONTRADICTED,
        message:'Есть реальные действия к покупке. Абсолютный вывод о слабом спросе не подтверждается.',
        derived:{marketActionShare:values.p_market_people > 0 ? values.p_market_actions/values.p_market_people : null}
      };
    }
    return {
      outcome:PRECISION_OUTCOME.SUPPORTED_NOT_PROVEN,
      message:'После конкретного предложения действий к покупке не было. Это поддерживает гипотезу только если аудитория, условия, offer, route и observation rule действительно были валидны.',
      derived:{marketActionShare:0}
    };
  }

  return {outcome:PRECISION_OUTCOME.SUPPORTED_NOT_PROVEN,message:'Цифры добавили evidence, но не дают основания для универсального порога «хорошо/плохо».'};
}

function precisionOutcomeConfidence(outcome, evaluation, base) {
  if (evaluation.confidence) return evaluation.confidence;
  if (outcome === PRECISION_OUTCOME.CONFIRMED) return CONFIDENCE.HIGH;
  if (outcome === PRECISION_OUTCOME.SUPPORTED_NOT_PROVEN) return CONFIDENCE.MEDIUM;
  if ([PRECISION_OUTCOME.WEAKENED,PRECISION_OUTCOME.CONTRADICTED,PRECISION_OUTCOME.INSUFFICIENT_DENOMINATOR,PRECISION_OUTCOME.INCOMPARABLE_DATA].includes(outcome)) return CONFIDENCE.PRELIMINARY;
  return base.confidence || CONFIDENCE.PRELIMINARY;
}

function reassessAfterPrecisionContradiction(base, evaluation) {
  const origin = state.precisionOriginMode || state.diagnosticMode || 'full';
  const code = base.primaryCode || base.code;

  if (['BUILD_DEMAND','BUILD_MARKET_TEST','DEMAND_WEAK','DEMAND_UNCLEAR'].includes(code)) {
    const paid = state.answers.p_market_paid || 0;
    const actions = state.answers.p_market_actions || 0;
    if (origin === DIAGNOSTIC_MODE.BUILD || origin === DIAGNOSTIC_MODE.HYBRID) {
      return makeResult(paid > 0 ? 'BUILD_FULFILLMENT' : (actions > 0 ? 'BUILD_MARKET_TEST' : 'DATA_GAP'));
    }
  }

  const zone = primaryCodeZone(code);
  if (zone && !state.precisionExcludedZones.includes(zone)) state.precisionExcludedZones.push(zone);

  if (origin === DIAGNOSTIC_MODE.FULL) {
    const rebuilt = diagnoseFull();
    if ((rebuilt.primaryCode || rebuilt.code) !== code) return rebuilt;
  }

  return makeResult('DATA_GAP', [
    evaluation.message,
    'Предыдущий primary result снят с первого места. Нужен следующий подтверждённый constraint или один факт, который различит оставшиеся действия.'
  ]);
}

function makePrecisionSnapshot(base, config, values, evaluation, confidenceBefore, confidenceAfter) {
  return {
    precisionCode:'precision_' + Date.now(),
    primaryCodeBefore:base.primaryCode || base.code,
    fields:[...config.fields],
    values,
    derivedMetrics:evaluation.derived || {},
    sanityStatus:[PRECISION_OUTCOME.INVALID_INPUT,PRECISION_OUTCOME.INCOMPARABLE_DATA].includes(evaluation.outcome) ? 'INVALID' : 'VALID',
    precisionOutcome:evaluation.outcome,
    confidenceBefore,
    confidenceAfter,
    contradictions:evaluation.outcome === PRECISION_OUTCOME.CONTRADICTED ? [evaluation.message] : [],
    timestamp:new Date().toISOString()
  };
}

function finalizePrecision() {
  const base = state.precisionBase;
  if (!base) { state.mode = state.precisionOriginMode || DIAGNOSTIC_MODE.FULL; return showHome(); }

  const code = base.primaryCode || base.code;
  const config = PRECISION_CONFIG[code];
  if (!config) {
    state.mode = state.precisionOriginMode || DIAGNOSTIC_MODE.FULL;
    state.result = base;
    renderResult(base);
    return;
  }

  const values = precisionValues(config);
  const evaluation = precisionEvaluate(code, values);
  const confidenceBefore = base.confidence || CONFIDENCE.PRELIMINARY;
  const confidenceAfter = precisionOutcomeConfidence(evaluation.outcome, evaluation, base);
  const snapshot = makePrecisionSnapshot(base, config, values, evaluation, confidenceBefore, confidenceAfter);
  state.precisionSnapshot = snapshot;
  state.mode = state.precisionOriginMode || DIAGNOSTIC_MODE.FULL;

  if (evaluation.outcome === PRECISION_OUTCOME.INVALID_INPUT) {
    const result = {
      ...base,
      precisionRefined:false,
      precisionOutcome:evaluation.outcome,
      precisionSnapshot:snapshot,
      precisionAvailable:true,
      precisionSummary:evaluation.message,
      precisionCaveat:'Исправьте ввод и запустите проверку цифрами снова. Предыдущий диагноз пока не подтверждён и не отменён.',
      confidence:confidenceBefore,
      confidenceLabel:confidenceLabel(confidenceBefore)
    };
    state.result=result; renderResult(result); return;
  }

  if (evaluation.outcome === PRECISION_OUTCOME.INCOMPARABLE_DATA) {
    const result = {
      ...base,
      precisionRefined:false,
      precisionOutcome:evaluation.outcome,
      precisionSnapshot:snapshot,
      precisionAvailable:true,
      precisionSummary:evaluation.message,
      precisionCaveat:'Нужны числа из того же scope/period/route. Когда появятся сопоставимые данные, проверку можно повторить.',
      confidence:CONFIDENCE.PRELIMINARY,
      confidenceLabel:confidenceLabel(CONFIDENCE.PRELIMINARY)
    };
    state.result=result; renderResult(result); return;
  }

  if (evaluation.outcome === PRECISION_OUTCOME.INSUFFICIENT_DENOMINATOR) {
    const result = makeResult('DATA_GAP', [evaluation.message]);
    Object.assign(result,{precisionRefined:true,precisionSnapshot:snapshot,precisionSummary:evaluation.message,confidence:CONFIDENCE.PRELIMINARY,confidenceLabel:confidenceLabel(CONFIDENCE.PRELIMINARY)});
    state.result=result; renderResult(result); return;
  }

  if (evaluation.outcome === PRECISION_OUTCOME.CONTRADICTED) {
    const result = reassessAfterPrecisionContradiction(base, evaluation);
    const newConfidence = result.confidence || CONFIDENCE.PRELIMINARY;
    snapshot.confidenceAfter = newConfidence;
    Object.assign(result,{
      precisionRefined:true,
      precisionSnapshot:snapshot,
      precisionOutcome:evaluation.outcome,
      precisionSummary:'Цифры противоречат предыдущему выводу. Результат пересчитан.',
      precisionCaveat:evaluation.message,
      supersededResult:{primaryCode:code,userTitle:base.userTitle || base.title,confidence:confidenceBefore}
    });
    state.result=result; renderResult(result); return;
  }

  let result = {...base};
  result.precisionRefined=true;
  result.precisionSnapshot=snapshot;
  result.precisionOutcome=evaluation.outcome;
  result.precisionSummary=evaluation.message;
  result.confidence=confidenceAfter;
  result.confidenceLabel=confidenceLabel(confidenceAfter);

  if (evaluation.derived?.contribution !== undefined) {
    const d=evaluation.derived;
    result.precisionSummary += ' Contribution после прямых расходов: ' + fmtNumber(d.contribution,2) +
      (Number.isFinite(d.contributionPerHour) ? '; примерно ' + fmtNumber(d.contributionPerHour,2) + ' на час до постоянных расходов и налогов.' : '.');
  }
  if (evaluation.derived?.capacityReserve !== undefined) {
    result.precisionSummary += ' Рабочий запас по вашей оценке: ' + (evaluation.derived.capacityReserve > 0 ? '+' : '') + fmtNumber(evaluation.derived.capacityReserve,0) + '.';
  }

  result.precisionCaveat = evaluation.outcome === PRECISION_OUTCOME.CONFIRMED
    ? 'Числа прямо подтверждают арифметический или физический constraint в выбранном scope.'
    : 'Числа описывают вашу выборку и не сравниваются с универсальной рыночной нормой.';

  state.result=result;
  renderResult(result);
}


  function diagnoseBuild() {

    if (['other_suffer','current_suffer','overload'].includes(a.shared_impact)) return makeResult('CAPACITY');
    if (a.shared_impact === 'cash') return makeResult('ECONOMICS');
    const buildChecks = [
      ['build_econ_plausibility', v => ['yes','plausible'].includes(v), 'BUILD_ECONOMICS'],
      ['build_pilot_capacity', v => ['yes','plausible'].includes(v), 'BUILD_CAPACITY'],
      ['build_offer', v => ['yes','mostly'].includes(v), 'BUILD_OFFER'],
      ['build_route', v => ['yes','mostly'].includes(v), 'BUILD_ROUTE'],
      ['build_access', v => ['yes','mostly'].includes(v), 'BUILD_ACCESS'],
      ['build_market', v => v !== 'unknown', 'BUILD_MARKET_TEST'],
      ['build_market_quality', v => true, 'BUILD_MARKET_TEST'],
      ['build_fulfillment', v => v === 'yes', 'BUILD_FULFILLMENT'],
      ['build_value', v => v === 'yes', 'BUILD_VALUE'],
      ['build_economics', v => ['yes','maybe'].includes(v), 'BUILD_ECONOMICS'],
      ['build_capacity', v => ['yes','small'].includes(v), 'BUILD_CAPACITY'],
    ];
    for (const [id, pass, code] of buildChecks) {
      if (!state.path.includes(id)) continue;
      if (!pass(a[id])) return makeResult(code);
    }
    if (a.build_market === 'no') {
      const validAudience = a.build_market_audience === 'yes';
      const hasSample = Number.isFinite(a.build_market_sample) && a.build_market_sample > 0;
      if (!validAudience || !hasSample) return makeResult('BUILD_MARKET_TEST');
      return makeResult('BUILD_DEMAND');
    }
    return makeResult('NO_CRITICAL_CONSTRAINT_FOUND', [
      state.mode === 'hybrid'

    if (['issues','no'].includes(a.core_value) && a.deep_v2 === 'no' && positiveValueEvidence) {

  function diagnoseFull() {
    const a = state.answers;
    if (a.gate_legal === 'yes') return makeResult('LEGAL_SAFETY_BLOCKER');
    const conflict = evidenceConflict();
    if (conflict) return makeResult('DATA_GAP', [conflict]);
    if (a.gate_fulfillment === 'regular' && !isPrecisionExcludedCode('FULFILLMENT')) {
      if (meaningful(a.deep_f1).includes('overload') && a.deep_f2 === 'yes' && !isPrecisionExcludedCode('CAPACITY')) return makeResult('CAPACITY');
      return makeResult('FULFILLMENT');
    }
    if (a.gate_economics === 'negative' && !isPrecisionExcludedCode('ECONOMICS')) return makeResult('ECONOMICS');
    if (a.gate_capacity === 'overload' && !isPrecisionExcludedCode('CAPACITY')) return makeResult('CAPACITY');

    const candidates = collectCandidates();
    const decisionGap = decisionCriticalUnknown(candidates);
    if (decisionGap) return makeResult('DATA_GAP', [decisionGap]);

    // If the stated goal is growth and capacity is already almost full, solve capacity before creating more demand.
    if (a.scope_goal === 'new_sales' && a.gate_capacity === 'limit' && !isPrecisionExcludedCode('CAPACITY')) return makeResult('CAPACITY');
    // Weak economics must be clarified before scaling acquisition.
    if (a.scope_goal === 'new_sales' && a.gate_economics === 'low' && !isPrecisionExcludedCode('ECONOMICS')) return makeResult('ECONOMICS');

    // Opportunities are never allowed to win the primary slot unless the target
    // explicitly promoted them to TARGET_CRITICAL in collectCandidates().
    const primaryCandidates = candidates.filter(x => x.tier < CANDIDATE_TIER.OPPORTUNITY);
    const zone = primaryCandidates[0]?.zone;
    let code = 'NO_CRITICAL_CONSTRAINT_FOUND';

    if (zone === 'D') code = diagnoseDemand();
    if (zone === 'O') code = 'OFFER';
    if (zone === 'FIT') code = 'FIT';
    if (zone === 'A') code = diagnoseAccess();
    if (zone === 'T') code = 'DECISION_GAP';
    if (zone === 'C') code = 'PURCHASE_FRICTION';
    if (zone === 'S') code = diagnoseStart();
    if (zone === 'F') code = diagnoseFulfillment();
    if (zone === 'V') code = diagnoseValue();
    if (zone === 'R') code = diagnoseRepeat();
    if (zone === 'REC') code = 'RECOVERY_FAILURE';
    if (zone === 'REACT') code = 'REACTIVATION_GAP';
    if (zone === 'ADV') code = 'ADVOCACY_GAP';
    if (zone === 'E') code = 'ECONOMICS';
    if (zone === 'CAP') code = 'CAPACITY';

    return makeResult(code);
  }

  function diagnoseDemand() {
    const a = state.answers;
    const others = collectCandidates().filter(x => x.zone !== 'D');
    const next = others[0]?.zone;
    const codeFor = z => ({ O:'OFFER', FIT:'FIT', A:'ACCESS', T:'DECISION_GAP', C:'PURCHASE_FRICTION', S:'START_FAILURE', V:'VALUE_FAILURE', E:'ECONOMICS', CAP:'CAPACITY', R:'NEXT_CYCLE' }[z] || 'DEMAND_UNCLEAR');

    // If people ask but do not buy, demand exists. The loss is later in the route; do not call it weak demand or auto-blame the offer.
    if (a.deep_d2 === 'ask_not_buy') return next ? codeFor(next) : 'DATA_GAP';

    // A paid purchase proves that some demand exists; low volume may still be access/seasonality, not "no demand".
    if (a.deep_d1 === 'yes') {
      if (['none','unstable'].includes(a.core_access)) return 'ACCESS';
      if (next) return codeFor(next);
      return 'DEMAND_UNCLEAR';
    }

    if (a.deep_d2 === 'few_requests') {
      if (a.deep_d3 === 'yes') {
        if (['none','unstable'].includes(a.core_access)) return 'ACCESS';
        return next ? codeFor(next) : 'DEMAND_UNCLEAR';
      }
      if (a.deep_d3 === 'no') return 'DEMAND_WEAK';
      return 'DEMAND_UNCLEAR';
    }
    if (a.deep_d2 === 'seasonal' || a.deep_d2 === 'unknown' || a.core_access === 'unknown') return 'DEMAND_UNCLEAR';
    if (a.core_access === 'none') return 'ACCESS';
    return 'DEMAND_UNCLEAR';
  }

  function diagnoseAccess() {

    if (a.core_access === 'unstable' && a.deep_a1 && a.deep_a1 !== 'yes') return 'DATA_GAP';
    if (a.deep_a2 === 'views_down') return 'DISTRIBUTION';
    if (a.deep_a2 === 'responses_down') {
      if (['no','mostly_no'].includes(a.core_offer)) return 'OFFER';

      if (['often','almost_always'].includes(a.core_trust)) return 'DECISION_GAP';
      if (['no','mostly_no'].includes(a.core_offer)) return 'OFFER';

  function diagnoseRepeat() {
