  function resultKindCodeFor(code) {
    const a = state.answers;
    if (code === 'LEGAL_SAFETY_BLOCKER') return RESULT_KIND.SAFETY_BLOCKER;
    if (code === 'FULFILLMENT' && a.gate_fulfillment === 'regular') return RESULT_KIND.HARD_OPERATING_BLOCKER;
    if (code === 'ECONOMICS' && (a.gate_economics === 'negative' || (a.scope_goal === 'new_sales' && a.gate_economics === 'low'))) return RESULT_KIND.HARD_OPERATING_BLOCKER;
    if (code === 'CAPACITY' && (a.gate_capacity === 'overload' || (a.scope_goal === 'new_sales' && a.gate_capacity === 'limit'))) return RESULT_KIND.HARD_OPERATING_BLOCKER;
    if (code === 'DATA_GAP') return RESULT_KIND.DATA_NEEDED;
    if (code === 'NO_CRITICAL_CONSTRAINT_FOUND') return RESULT_KIND.NO_CRITICAL_CONSTRAINT;
    if (code.startsWith('BUILD_')) return RESULT_KIND.BUILD_NEXT_STEP;
    if (code.startsWith('FOLLOWUP_') || code === 'FOLLOWUP') return RESULT_KIND.FOLLOWUP_RESULT;
    return RESULT_KIND.PRIMARY_CONSTRAINT;
  }

  function buildEvidenceObjects(code, whyLines) {
    const ids = evidenceQuestionIdsFor(code);
    const a = state.answers;
    const availableIds = ids.filter(id => a[id] !== undefined && a[id] !== null);
    return whyLines.map((label, index) => {
      const questionId = availableIds[index] || availableIds[0] || ids[index] || null;
      const value = questionId ? a[questionId] : null;
      const repeatedIds = new Set([
        'gate_fulfillment','core_access','core_offer','core_fit','core_trust',
        'core_conversion','core_start','core_value','core_repeat','post_recovery'
      ]);
      const type = typeof value === 'number'
        ? 'NUMBER'
        : (questionId && repeatedIds.has(questionId) ? 'REPEATED_OBSERVATION' : 'USER_ESTIMATE');
      return { type, questionId, value, label };
    });
  }

  function experimentPlanTypeFor(result) {
    const code = result.primaryCode || result.code;
    if (code === 'LEGAL_SAFETY_BLOCKER') return EXPERIMENT_PLAN_TYPE.SAFETY_RESOLUTION;
    if (code === 'DATA_GAP' || ['DEMAND_UNCLEAR','DEMAND_WEAK','BUILD_MARKET_TEST','BUILD_DEMAND'].includes(code)) return EXPERIMENT_PLAN_TYPE.EVIDENCE_COLLECTION;
    if (['BUILD_OFFER','BUILD_ROUTE','BUILD_ACCESS'].includes(code)) return EXPERIMENT_PLAN_TYPE.READINESS_FIX;
    if (['BUILD_FULFILLMENT','BUILD_VALUE','BUILD_ECONOMICS','BUILD_CAPACITY'].includes(code)) return EXPERIMENT_PLAN_TYPE.DELIVERY_VALIDATION;
    if (['FULFILLMENT','ECONOMICS','CAPACITY'].includes(code)) return EXPERIMENT_PLAN_TYPE.CORRECTIVE_VERIFICATION;
    return EXPERIMENT_PLAN_TYPE.CHANGE_TEST;
  }

      DATA_GAP:'Собрать только тот факт, который различает две конкурирующие рекомендации.',
      DEMAND_WEAK:'Провести один ограниченный market test одного и того же предложения на обычных условиях.',
      DEMAND_UNCLEAR:'Показать то же предложение ещё в одном релевантном месте, не меняя цену и сам продукт.',
      ACCESS:'Проверить один конкретный источник подходящих новых обращений.',
      DISTRIBUTION:'Изменить только один способ вернуть видимость того же предложения в выбранном канале.',
      OFFER:'Добавить до переписки одну отсутствующую часть предложения, которая регулярно требует объяснения.',
      FIT:'Вынести раньше одно условие, которое чаще всего делает обращение заведомо неподходящим.',
      DECISION_GAP:'Добавить один ответ или доказательство на самое повторяющееся сомнение перед покупкой.',
      PURCHASE_FRICTION:'Изменить один шаг оформления, на котором теряются уже готовые купить.',
      START_FAILURE:'Исправить одну повторяющуюся причину срыва после подтверждения покупки или записи.',
      ACTIVATION_FAILURE:'Исправить один барьер, из-за которого оплативший человек не начинает пользоваться продуктом.',
      FIRST_VALUE_GAP:'Сократить один участок между началом и первым понятным полезным результатом.',
      FULFILLMENT:'Исправить одну повторяющуюся причину серьёзного сбоя в уже принятых заказах.',
      VALUE_FAILURE:'Исправить одну повторяющуюся причину, из-за которой клиентский результат не совпадает с обещанием.',
      NEXT_CYCLE:'Начать сохранять один минимальный контекст, нужный для следующего естественного повода купить.',
      CUSTOMER_MEMORY_GAP:'Начать сохранять один минимальный контекст, без которого теряется следующий естественный цикл клиента.',
      SUB_RENEWAL:'Проверить одну повторяющуюся причину непродления среди тех, у кого реально наступил срок продления.',
      ECONOMICS:'Выбрать и изменить только один главный экономический рычаг: цену, прямой расход или объём ручного труда.',
      CAPACITY:'Изменить только один ресурс или правило работы, которое первым создаёт перегруз.',
      BUILD_OFFER:'Сделать минимально достаточное предложение понятным до рыночного теста.',
      BUILD_ROUTE:'Сделать один рабочий следующий шаг покупки или записи.',
      BUILD_ACCESS:'Определить одно конкретное место, где предложение увидят подходящие люди.',
      BUILD_MARKET_TEST:'Показать одно неизменное предложение ограниченной группе подходящих людей и зафиксировать реальные действия.',
      BUILD_DEMAND:'Повторить качественный market test без одновременной смены аудитории, цены, route и предложения.',
      BUILD_FULFILLMENT:'Исправить один выявленный сбой выполнения первой реальной продажи.',
      BUILD_VALUE:'Проверить один конкретный обещанный клиентский результат после фактического выполнения.',
      BUILD_ECONOMICS:'Проверить фактическую экономику одной сопоставимой продажи на текущих условиях.',
      BUILD_CAPACITY:'Проверить, какой регулярный объём можно выполнять без аврала и падения качества.'
    };
    return map[code] || result.action || 'Изменить только один участок, связанный с текущим primary result.';
  }

  function experimentExecutionSteps(result, planType, changeOneThing) {
    if (planType === EXPERIMENT_PLAN_TYPE.SAFETY_RESOLUTION) return [
      'Сформулируйте одно конкретное требование, которое нужно проверить.',
      'Получите подтверждение из применимого правила, официального источника или у компетентного специалиста.',
      'Только после ясного ответа решайте, можно ли переходить к рискованному действию.'
    ];
    if (planType === EXPERIMENT_PLAN_TYPE.EVIDENCE_COLLECTION) return [
      changeOneThing,
      'До начала зафиксируйте, что именно будет считаться наблюдением и к какому предложению/периоду оно относится.',
      'Не меняйте параллельно другие части, которые способны сделать результат неинтерпретируемым.'
    ];
    if (planType === EXPERIMENT_PLAN_TYPE.READINESS_FIX) return [
      changeOneThing,
      'Проверьте, что после изменения человек может пройти этот шаг без вашей импровизации.',
      'Только после этого переходите к реальному market test.'
    ];
    return [
      'Зафиксируйте исходное состояние по главному показателю, если оно доступно.',
      changeOneThing,
      'На протяжении проверки записывайте главный показатель и защитные показатели, не добавляя второе независимое изменение.'
    ];
  }

  function experimentPlanFor(result) {
    const code = result.primaryCode || result.code;
    if (result.followup || code === 'NO_CRITICAL_CONSTRAINT_FOUND') return null;

    const planType = experimentPlanTypeFor(result);
    const changeOneThing = experimentChangeFor(result);
    const metrics = (result.metrics || []).filter(Boolean);
    const holdConstant = (result.holdConstant || []).filter(Boolean);
    const guardrails = (result.guardrails || []).filter(Boolean);

    return {
      experimentId:'experiment_' + Date.now() + '_' + Math.random().toString(36).slice(2,8),
      resultId:result.resultId || null,
      primaryCode:code,
      hypothesis:
        planType === EXPERIMENT_PLAN_TYPE.EVIDENCE_COLLECTION
          ? 'Если собрать decision-critical evidence в сопоставимых условиях, станет понятно, какая следующая ветка решения верна.'
          : 'Если изменить именно найденный участок и не менять остальные существенные факторы, основной показатель должен измениться в ожидаемую сторону без неприемлемого вреда guardrails.',
      planType,
      changeOneThing,
      executionSteps:experimentExecutionSteps(result, planType, changeOneThing),
      holdConstant,
      primaryMetric:metrics[0] || null,
      secondaryMetrics:metrics.slice(1,3),
      guardrails,
      observationRule:result.observationRule,
      exposureCap:null,
      timeCap:null,
      budgetCap:null,
      capRule:'Не задавать универсальный N. Если тест требует лимита людей, времени или бюджета — зафиксировать доступный безопасный предел до старта и не менять его задним числом.',
      successRule:result.successRule,
      failureRule:result.failureRule,
      inconclusiveRule:'Observation rule ещё не выполнен или данных недостаточно, чтобы выбрать между ветками. Это R0, а не победа и не провал.',
      invalidRule:'Одновременно изменилось что-то ещё существенное, условия стали несопоставимы или измерение оказалось ненадёжным. Это RX.',
      nextIfSuccess:result.nextIfSuccess,
      nextIfFailure:result.nextIfFailure,
      nextIfInconclusive:'Не объявлять результат. Довести заранее выбранное наблюдение до конца либо пересобрать тест, если нужные события естественно не наступают.',
      nextIfInvalid:'Не использовать этот тест для решения. Исправить измерение/дизайн и повторить только если решение всё ещё важно.',
      followupTrigger:'Вернуться к Follow-up, когда observation rule выполнен. Досрочно — только при нарушении guardrail, safety/legal риска или явном вреде.',
      earlyStopRule:'Остановить раньше только при вреде, safety/legal риске или нарушении guardrail. Отрицательный вывод нельзя объявлять до выполнения observation rule.',
      status:EXPERIMENT_STATUS.DRAFT,
      createdAt:new Date().toISOString(),
      startedAt:null
    };
  }

  function experimentPlanTypeLabel(planType) {
    return ({
      [EXPERIMENT_PLAN_TYPE.CHANGE_TEST]:'Проверяем одно изменение',
      [EXPERIMENT_PLAN_TYPE.EVIDENCE_COLLECTION]:'Собираем один решающий факт',
      [EXPERIMENT_PLAN_TYPE.READINESS_FIX]:'Сначала делаем шаг готовым к реальному тесту',
      [EXPERIMENT_PLAN_TYPE.SAFETY_RESOLUTION]:'Сначала снимаем риск / обязательное требование',
      [EXPERIMENT_PLAN_TYPE.DELIVERY_VALIDATION]:'Проверяем реальную продажу и выполнение',
      [EXPERIMENT_PLAN_TYPE.CORRECTIVE_VERIFICATION]:'Исправляем ограничение и проверяем результат'
    })[planType] || 'План проверки';
  }

  function optionalOpportunityFor(primaryCode) {
    const a = state.answers;
    if (['LEGAL_SAFETY_BLOCKER','ECONOMICS','CAPACITY','FULFILLMENT','DATA_GAP'].includes(primaryCode)) return null;
    if (primaryCode !== 'REACTIVATION_GAP' && a.scope_target !== 'reactivate_members' && a.post_reactivation === 'many') {
      return { code:'REACTIVATION_GAP', title:'Есть подходящие бывшие клиенты для отдельной проверки возвращения.' };
    }
    if (primaryCode !== 'ADVOCACY_GAP' && a.post_referral === 'no' && ['yes','mostly'].includes(a.core_value)) {
      return { code:'ADVOCACY_GAP', title:'Довольным клиентам можно упростить рекомендацию — но это не главный приоритет.' };
    }
    return null;
  }

  function makeResult(code, extraWhy = []) {
    const base = adaptResultToModel(code, resultLibrary[code] || resultLibrary.NO_CRITICAL_CONSTRAINT_FOUND);
    const scopeText = resultScopeText(code);
    const why = [...buildWhy(code), ...extraWhy].slice(0, 4);
    const confidence = confidenceFor(code);
    const plan = resultPlanFor(code, base);
    const precisionFields = precisionQuestionsFor(code);
    const resultKind = resultKindCodeFor(code);

    const result = {
      // v2 stable contract
      resultId:'result_' + Date.now() + '_' + Math.random().toString(36).slice(2,8),
      diagnosticMode:state.diagnosticMode || state.mode,
      businessGoal:state.businessGoal || state.answers.scope_goal || null,
      diagnosticTarget:state.diagnosticTarget || state.answers.scope_target || null,
      resultKind,
      primaryCode:code,
      userTitle:base.title,
      userSummary:base.summary,
      evidence:buildEvidenceObjects(code, why),
      confidence,
      action:base.action,
      holdConstant:plan.holdConstant,
      metrics:plan.metrics,
      observationRule:plan.observationRule,
      successRule:plan.successRule,
      failureRule:plan.failureRule,
      nextIfSuccess:plan.nextIfSuccess,
      nextIfFailure:plan.nextIfFailure,
      precisionAvailable:
        precisionFields.length > 0 &&
        confidence !== CONFIDENCE.HIGH &&
        ![RESULT_KIND.SAFETY_BLOCKER, RESULT_KIND.DATA_NEEDED].includes(resultKind) &&
        !['BUILD_OFFER','BUILD_ROUTE','BUILD_ACCESS'].includes(code),
      precisionFields,
      optionalOpportunity:optionalOpportunityFor(code),
      guardrails:guardrailsFor(code),

      // compatibility adapter for current render / history while v1.10.x migrates UI
      code,
      ...base,
      ...scopeText,
      kind:resultKindFor(code),
      confidenceLabel:confidenceLabel(confidence),
      decisionRule:decisionRuleFor(code),
      why,
      secondary:secondaryRisks(code),
      date:new Date().toISOString(),
    };
    result.experimentPlan = experimentPlanFor(result);
    return result;
  }

  function adaptResultToModel(code, base) {
    const model = state.answers.scope_model;
    const out = { ...base };
    if (code === 'PURCHASE_FRICTION') {
      const wording = {
        PRODUCT:{ title:'Упростите оформление заказа', summary:'Человек уже решил купить, но часть покупателей теряется между выбором, подтверждением, оплатой и получением понятного подтверждения заказа.', metric:'Начали оформлять заказ → успешно подтвердили и оплатили; отдельно — шаг, где произошёл срыв.' },
        APPOINTMENT:{ title:'Упростите запись на услугу', summary:'Человек уже решил записаться, но часть клиентов теряется между выбором времени, подтверждением и предоплатой, если она нужна.', metric:'Начали запись → подтвердили запись и нужную оплату; отдельно — шаг, где произошёл срыв.' },
        EXPERT:{ title:'Упростите согласование и оплату работы', summary:'Человек уже решил заказать работу, но часть клиентов теряется при согласовании объёма, условий или оплаты.', metric:'Решили заказать → согласовали условия → оплатили; отдельно — шаг, где произошёл срыв.' },
        EDUCATION:{ title:'Упростите оформление и оплату обучения', summary:'Человек уже решил купить обучение, но часть покупателей теряется во время оформления или оплаты.', metric:'Начали оформление → успешно оплатили участие; отдельно — шаг, где произошёл срыв.' },
        SUBSCRIPTION:{ title:'Упростите вступление и оплату подписки', summary:'Человек уже решил вступить, но часть будущих участников теряется между выбором варианта, оплатой и подтверждением доступа.', metric:'Начали оформление подписки → оплатили → получили подтверждение; отдельно — шаг, где произошёл срыв.' }
      }[model];
      if (wording) Object.assign(out, wording);
    }

    if (code === 'START_FAILURE') {
      if (model === 'APPOINTMENT') {
        out.title = 'Разберитесь, почему клиент записывается, но не приходит';
        out.summary = 'Запись происходит, но часть клиентов теряется до фактического визита.';
        out.metric = 'Для каждой записи отмечайте: пришёл / отменил / перенёс / не пришёл и известную причину.';
      } else if (model === 'PRODUCT') {
        out.title = 'Разберитесь, почему заказ не доходит до клиента без проблем';
        out.summary = 'Покупка происходит, но часть заказов теряется или осложняется между подтверждением и фактическим получением.';
        out.metric = 'Для каждого подтверждённого заказа: получен вовремя / задержан / сорван и причина.';
      } else if (model === 'EXPERT') {
        out.title = 'Разберитесь, почему работа не начинается после оплаты';
        out.summary = 'Клиент покупает услугу, но часть работ откладывается или срывается до фактического старта.';
        out.metric = 'Оплатили → фактически начали в согласованный срок; отдельно отмечайте причину срыва.';
      }
    }
    if (model === 'SUBSCRIPTION' && code === 'ACTIVATION_FAILURE') {
      out.title = 'Помогите новым участникам действительно начать пользоваться подпиской';
      out.summary = 'Люди оплачивают участие, но заметная часть после этого почти не начинает пользоваться тем, за что заплатила.';
      out.action = 'Проверьте путь сразу после оплаты: доступ, первый понятный шаг и конкретную причину вернуться в продукт в первые дни.';
      out.metric = 'Новые оплатившие → реально начавшие пользоваться подпиской.';
      out.dont = 'Не пытайтесь исправить слабое использование только напоминаниями о продлении.';
    }
    if (model === 'SUBSCRIPTION' && code === 'FIRST_VALUE_GAP') {
      out.title = 'Быстрее доведите нового участника до первой реальной пользы';
      out.summary = 'Участники начинают пользоваться подпиской, но часть не понимает, зачем продолжать, потому что первая ощутимая польза приходит слишком поздно или не приходит вовсе.';
      out.action = 'Определите одно действие или результат, после которого участник ясно понимает ценность подписки, и сократите путь до него.';
      out.metric = 'Начавшие пользоваться → получившие первую подтверждённую пользу.';
      out.dont = 'Не заменяйте первую пользу большим объёмом контента, активностей или сообщений.';
    }
    return concretizeResult(code, out);
  }

  function meaningful(values) {
    return (Array.isArray(values) ? values : []).filter(v => !['none','unknown','normal'].includes(v));
  }
  function numbered(...items) {
    return items.flat().filter(Boolean).map((x, i) => `${i + 1}. ${x}`).join('\n');
  }
  function humanList(items) {
    const xs = items.filter(Boolean);
    if (!xs.length) return '';
    if (xs.length === 1) return xs[0];
    return `${xs.slice(0, -1).join(', ')} и ${xs[xs.length - 1]}`;
  }
  function labelList(values, map) { return values.map(v => map[v]).filter(Boolean); }
  function firstMeaningful(values) { return meaningful(values)[0] || ''; }

  function concretizeResult(code, out) {
    const a = state.answers;
    const model = a.scope_model;
    const scope = a.scope_name ? `«${a.scope_name}»` : 'этого предложения';

    if (code === 'LEGAL_SAFETY_BLOCKER') {
      if (a.gate_legal === 'unknown') {
        out.title = 'Сначала выясните, какие обязательные требования относятся к этой продаже';
        out.summary = 'Сейчас вы не уверены, какие правила безопасности, документы или обязательные требования относятся именно к этому товару или услуге. До роста это лучше прояснить.';
      } else if (a.gate_legal === 'maybe') {
        out.title = 'Сначала проверьте сомнение по обязательным требованиям';
        out.summary = 'У вас есть конкретное сомнение по безопасности или правилам продажи. Сначала получите однозначный ответ, а уже потом усиливайте продажи.';
      }
      out.action = numbered('Сформулируйте один конкретный вопрос: какое требование относится именно к вашему товару/услуге и способу продажи.', 'Проверьте его по актуальному официальному или профильному источнику; не ориентируйтесь только на чужие посты и пересказы.', 'Если требование относится к вам — исправьте процесс и сохраните подтверждение того, как оно выполняется. После этого повторите проверку продаж.');
      out.metric = 'Есть однозначный ответ по требованию и понятный способ его выполнения в вашем процессе.';
    }

    if (code === 'DATA_GAP') {
      if (model === 'SUBSCRIPTION' && ['renewals','less_churn','reactivate_members'].includes(a.scope_target) && a.core_repeat === 'na') {
        out.title = 'До первого срока продления вывод делать рано';
        out.summary = 'Ни у одного участника ещё не наступил момент продления. Поэтому сейчас нельзя честно оценить ни продление, ни отток, ни возвращение ушедших.';
        out.action = numbered(
          'Не пытайтесь заранее лечить удержание скидками, напоминаниями или новыми активностями.',
          'Когда у первой группы наступит срок продления, отметьте: сколько участников дошло до этой даты, сколько продлило и сколько не продлило.',
          'У непродливших спросите или зафиксируйте реальную причину ухода — только после этого выбирайте изменение.'
        );
        out.metric = 'Дошли до первого срока продления → продлили / не продлили + известная причина непродления.';
        out.dont = 'Не делайте вывод об удержании по людям, у которых ещё не было возможности продлить подписку.';
      } else if (model === 'SUBSCRIPTION' && ['rare','sometimes'].includes(a.core_repeat) && ['no','unknown'].includes(a.sub_cancel_known)) {
        out.title = 'Сначала выясните, почему участники не продлевают';
        out.summary = 'Слабое продление уже видно, но причина ухода пока неизвестна. Без неё легко лечить не ту проблему.';
        out.action = numbered(
          'Возьмите последние реальные непродления или отмены.',
          'Для каждого зафиксируйте известную причину словами участника или по наблюдаемому факту: не пользовался, не получил пользы, цена, время, формат, сервис, техника или временная пауза.',
          'Когда одна причина начнёт повторяться, исправляйте именно её.'
        );
        out.metric = 'Доля непродлений с известной причиной + самая частая повторяющаяся причина.';
        out.dont = 'Не начинайте со скидки или массовых напоминаний, пока не знаете, почему люди уходят.';
      } else if (['no','mostly_no'].includes(a.core_offer) && Array.isArray(a.deep_o1) && meaningful(a.deep_o1).length === 0 && a.deep_o2 === 'easy') {
        out.title = 'Сначала перепроверьте предложение на одном конкретном экране';

    if (code === 'BUILD_CAPACITY') {

      };

    return out;
  }

  function buildWhy(code) {
    const a = state.answers;
    const lines = [];
    const add = (cond, text) => { if (cond) lines.push(text); };
    const targetLabels = {
      attended_visits:'больше реально состоявшихся визитов', fill_slots:'заполнить свободные окна', new_customers:'больше новых клиентов',
      completed_orders:'больше выполненных заказов', paid_clients:'больше оплаченных клиентов или проектов', paid_students:'больше оплаченных участников',
      revenue:'больше выручки', owner_money:'больше денег оставлять себе', per_sale:'больше зарабатывать с каждой продажи',
      same_money_less_time:'сохранять заработок при меньших затратах времени', steady_orders:'более ровные заказы', steady_income:'более ровный доход',
      less_channel_dependency:'меньше зависеть от одного источника', less_hours:'меньше работать по времени', fewer_urgent:'меньше авралов',
      stable_quality:'сохранять качество без перегруза', repeat_orders:'больше повторных заказов', repeat_visits:'больше повторных визитов',
      repeat_work:'больше повторной работы с подходящими клиентами', next_learning:'больше подходящих продолжений обучения', repeat_income:'больше дохода от повторных клиентов', new_subscribers:'больше новых подписчиков', renewals:'больше продлений',
      active_members:'больше активных участников', less_churn:'меньше уходов из подписки', reactivate_members:'возвращать подходящих ушедших участников'
    };
    if (targetLabels[a.scope_target]) lines.push(`Вы указали конкретную цель: ${targetLabels[a.scope_target]}. Поэтому приоритет выбирается именно под неё, а не под абстрактное «больше продаж».`);
    add(a.period_integrity && !['normal','unknown'].includes(a.period_integrity), 'Выбранный период был необычным: часть времени вы не могли работать в обычном режиме. Поэтому сравнивать продажи с другими периодами нужно осторожно.');
    add(meaningful(a.period_context).some(v => ['peak','slump','offer_change','channel_change'].includes(v)), 'В этот период были изменения — сезон, цены, товар или источник клиентов. Они могли заметно повлиять на результат.');
    add(code === 'ACCESS' && ['none','unstable'].includes(a.core_access), 'Новые люди, которые действительно могут купить у вас, приходят редко или нерегулярно.');
    add(code === 'OFFER' && ['no','mostly_no'].includes(a.core_offer), 'Новому человеку трудно быстро понять, что вы продаёте, сколько это стоит и на каких условиях.');
    add(code === 'FIT' && ['half','bad'].includes(a.core_fit), 'Среди обращений много людей, которым ваш товар или услуга не подходят по важным условиям.');
    add(code === 'DECISION_GAP' && ['often','almost_always'].includes(a.core_trust), 'Перед покупкой люди часто задают один и тот же вопрос или сомневаются в одном и том же.');
    add(code === 'PURCHASE_FRICTION' && ['hard','breaks'].includes(a.core_conversion), 'Даже люди, которые уже хотят купить, заметно теряются во время оформления.');
    add(['START_FAILURE','ACTIVATION_FAILURE','FIRST_VALUE_GAP'].includes(code) && ['losses','problem'].includes(a.core_start), 'Часть клиентов теряется уже после покупки, записи или оплаты.');
    add(code === 'FULFILLMENT' && a.gate_fulfillment === 'regular', 'При выполнении текущих заказов регулярно повторяются задержки, ошибки, переделки или другие сбои.');
    add(code === 'VALUE_FAILURE' && ['issues','no'].includes(a.core_value), 'Есть признаки, что часть клиентов не получает тот результат, который ожидала.');
    add(['NEXT_CYCLE','CUSTOMER_MEMORY_GAP'].includes(code) && a.core_repeat === 'rare', 'Повторная покупка здесь возможна, но клиенты возвращаются редко.');
    add(code === 'RECOVERY_FAILURE' && a.post_recovery === 'often_unresolved', 'Часть проблем после продажи остаётся без понятного решения для клиента.');
    add(code === 'SUB_RENEWAL' && ['rare','sometimes'].includes(a.core_repeat), 'Участники доходят до срока продления, но заметная часть не продолжает подписку.');
    add(code === 'ADVOCACY_GAP' && a.post_referral === 'no', 'У довольного клиента сейчас нет простого понятного способа передать вас другому человеку.');
    add(code === 'REACTIVATION_GAP' && ['many','some'].includes(a.post_reactivation), 'Есть бывшие клиенты, для которых возвращение может быть уместным.');
    add(code === 'ECONOMICS' && ['negative','low','mixed','unknown'].includes(a.gate_economics), 'Пока неясно, сколько вы действительно зарабатываете на части продаж, либо заработок выглядит слишком низким.');
    add(code === 'CAPACITY' && ['limit','overload'].includes(a.gate_capacity), 'Вы уже близко к пределу нагрузки или не справляетесь с текущим объёмом.');
    add(['DEMAND_WEAK','DEMAND_UNCLEAR'].includes(code) && ['rare','unknown'].includes(a.core_demand), 'Пока мало реальных признаков, что люди активно пытаются купить такой товар или услугу.');
    if (!lines.length) lines.push('По вашим ответам именно этот участок сейчас больше других влияет на результат и его разумно проверить первым.');
    return lines;
  }

  
  function secondaryRisks(primary) {
    const a = state.answers;
    const risks = [];
    const add = (code, text, cond) => { if (cond && code !== primary) risks.push(text); };
    add('LEGAL','Есть вопрос по обязательным требованиям', ['maybe','unknown'].includes(a.gate_legal));
    add('FULFILLMENT','Повторяются проблемы с выполнением заказов', a.gate_fulfillment === 'regular');
    add('ECONOMICS','Некоторые продажи могут быть убыточными', a.gate_economics === 'negative');
    add('ECONOMICS','С части продаж остаётся слишком мало денег', a.gate_economics === 'low');
    add('ECONOMICS','Разные товары или услуги дают очень разный заработок', a.gate_economics === 'mixed');
    add('ECONOMICS','Пока неясно, сколько остаётся с продажи', a.gate_economics === 'unknown');
    add('CAPACITY','Нагрузка уже близка к пределу', ['limit','overload'].includes(a.gate_capacity));
    add('ACCESS','Новые клиенты приходят нерегулярно', a.core_access === 'unstable');
    add('FIT','Много обращений, которые заведомо не могут закончиться покупкой', ['half','bad'].includes(a.core_fit));
    add(a.scope_model === 'SUBSCRIPTION' ? 'SUB_RENEWAL' : 'NEXT_CYCLE', a.scope_model === 'SUBSCRIPTION' ? 'Продления происходят редко' : 'Клиенты редко возвращаются, хотя повтор возможен', a.core_repeat === 'rare');
    add('RECOVERY_FAILURE','Часть проблем после продажи остаётся нерешённой', a.post_recovery === 'often_unresolved');
    add('ADVOCACY_GAP','Есть неиспользованный путь рекомендаций от довольных клиентов', a.post_referral === 'no');
    add('REACTIVATION_GAP','Есть подходящие бывшие клиенты, которых можно вернуть по уместному поводу', a.post_reactivation === 'many');
    add('CHANNEL','Новые клиенты слишком сильно зависят от одного источника', ['mostly','all'].includes(a.deep_a3));
    return risks.slice(0, 4);
  }

  
  function confidenceFor(code) {
    const a = state.answers;
    if (state.mode === 'build' || state.mode === 'hybrid') return CONFIDENCE.MEDIUM;
    const directEvidence =
      (code === 'FULFILLMENT' && a.gate_fulfillment === 'regular' && meaningful(a.deep_f1).length) ||
      (code === 'CAPACITY' && ['overload','limit'].includes(a.gate_capacity) && a.deep_cap1 && a.deep_cap1 !== 'unknown') ||
      (code === 'PURCHASE_FRICTION' && a.core_conversion === 'breaks' && meaningful(a.deep_c1).length) ||
      (code === 'START_FAILURE' && ['losses','problem'].includes(a.core_start) && a.deep_s3 && a.deep_s3 !== 'unknown') ||
      (['ACTIVATION_FAILURE','FIRST_VALUE_GAP'].includes(code) && a.deep_s1 && a.deep_s2 && a.deep_s3 && a.deep_s3 !== 'unknown') ||
      (code === 'OFFER' && ['no','mostly_no'].includes(a.core_offer) && meaningful(a.deep_o1).length) ||
      (code === 'FIT' && ['half','bad'].includes(a.core_fit) && meaningful(a.deep_fit1).length) ||
      (code === 'VALUE_FAILURE' && a.deep_v2 === 'yes' && a.deep_v3 && a.deep_v3 !== 'unknown') ||
      (code === 'ECONOMICS' && a.gate_economics === 'negative') ||
      (code === 'RECOVERY_FAILURE' && a.post_recovery === 'often_unresolved') ||
      (code === 'SUB_RENEWAL' && ['yes','partly'].includes(a.sub_cancel_known) && meaningful(a.sub_cancel_reason).length) ||
      (code === 'REACTIVATION_GAP' && a.post_reactivation === 'many');
    if (directEvidence) return CONFIDENCE.HIGH;
    if (code === 'LEGAL_SAFETY_BLOCKER') return CONFIDENCE.MEDIUM;
    return CONFIDENCE.PRELIMINARY;
  }

  function followupPlanContext() {
    const base = state.followupBase || {};
    const result = base.result || base;
    const plan = base.experimentPlan || result.experimentPlan || state.activeExperiment || null;
    return { base, result, plan };
  }

  function classifyFollowup() {
    const a = state.answers;
    const { plan } = followupPlanContext();
    const guard = Array.isArray(a.fu_guardrail) ? a.fu_guardrail : [];
    const redGuardrail = guard.some(x => x !== 'none');

    if (a.fu_done === 'no') {
      return { outcome:null, code:FOLLOWUP_CODE.NOT_EXECUTED, decision:'CONTINUE', reason:'Основное изменение не было выполнено.' };
    }
    if (a.fu_done === 'different') {
      return { outcome:FOLLOWUP_OUTCOME.R_INVALID, code:FOLLOWUP_CODE.INVALID_MEASUREMENT, decision:'REDESIGN', reason:'Вместо запланированного было выполнено другое изменение.' };
    }
    if (['one','several'].includes(a.fu_execution_match)) {
      return { outcome:FOLLOWUP_OUTCOME.R_INVALID, code:FOLLOWUP_CODE.INVALID_MEASUREMENT, decision:'REDESIGN', reason:'Одновременно менялись другие существенные факторы, поэтому причинный вывод нельзя приписать одному изменению.' };
    }
    if (a.fu_sample_ready === 'stopped') {
      return { outcome:FOLLOWUP_OUTCOME.R_MINUS, code:FOLLOWUP_CODE.EARLY_STOP, decision:'ROLLBACK', reason:'Проверку остановили раньше из-за риска или вреда.' };
    }
    if (['not_yet','unknown'].includes(a.fu_sample_ready)) {
      return { outcome:FOLLOWUP_OUTCOME.R_ZERO, code:FOLLOWUP_CODE.INSUFFICIENT_EVIDENCE, decision:'CONTINUE', reason:'Условие наблюдения ещё не выполнено.' };
    }
    if (a.fu_sample_ready === 'cap') {
      return { outcome:FOLLOWUP_OUTCOME.R_ZERO, code:FOLLOWUP_CODE.INSUFFICIENT_EVIDENCE, decision:'REDESIGN', reason:'Лимит проверки достигнут, а достаточного evidence для решения нет.' };
    }
    if (a.fu_measurement_valid === 'no') {
      return { outcome:FOLLOWUP_OUTCOME.R_INVALID, code:FOLLOWUP_CODE.INVALID_MEASUREMENT, decision:'REDESIGN', reason:'Данные или условия оказались несопоставимыми.' };
    }
    if (a.fu_measurement_valid === 'unknown') {
      return { outcome:FOLLOWUP_OUTCOME.R_ZERO, code:FOLLOWUP_CODE.INSUFFICIENT_EVIDENCE, decision:'REDESIGN', reason:'Нельзя уверенно определить, пригодно ли сравнение для решения.' };
    }
    if (redGuardrail) {
      return { outcome:FOLLOWUP_OUTCOME.R_MINUS, code:FOLLOWUP_CODE.GUARDRAIL_FAIL, decision:'ROLLBACK', reason:'Даже при улучшении основной метрики ухудшился важный guardrail.' };
    }
    if (a.fu_effect === 'better') {
      return {
        outcome:FOLLOWUP_OUTCOME.R_PLUS,
        code:a.fu_done === 'primary_only' ? FOLLOWUP_CODE.PARTIAL_EXECUTION : FOLLOWUP_CODE.CONFIRMED,
        decision:'CONFIRM',
        reason:a.fu_done === 'primary_only'
          ? 'Основное изменение выполнено и критерий успеха достигнут без отмеченного вреда, но невыполненные вспомогательные шаги считать проверенными нельзя.'
          : 'Критерий успеха достигнут без отмеченного вреда guardrails.'
      };
    }
    if (['worse','same'].includes(a.fu_effect)) {
      return { outcome:FOLLOWUP_OUTCOME.R_MINUS, code:FOLLOWUP_CODE.FAILED, decision:'REDESIGN', reason:'После полного валидного наблюдения критерий успеха не достигнут.' };
    }
    return { outcome:FOLLOWUP_OUTCOME.R_ZERO, code:FOLLOWUP_CODE.INSUFFICIENT_EVIDENCE, decision:'REDESIGN', reason:'Эффект остался между заранее заданными ветками решения.' };
  }

  function buildStateTransition(followupClass) {
    const { result: previousResult, plan } = followupPlanContext();
    const previousCode = previousResult?.primaryCode || previousResult?.code || plan?.primaryCode || null;
    const originMode = previousResult?.diagnosticMode || state.followupBase?.mode || null;
    const guardrails = Array.isArray(state.answers.fu_guardrail) ? state.answers.fu_guardrail : [];

    if (followupClass.code === FOLLOWUP_CODE.NOT_EXECUTED) {
      return {
        type:'CONTINUE_EVIDENCE',
        fromPrimaryCode:previousCode,
        toPrimaryCode:previousCode,
        nextResult:null
      };
    }

    if (followupClass.code === FOLLOWUP_CODE.GUARDRAIL_FAIL && guardrails.includes('safety')) {
      return {
        type:'HARD_BLOCKER_EMERGED',
        fromPrimaryCode:previousCode,
        toPrimaryCode:'LEGAL_SAFETY_BLOCKER',
        nextResult:makeResult('LEGAL_SAFETY_BLOCKER')
      };
    }

    if (followupClass.outcome === FOLLOWUP_OUTCOME.R_PLUS) {
      const buildNext = {
        BUILD_MARKET_TEST:'BUILD_FULFILLMENT',
        BUILD_DEMAND:'BUILD_FULFILLMENT',
        BUILD_FULFILLMENT:'BUILD_VALUE',
        BUILD_VALUE:'BUILD_ECONOMICS',
        BUILD_ECONOMICS:'BUILD_CAPACITY',
      }[previousCode];

      if (buildNext) {
        return { type:'BUILD_PHASE_ADVANCED', fromPrimaryCode:previousCode, toPrimaryCode:buildNext, nextResult:makeResult(buildNext) };
      }

      if (previousCode === 'BUILD_CAPACITY') {
        return {
          type:'RESOLVED_TO_NEXT',
          fromPrimaryCode:previousCode,
          toPrimaryCode:null,
          nextResult:makeResult('NO_CRITICAL_CONSTRAINT_FOUND')
        };
      }

      const zone = primaryCodeZone(previousCode);
      if (zone && !state.precisionExcludedZones.includes(zone)) state.precisionExcludedZones.push(zone);
      if (originMode === DIAGNOSTIC_MODE.FULL || originMode === 'full') {
        const nextResult = diagnoseFull();
        const nextCode = nextResult?.primaryCode || nextResult?.code || null;
        return {
          type: nextCode && nextCode !== previousCode ? 'RESOLVED_TO_NEXT' : 'SAME_CONSTRAINT_NEW_INTERVENTION',
          fromPrimaryCode:previousCode,
          toPrimaryCode:nextCode,
          nextResult
        };
      }
      return { type:'RESOLVED_TO_NEXT', fromPrimaryCode:previousCode, toPrimaryCode:null, nextResult:null };
    }

    if (followupClass.outcome === FOLLOWUP_OUTCOME.R_MINUS) {
      return {
        type:'SAME_CONSTRAINT_NEW_INTERVENTION',
        fromPrimaryCode:previousCode,
        toPrimaryCode:previousCode,
        nextResult:null
      };
    }
    if (followupClass.outcome === FOLLOWUP_OUTCOME.R_ZERO) {
      return {
        type:followupClass.decision === 'CONTINUE' ? 'CONTINUE_EVIDENCE' : 'REDESIGN_TEST',
        fromPrimaryCode:previousCode,
        toPrimaryCode:previousCode,
        nextResult:null
      };
    }
    if (followupClass.outcome === FOLLOWUP_OUTCOME.R_INVALID) {
      return {
        type:'REDESIGN_TEST',
        fromPrimaryCode:previousCode,
        toPrimaryCode:previousCode,
        nextResult:null
      };
    }
    return { type:'CLOSED', fromPrimaryCode:previousCode, toPrimaryCode:previousCode, nextResult:null };
  }

  function followupHumanResult(followupClass, transition) {
    const { result: previousResult, plan } = followupPlanContext();
    const previousTitle = previousResult?.userTitle || previousResult?.title || 'прошлый вывод';
    const primaryMetric = plan?.primaryMetric || previousResult?.metrics?.[0] || previousResult?.metric || 'основной показатель';
    const partial = state.answers.fu_done === 'primary_only';

    if (followupClass.code === FOLLOWUP_CODE.NOT_EXECUTED) return {
      title:'Проверка ещё не состоялась',
      summary:'Основное изменение не было выполнено, поэтому по его эффективности пока нельзя делать вывод.',
      action:'Вернитесь к запланированному действию только если оно всё ещё актуально. Если выполнить его нереалистично — закройте этот план и сформулируйте более выполнимый следующий шаг.',
      metric:'Факт выполнения основного изменения.',
      dont:'Не называйте прошлую гипотезу подтверждённой или опровергнутой.',
      next:'После фактического выполнения вернитесь к Follow-up.'
    };

    if (followupClass.outcome === FOLLOWUP_OUTCOME.R_INVALID) return {
      title:'Эта проверка не даёт причинного вывода',
      summary:followupClass.reason,
      action:'Если ответ всё ещё нужен, повторите проверку в более чистых условиях: одно основное изменение, сопоставимый способ измерения и заранее зафиксированное условие наблюдения.',
      metric:primaryMetric,
      dont:'Не используйте этот результат как доказательство, что исходная гипотеза верна или неверна.',
      next:'Пересоберите test design и повторяйте только если решение всё ещё важно.'
    };

    if (followupClass.outcome === FOLLOWUP_OUTCOME.R_ZERO) return {
      title:'Пока недостаточно evidence для решения',
      summary:followupClass.reason,
      action:followupClass.decision === 'CONTINUE'
        ? 'Не меняйте гипотезу и intervention. Доведите заранее выбранное условие наблюдения до конца, если это безопасно и разумно.'
        : 'Не тяните тест бесконечно. Пересоберите observation rule или выберите более информативный способ различить варианты.',
      metric:primaryMetric,
      dont:'Не записывайте этот исход как успех или провал.',
      next:followupClass.decision === 'CONTINUE' ? (plan?.followupTrigger || 'Вернитесь после выполнения observation rule.') : 'После нового test design начните отдельную чистую проверку.'
    };

    if (followupClass.outcome === FOLLOWUP_OUTCOME.R_MINUS) return {
      title:followupClass.code === FOLLOWUP_CODE.GUARDRAIL_FAIL ? 'Основная метрика не оправдывает вред по guardrail' : 'Это изменение не прошло проверку',
      summary:followupClass.reason,
      action:followupClass.decision === 'ROLLBACK'
        ? 'Остановите или откатите это изменение, если это безопасно и возможно. Старую гипотезу не обязательно считать ложной: неудачным мог быть именно intervention.'
        : 'Не повторяйте то же действие автоматически. Вернитесь к этому constraint и выберите другой механизм или перепроверьте сам diagnosis.',
      metric:primaryMetric,
      dont:'Не масштабируйте это изменение только потому, что уже вложили в него время или деньги.',
      next:'Новый шаг должен быть отдельным решением, а не автоматическим повтором прошлого intervention.'
    };

    const moved = transition?.toPrimaryCode && transition.toPrimaryCode !== transition.fromPrimaryCode;
    return {
      title:partial ? 'Основное изменение прошло проверку, но вспомогательные шаги проверены не полностью' : 'Изменение прошло проверку',
      summary:followupClass.reason + (moved ? ' После пересчёта главный constraint переместился.' : ''),
      action:moved
        ? 'Сохраните проверенное полезное изменение как рабочее состояние и переходите к новому primary constraint.'
        : 'Сохраните проверенное изменение. Не масштабируйте его автоматически: сначала убедитесь, что экономика, качество и нагрузка остаются приемлемыми.',
      metric:primaryMetric,
      dont:'Не приписывайте результат невыполненным вспомогательным шагам и не добавляйте новые изменения без новой диагностики.',
      next:moved ? 'Следующий цикл начинается с нового primary result.' : 'Проведите короткий State Transition Test и выберите следующий decision-critical шаг.'
    };
  }

  function finalizeFollowup() {
    const { base, result: previousResult, plan } = followupPlanContext();
    const a = state.answers;
    const cls = classifyFollowup();
    const transition = buildStateTransition(cls);
    const human = followupHumanResult(cls, transition);
    const guardrails = Array.isArray(a.fu_guardrail) ? a.fu_guardrail : [];
    const confidenceAfter =
      cls.outcome === FOLLOWUP_OUTCOME.R_PLUS && a.fu_done === 'yes' && a.fu_measurement_valid === 'yes' && a.fu_execution_match === 'no'
        ? CONFIDENCE.HIGH
        : (cls.outcome === FOLLOWUP_OUTCOME.R_MINUS ? CONFIDENCE.MEDIUM : CONFIDENCE.PRELIMINARY);

    const followupSnapshot = {
      followupId:'followup_' + Date.now() + '_' + Math.random().toString(36).slice(2,8),
      experimentId:plan?.experimentId || null,
      timestamp:new Date().toISOString(),
      executionStatus:a.fu_done || null,
      executionFidelity:a.fu_execution_match || null,
      contaminationStatus:['one','several'].includes(a.fu_execution_match) ? 'MATERIAL' : (a.fu_execution_match === 'unknown' ? 'UNKNOWN' : 'NONE'),
      observationCompletion:a.fu_sample_ready || null,
      measurementValidity:a.fu_measurement_valid || null,
      primaryMetricBefore:null,
      primaryMetricAfter:a.fu_effect || null,
      guardrailResults:guardrails,
      outcomeClass:cls.outcome,
      followupCode:cls.code,
      decision:cls.decision,
      stateTransition:transition.type,
      newPrimaryCode:transition.toPrimaryCode || null,
      confidenceAfter,
      nextAction:human.action,
      nextFollowupTrigger:
        (cls.code === FOLLOWUP_CODE.NOT_EXECUTED || (cls.outcome === FOLLOWUP_OUTCOME.R_ZERO && cls.decision === 'CONTINUE'))
          ? plan?.followupTrigger || null
          : null
    };

    state.result = {
      resultId:'result_' + Date.now() + '_' + Math.random().toString(36).slice(2,8),
      diagnosticMode:DIAGNOSTIC_MODE.FOLLOWUP,
      businessGoal:previousResult?.businessGoal || base?.answers?.scope_goal || null,
      diagnosticTarget:previousResult?.diagnosticTarget || base?.answers?.scope_target || null,
      resultKind:RESULT_KIND.FOLLOWUP_RESULT,
      primaryCode:transition.toPrimaryCode || previousResult?.primaryCode || previousResult?.code || 'FOLLOWUP',
      userTitle:human.title,
      userSummary:human.summary,
      evidence:[
        {type:'REPEATED_OBSERVATION',questionId:'fu_done',value:a.fu_done,label:'Выполнение запланированного изменения'},
        {type:'USER_ESTIMATE',questionId:'fu_sample_ready',value:a.fu_sample_ready,label:'Выполнение observation rule'},
        {type:'USER_ESTIMATE',questionId:'fu_measurement_valid',value:a.fu_measurement_valid,label:'Пригодность сравнения'}
      ],
      confidence:confidenceAfter,
      action:human.action,
      holdConstant:[human.dont],
      metrics:[human.metric],
      observationRule:human.next,
      successRule:'Следующий цикл должен использовать новый state, а не автоматически повторять старое действие.',
      failureRule:'Если новое действие снова не проходит проверку, пересчитать diagnosis/state.',
      nextIfSuccess:transition.nextResult?.userTitle || transition.nextResult?.title || human.next,
      nextIfFailure:human.next,
      precisionAvailable:false,
      precisionFields:[],
      optionalOpportunity:null,
      guardrails:[],
      followup:true,
      followupOutcome:cls.outcome,
      followupCode:cls.code,
      followupSnapshot,
      stateTransition:transition,
      experimentPlan:null,
      title:human.title,
      summary:human.summary,
      action:human.action,
      metric:human.metric,
      dont:human.dont,
      next:human.next,
      kind:'Повторная проверка',
      confidenceLabel:confidenceLabel(confidenceAfter),
      why:[
        'Прошлый вывод: ' + (previousResult?.userTitle || previousResult?.title || 'сохранённый результат') + '.',
        cls.reason,
        'Решение после проверки: ' + cls.decision + '.'
      ],
      secondary:[],
      date:new Date().toISOString()
    };

    if (plan) {
      state.activeExperiment = {
        ...plan,
        status: (cls.code === FOLLOWUP_CODE.NOT_EXECUTED || (cls.outcome === FOLLOWUP_OUTCOME.R_ZERO && cls.decision === 'CONTINUE'))
          ? EXPERIMENT_STATUS.ACTIVE
          : (cls.outcome === FOLLOWUP_OUTCOME.R_INVALID ? EXPERIMENT_STATUS.INVALIDATED : EXPERIMENT_STATUS.COMPLETED)
      };
    }
    renderResult(state.result);
  }

  
  function renderResult(result) {
    const tpl = document.getElementById('resultTemplate').content.cloneNode(true);
    app.replaceChildren(tpl);
    document.getElementById('resultTitle').textContent = result.title;
    document.getElementById('resultSummary').textContent = result.summary;
    const badge = document.getElementById('confidenceBadge');
    badge.textContent = result.followup
      ? 'Повторная проверка'
      : ((result.kind || 'Вывод') + (result.precisionRefined ? ' · уточнено цифрами' : '') + ' · уверенность: ' + (result.confidenceLabel || confidenceLabel(result.confidence)).toLowerCase());
    const why = document.getElementById('resultWhy');
    result.why.forEach(x => { const d=document.createElement('div'); d.className='reason'; d.textContent=x; why.appendChild(d); });
    document.getElementById('resultProven').textContent = result.proven || '';
    document.getElementById('resultBoundary').textContent = result.boundary || '';
    document.getElementById('resultAction').textContent = result.action;
    document.getElementById('resultMetric').textContent = (result.metrics || [result.metric]).filter(Boolean).join(' · ');
    document.getElementById('resultObservation').textContent = result.observationRule || result.next || '';
    document.getElementById('resultDont').textContent = (result.holdConstant || [result.dont]).filter(Boolean).join(' ');
    document.getElementById('resultDecisionRule').textContent =
      'Если успех: ' + (result.successRule || 'основной показатель улучшился без вреда') +
      ' Если нет: ' + (result.failureRule || 'результат не улучшился или появился вред') + '.';
    document.getElementById('resultNext').textContent =
      'При успехе: ' + (result.nextIfSuccess || result.next || '') +
      ' При неуспехе: ' + (result.nextIfFailure || 'вернуться к диагностике и выбрать другую причину.');

    if (result.followup && result.stateTransition?.nextResult && state.activeCycleId) {
      const nextCycleButton=document.createElement('button');
      nextCycleButton.type='button';
      nextCycleButton.className='primary-btn';
      nextCycleButton.textContent='Перейти к следующему циклу';
      nextCycleButton.addEventListener('click',()=>startLinkedCycle(state.activeCycleId,result.stateTransition.nextResult));
      document.getElementById('resultNext').after(nextCycleButton);
    }

    const experimentCard = document.getElementById('experimentPlanCard');
    const experimentPlan = result.experimentPlan || experimentPlanFor(result);
    if (experimentPlan) {
      result.experimentPlan = experimentPlan;
      experimentCard.hidden = false;
      document.getElementById('experimentPlanType').textContent = experimentPlanTypeLabel(experimentPlan.planType);
      document.getElementById('experimentChange').textContent = experimentPlan.changeOneThing;
      const steps = document.getElementById('experimentSteps');
      experimentPlan.executionSteps.forEach(step => {
        const li=document.createElement('li');
        li.textContent=step;
        steps.appendChild(li);
      });
      document.getElementById('experimentPrimaryMetric').textContent =
        [experimentPlan.primaryMetric, ...experimentPlan.secondaryMetrics].filter(Boolean).join(' · ') || 'Зафиксируйте наблюдаемый результат, который указан в decision rule.';
      document.getElementById('experimentHold').textContent =
        experimentPlan.holdConstant.length ? experimentPlan.holdConstant.join(' ') : 'Не добавляйте второе независимое изменение во время этой проверки.';
      document.getElementById('experimentObservation').textContent = experimentPlan.observationRule || '';
      document.getElementById('experimentBranches').textContent =
        'R+: ' + experimentPlan.successRule +
        ' R−: ' + experimentPlan.failureRule +
        ' R0: ' + experimentPlan.inconclusiveRule +
        ' RX: ' + experimentPlan.invalidRule;
      document.getElementById('experimentEarlyStop').textContent =
        experimentPlan.earlyStopRule + ' ' + experimentPlan.followupTrigger;

      const startExperimentButton = document.getElementById('startExperimentButton');
      if (experimentPlan.status === EXPERIMENT_STATUS.ACTIVE) {
        startExperimentButton.disabled = true;
        startExperimentButton.textContent = 'Проверка уже начата';
      } else {
        startExperimentButton.addEventListener('click', () => {
          const activePlan = {
            ...experimentPlan,
            status:EXPERIMENT_STATUS.ACTIVE,
            startedAt:new Date().toISOString()
          };
          result.experimentPlan = activePlan;
          state.activeExperiment = activePlan;
          const item = {
            cycleId:state.activeCycleId,
            appVersion:APP_VERSION,
            date:result.date,
            mode:state.mode,
            scope:state.answers.scope_name || '',
            answers:state.answers,
            result,
            experimentPlan:activePlan,
            cycleStatus:CYCLE_STATUS.ACTIVE
          };
          const saved = saveHistory(item);
          const message=document.getElementById('experimentStartMessage');
          message.hidden=false;
          message.textContent=saved
            ? 'План сохранён. Возвращайтесь к проверке после выполнения условия наблюдения или раньше, если сработает защитный стоп.'

    const precisionCard = document.getElementById('precisionCard');

    const secCard = document.getElementById('secondaryCard');
    const sec = document.getElementById('secondaryRisks');
    if (!result.optionalOpportunity) secCard.hidden = true;
    else {
      const t=document.createElement('span');
      t.className='tag';
      t.textContent=result.optionalOpportunity.title;
      sec.appendChild(t);
    }

    const precisionButton = document.getElementById('precisionResultButton');
    if (!result.followup && !result.precisionRefined && result.precisionAvailable) {
      precisionButton.hidden = false;
      precisionButton.addEventListener('click', () => startPrecision(result));
    }

    const saveButton = document.getElementById('saveResultButton');
    saveButton.textContent = result.followup ? 'Сохранить проверку' : 'Сохранить результат';
    saveButton.addEventListener('click', () => {
      const item = {
        cycleId: state.activeCycleId,
        appVersion: APP_VERSION,
        date: result.date,
        mode: state.mode,
        scope: state.answers.scope_name || state.followupBase?.scope || '',

        result,
        experimentPlan: result.experimentPlan || null,
        cycleStatus: result.followup
          ? (result.followupCode === FOLLOWUP_CODE.NOT_EXECUTED

              : (result.followupOutcome === FOLLOWUP_OUTCOME.R_ZERO && result.followupSnapshot?.decision === 'CONTINUE'
                  ? CYCLE_STATUS.WAITING_FOR_EVIDENCE
                  : CYCLE_STATUS.COMPLETED))
          : (result.experimentPlan
              ? (result.experimentPlan.status === EXPERIMENT_STATUS.ACTIVE ? CYCLE_STATUS.ACTIVE : CYCLE_STATUS.PLANNED)
              : CYCLE_STATUS.DIAGNOSED),
      };
      const saved = saveHistory(item);
      const msg = document.getElementById('saveMessage');
      msg.hidden = false;
      if (saved) {
        msg.textContent = 'Результат сохранён в этом браузере.';
        saveButton.disabled = true;
      } else {
        msg.textContent = 'Браузер не разрешил сохранить историю. Скопируйте результат, чтобы не потерять его.';
      }
    });
    document.getElementById('restartResultButton').addEventListener('click', showHome);
    document.getElementById('copyResultButton').addEventListener('click', async () => {
      const text = resultText(result);
      try {
        await navigator.clipboard.writeText(text);
        document.getElementById('copyResultButton').textContent = 'Скопировано';
      } catch {
        window.prompt('Скопируйте результат:', text);
      }
    });
    resetButton.hidden = false;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resultText(r) {
  const precision = r.precisionSummary ? `\n\nЧто показывают ваши цифры:\n${r.precisionSummary}\n${r.precisionCaveat || ''}` : '';
  const opportunity = r.optionalOpportunity ? `\n\nДополнительная возможность:\n${r.optionalOpportunity.title}` : '';
  const plan = r.experimentPlan ? `\n\nПлан проверки:\nМеняем: ${r.experimentPlan.changeOneThing}\nКак выполнить:\n${r.experimentPlan.executionSteps.map((x,i)=>(i+1)+'. '+x).join('\n')}\nГлавный показатель: ${r.experimentPlan.primaryMetric || ''}\nКогда оценивать: ${r.experimentPlan.observationRule || ''}\nR+: ${r.experimentPlan.successRule}\nR−: ${r.experimentPlan.failureRule}\nR0: ${r.experimentPlan.inconclusiveRule}\nRX: ${r.experimentPlan.invalidRule}` : '';
  return `${r.userTitle || r.title}\n\nПочему:\n${r.why.map(x=>'• '+x).join('\n')}\n\nУверенность:\n${r.confidenceLabel || confidenceLabel(r.confidence)}\n\nЧто этот вывод означает:\n${r.proven || ''}\n${r.boundary || ''}${precision}\n\nЧто сделать первым:\n${r.action}\n\nПока не менять:\n${(r.holdConstant || [r.dont]).filter(Boolean).join(' ')}\n\nЧто измерить:\n${(r.metrics || [r.metric]).filter(Boolean).join(' · ')}\n\nКогда оценивать:\n${r.observationRule || r.next || ''}\n\nКак принять решение:\nЕсли успех: ${r.successRule || ''}\nЕсли нет: ${r.failureRule || ''}\n\nЧто дальше:\nПри успехе: ${r.nextIfSuccess || r.next || ''}\nПри неуспехе: ${r.nextIfFailure || ''}${plan}${opportunity}`;
}

  function isAnswered(id) {
    const v = state.answers[id];
    if (Array.isArray(v)) return v.length > 0;
    return v !== undefined && v !== null && String(v).trim() !== '';
  }
  function resolve(value) { return typeof value === 'function' ? value(state) : value; }
  function sectionName(id) {
    if (id.startsWith('scope') || id.startsWith('period') || id.startsWith('mode')) return 'Контекст';
    if (id.startsWith('hybrid') || id.startsWith('inheritance_entry')) return 'Что можно сохранить из уже работающего';
    if (id.startsWith('shared')) return 'Общие ресурсы';
    if (id.startsWith('gate')) return 'Защитная проверка';
    if (id.startsWith('core')) return 'Общий скан';
    if (id.startsWith('deep')) return 'Уточнение';
    if (id.startsWith('build')) return 'Новый продукт';
    if (id.startsWith('p_')) return 'Уточняем цифрами';
    if (id.startsWith('fu')) return 'Повторная проверка';
    return '';
  }
  function formatDate(iso) { try { return new Intl.DateTimeFormat('ru-RU', { day:'numeric', month:'long', year:'numeric' }).format(new Date(iso)); } catch { return ''; } }

  window.__diagTest = { state, questions, resultLibrary, startMode, showHome, goNext, collectCandidates, diagnoseFull, diagnoseBuild, diagnoseDemand, diagnoseAccess, diagnoseStart, diagnoseFulfillment, diagnoseValue, diagnoseRepeat, decisionCriticalUnknown, makeResult, concretizeResult, resultKindCodeFor, buildEvidenceObjects, resultPlanFor, optionalOpportunityFor, PRECISION_CONFIG, precisionEvaluate, EXPERIMENT_PLAN_TYPE, EXPERIMENT_STATUS, experimentPlanFor, FOLLOWUP_OUTCOME, FOLLOWUP_CODE, classifyFollowup, buildStateTransition, loadHistoryStore, writeHistoryStore, resumeCycle, startLinkedCycle, clearClosedHistory, deleteCycle, exportHistory, adaptResultToModel, chooseDiscriminatorQuestions, hardGateResult, buildEarlyResult, meaningful, sectionName, resultText, precisionQuestionsFor, finalizePrecision };

  resetButton.addEventListener('click', showHome);
  brandButton.addEventListener('click', showHome);
  showHome();
})();
