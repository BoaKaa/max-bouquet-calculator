<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#f6f4ef" />
  <meta name="description" content="Практический инструмент для проверки продаж у мастеров, услуг, экспертов и обучения." />
  <title>Диагностика системы продаж</title>
  <style>
:root {
  --bg: #f6f4ef;
  --surface: #fffdf9;
  --surface-2: #f0ede6;
  --text: #1f2421;
  --muted: #686b67;
  --line: #ddd8cf;
  --accent: #253a33;
  --accent-soft: #e5ece8;
  --warning: #775f2d;
  --warning-soft: #f5ecd3;
  --danger: #7a3737;
  --danger-soft: #f4e2e2;
  --ok: #315b45;
  --ok-soft: #e2eee7;
  --shadow: 0 12px 35px rgba(42, 40, 35, .08);
  --radius: 22px;
  --max: 760px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.5;
}
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: 3px solid rgba(37,58,51,.22);
  outline-offset: 2px;
}

.app-shell { min-height: 100vh; display: flex; flex-direction: column; }
.topbar {
  width: min(100%, calc(var(--max) + 48px));
  margin: 0 auto;
  padding: 16px 24px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.brand {
  border: 0;
  background: transparent;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: inherit;
  padding: 0;
  text-align: left;
}
.brand-logo { width: 42px; height: 42px; object-fit: contain; }
.brand-text { display: grid; gap: 0; }
.brand-text strong { font-size: 14px; }
.brand-text small { font-size: 12px; color: var(--muted); }

.app {
  width: min(100%, calc(var(--max) + 48px));
  margin: 0 auto;
  padding: 12px 24px 32px;
  flex: 1;
}
.card {
  background: var(--surface);
  border: 1px solid rgba(63,58,49,.09);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.hero { padding: clamp(24px, 6vw, 48px); }
.eyebrow {
  margin-bottom: 10px;
  color: var(--accent);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .06em;
  text-transform: uppercase;
}
h1, h2, p { margin-top: 0; }
h1 {
  margin-bottom: 16px;
  font-size: clamp(30px, 7vw, 48px);
  line-height: 1.05;
  letter-spacing: -.035em;
}
h2 { font-size: 20px; line-height: 1.2; margin-bottom: 14px; }
.lead { font-size: 18px; color: #454944; max-width: 62ch; margin-bottom: 28px; }
.note-box {
  margin-top: 24px;
  padding: 16px 18px;
  border-radius: 16px;
  background: var(--surface-2);
  color: #4e514d;
  font-size: 14px;
}

.mode-grid { display: grid; gap: 12px; }
.mode-card {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: #fff;
  padding: 18px;
  text-align: left;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px 16px;
  align-items: center;
  transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.mode-card:hover { transform: translateY(-1px); border-color: #a9b4ae; box-shadow: 0 8px 18px rgba(42,40,35,.05); }
.mode-card strong { font-size: 17px; }
.mode-card span { color: var(--muted); font-size: 14px; grid-column: 1; }
.mode-card .arrow { grid-column: 2; grid-row: 1 / span 2; font-size: 24px; color: var(--accent); }
.mode-card[disabled] { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }

.wizard-card { overflow: hidden; }
.progress-wrap { padding: 18px 22px 0; }
.progress-track { height: 6px; border-radius: 99px; background: #ebe7df; overflow: hidden; }
.progress-bar { height: 100%; width: 0; border-radius: inherit; background: var(--accent); transition: width .25s ease; }
.progress-meta { display: flex; justify-content: space-between; gap: 12px; padding-top: 8px; color: var(--muted); font-size: 12px; }
.question-wrap { padding: clamp(26px, 7vw, 54px) clamp(22px, 6vw, 48px) 26px; min-height: 430px; }
.question-title { font-size: clamp(27px, 6vw, 40px); max-width: 18ch; }
.question-help { color: var(--muted); max-width: 62ch; margin-bottom: 24px; }
.answer-area { display: grid; gap: 10px; }
.option-card {
  position: relative;
  width: 100%;
  min-height: 58px;
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 15px;
  padding: 14px 16px;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--text);
}
.option-card:hover { border-color: #a6b1ab; }
.option-card.selected { border: 2px solid var(--accent); padding: 13px 15px; background: var(--accent-soft); }
.option-dot {
  width: 20px; height: 20px; border-radius: 50%; border: 2px solid #9c9d98; flex: 0 0 auto;
  display: grid; place-items: center;
}
.option-card.selected .option-dot { border-color: var(--accent); }
.option-card.selected .option-dot::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
.option-text strong { display: block; font-size: 16px; }
.option-text small { display: block; color: var(--muted); margin-top: 2px; }

.text-input, .select-input {
  width: 100%;
  min-height: 54px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #fff;
  padding: 14px 15px;
  color: var(--text);
}
.text-input::placeholder { color: #9a9b96; }
.input-note { color: var(--muted); font-size: 13px; margin-top: 8px; }

.wizard-actions {
  border-top: 1px solid #ece8e0;
  padding: 16px 22px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
}
.primary-btn, .ghost-btn {
  min-height: 48px;
  border-radius: 13px;
  padding: 0 18px;
  font-weight: 750;
}
.primary-btn { border: 1px solid var(--accent); background: var(--accent); color: white; }
.primary-btn:disabled { opacity: .38; cursor: not-allowed; }
.ghost-btn { border: 1px solid var(--line); background: transparent; color: var(--text); }

.result-stack { display: grid; gap: 14px; }
.result-hero { padding: clamp(25px, 6vw, 44px); background: var(--accent); color: white; }
.result-hero .eyebrow { color: #c9d8d0; }
.result-hero h1 { font-size: clamp(30px, 7vw, 46px); margin-bottom: 12px; }
.result-summary { max-width: 62ch; font-size: 18px; color: #edf2ef; }
.confidence { display: inline-flex; margin-top: 8px; border-radius: 999px; padding: 7px 11px; background: rgba(255,255,255,.12); font-size: 13px; font-weight: 700; }
.result-card { padding: 24px; }
.reason-list { display: grid; gap: 10px; }
.reason {
  display: flex; gap: 10px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid #eeeae2;
}
.reason:last-child { border-bottom: 0; }
.reason::before { content: "•"; font-weight: 900; color: var(--accent); }
.action-card { border-color: #cbd9d1; }
.action-text { font-size: 18px; line-height: 1.6; white-space: pre-line; }
.metric-box { margin-top: 18px; background: var(--accent-soft); border-radius: 15px; padding: 15px 16px; display: grid; gap: 4px; }
.metric-box span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; font-weight: 800; }
.metric-box strong { font-size: 16px; white-space: pre-line; }
.tag-list { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { border: 1px solid var(--line); border-radius: 999px; padding: 7px 10px; background: #fff; font-size: 13px; }
.result-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.microcopy { margin: 10px 0 0; color: var(--ok); font-size: 13px; }

.status-card { padding: 18px; border-radius: 16px; margin-top: 12px; }
.status-card.ok { background: var(--ok-soft); color: var(--ok); }
.status-card.warn { background: var(--warning-soft); color: var(--warning); }
.status-card.danger { background: var(--danger-soft); color: var(--danger); }

.footer {
  width: min(100%, calc(var(--max) + 48px));
  margin: 0 auto;
  padding: 0 24px 28px;
  color: var(--muted);
  font-size: 12px;
}
.footer p { margin: 0; }

@media (max-width: 640px) {
  .topbar { padding: 12px 14px 6px; }
  .app { padding: 8px 12px 24px; }
  .footer { padding: 0 14px 22px; }
  .brand-text small { display: none; }
  .top-reset { min-height: 40px; padding: 0 12px; font-size: 13px; }
  .hero { border-radius: 18px; }
  .wizard-card { border-radius: 18px; }
  .question-wrap { min-height: 420px; }
  .wizard-actions { position: sticky; bottom: 0; background: rgba(255,253,249,.96); backdrop-filter: blur(10px); }
  .primary-btn, .ghost-btn { flex: 1; }
  .result-actions .primary-btn, .result-actions .ghost-btn { flex: 1 1 100%; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
}

</style>
</head>

  function q(id, eyebrow, title, help, options) { return { id, type: 'single', eyebrow, title, help, options }; }
  function dynamicQ(id, eyebrow, title, help, optionsFn) { return { id, type: 'single', eyebrow, title, help, optionsFn }; }
  function multiQ(id, eyebrow, title, help, options) { return { id, type: 'multi', eyebrow, title, help, options }; }
  function textQ(id, eyebrow, title, help, placeholder) { return { id, type: 'text', eyebrow, title, help, placeholder }; }
  function numberQ(id, eyebrow, title, help, placeholder, numericKind = 'count') { return { id, type: 'number', eyebrow, title, help, placeholder, numericKind }; }
  function dynamicNumberQ(id, eyebrow, title, help, placeholder, numericKind = 'count') { return { id, type: 'number', eyebrow, title, help, placeholder, numericKind }; }
  function card(title, summary, action, metric, dont, next) { return { title, summary, action, metric, dont, next }; }

  function getHistory() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; }
  }
  function saveHistory(item) {
    try {
      const history = getHistory();
      history.unshift(item);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history.slice(0, 12)));
      return true;
    } catch {
      return false;
    }
  }

  function showHome() {
    state.mode = null;
    state.answers = {};
    state.path = [];
    state.index = 0;
    state.result = null;
    state.followupBase = null;
    state.deepAdded = false;
    resetButton.hidden = true;
    const tpl = document.getElementById('homeTemplate').content.cloneNode(true);
    app.replaceChildren(tpl);
    const grid = document.getElementById('modeGrid');
    const history = getHistory();
    const modes = [
      { id: 'full', title: 'Проверить текущие продажи', text: 'Короткий скан всей системы, затем вопросы только по подозрительным участкам.' },
      { id: 'build', title: 'Проверить новый или сильно изменённый продукт', text: 'Подойдёт и для запуска с нуля, и для нового направления внутри уже работающего бизнеса.' },
      { id: 'followup', title: 'Проверить прошлое изменение', text: history.length ? `Есть сохранённый результат от ${formatDate(history[0].date)}.` : 'Появится после первой сохранённой проверки.', disabled: !history.length },
    ];
    modes.forEach(m => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'mode-card'; b.disabled = !!m.disabled;
      b.innerHTML = `<strong>${m.title}</strong><span>${m.text}</span><span class="arrow">→</span>`;
      b.addEventListener('click', () => startMode(m.id));
      grid.appendChild(b);
    });
  }

  function startMode(mode) {
    state.mode = mode;
    state.answers = {};
    state.index = 0;
    state.result = null;
    state.deepAdded = false;
    resetButton.hidden = false;

    if (mode === 'followup') {
      const history = getHistory();
      state.followupBase = history[0] || null;
      state.path = ['fu_done', 'fu_effect', 'fu_guardrail'];
    } else {
      state.path = mode === 'build'
        ? ['scope_name', 'scope_model', 'scope_route', 'scope_period', 'period_integrity', 'period_context', 'build_base']
        : ['scope_goal', 'scope_name', 'scope_model', 'scope_target', 'scope_route', 'scope_period', 'period_integrity', 'period_context'];
      if (mode === 'build') state.answers.scope_goal = 'launch';
      if (mode === 'full') {
        state.path.push('mode_sales', 'gate_legal', 'gate_fulfillment', 'gate_capacity', 'gate_economics', 'shared_resources',
          'core_demand','core_offer','core_fit','core_access','core_trust','core_conversion','core_start','core_value','core_repeat','core_data');
      }
    }
    renderQuestion();
  }

  function renderQuestion() {
    const id = state.path[state.index];
    const question = questions[id];
    if (!question) return finalizeDiagnosis();

    const tpl = document.getElementById('questionTemplate').content.cloneNode(true);
    app.replaceChildren(tpl);
    document.getElementById('progressBar').style.width = `${Math.round(((state.index + 1) / state.path.length) * 100)}%`;
    document.getElementById('progressLabel').textContent = `${state.index + 1} из ${state.path.length}`;
    document.getElementById('sectionLabel').textContent = sectionName(id);
    document.getElementById('questionEyebrow').textContent = resolve(question.eyebrow);
    document.getElementById('questionTitle').textContent = resolve(question.title);
    const help = resolve(question.help);
    const helpEl = document.getElementById('questionHelp');
    helpEl.textContent = help || '';
    helpEl.hidden = !help;

    const answerArea = document.getElementById('answerArea');
    const nextButton = document.getElementById('nextButton');
    const backButton = document.getElementById('backButton');
    backButton.disabled = state.index === 0;
    backButton.addEventListener('click', () => { state.index--; renderQuestion(); });
    nextButton.addEventListener('click', goNext);

    const current = state.answers[id];
    if (question.type === 'text' || question.type === 'number') {
      const input = document.createElement('input');
      input.className = 'text-input';
      input.type = question.type === 'number' ? 'text' : 'text';
      input.inputMode = question.type === 'number' ? 'decimal' : 'text';
      input.placeholder = question.placeholder || '';
      input.value = current ?? '';
      input.autocomplete = 'off';
      const updateInput = () => {
        const raw = input.value.trim();
        if (question.type === 'number') {
          const normalized = raw.replace(',', '.').replace(/\s+/g, '');
          const num = normalized === '' ? null : Number(normalized);
          const valid = num !== null && Number.isFinite(num) && num >= 0 && (question.numericKind !== 'count' || Number.isInteger(num));
          if (valid) state.answers[id] = num;
          else delete state.answers[id];
          nextButton.disabled = !valid;
        } else {
          state.answers[id] = raw;
          nextButton.disabled = !raw;
        }
      };
      input.addEventListener('input', updateInput);
      input.addEventListener('keydown', e => { if (e.key === 'Enter' && isAnswered(id)) goNext(); });
      answerArea.appendChild(input);
      nextButton.disabled = !isAnswered(id);
      setTimeout(() => input.focus(), 0);
    } else {
      const options = question.optionsFn ? question.optionsFn(state) : question.options;
      options.forEach(o => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'option-card';
        const selected = question.type === 'multi' ? Array.isArray(current) && current.includes(o.value) : current === o.value;
        if (selected) b.classList.add('selected');
        b.innerHTML = `<span class="option-dot" aria-hidden="true"></span><span class="option-text"><strong>${o.label}</strong>${o.hint ? `<small>${o.hint}</small>` : ''}</span>`;
        b.addEventListener('click', () => {
          if (question.type === 'multi') {
            const arr = Array.isArray(state.answers[id]) ? [...state.answers[id]] : [];
            if (['none','unknown','normal'].includes(o.value)) state.answers[id] = [o.value];
            else {
              const cleaned = arr.filter(v => !['none','unknown','normal'].includes(v));
              const ix = cleaned.indexOf(o.value);
              if (ix >= 0) cleaned.splice(ix, 1); else cleaned.push(o.value);
              state.answers[id] = cleaned;
            }
          } else state.answers[id] = o.value;
          renderQuestion();
        });
        answerArea.appendChild(b);
      });
      nextButton.disabled = question.type === 'multi' ? !(Array.isArray(current) && current.length) : current == null;
    }

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function hybridBuildQuestions(changed) {
    const xs = Array.isArray(changed) ? changed : [];
    const all = ['build_demand','build_offer','build_route','build_access','build_market','build_fulfillment','build_value','build_economics','build_capacity'];
    if (!xs.length || xs.includes('unknown')) return all;
    const out = [];
    const add = (...ids) => ids.forEach(id => { if (!out.includes(id)) out.push(id); });
    if (xs.includes('offer')) add('build_demand','build_offer','build_market','build_fulfillment','build_value');
    if (xs.includes('price')) add('build_offer','build_market','build_economics');
    if (xs.includes('audience')) add('build_demand','build_access','build_market');
    if (xs.includes('channel')) add('build_access','build_market');
    if (xs.includes('route')) add('build_route','build_market');
    if (xs.includes('fulfillment')) add('build_fulfillment','build_value');
    if (xs.includes('capacity')) add('build_economics','build_capacity');
    const order = all;
    return order.filter(id => out.includes(id));
  }

  function precisionQuestionsFor(code) {
    const map = {
      ACCESS:['p_inquiries','p_fit','p_orders'],
      FIT:['p_inquiries','p_fit','p_orders'],
      OFFER:['p_inquiries','p_fit','p_orders'],
      DECISION_GAP:['p_inquiries','p_fit','p_orders'],
      PURCHASE_FRICTION:['p_inquiries','p_fit','p_orders'],
      START_FAILURE:['p_confirmed','p_started'],
      ACTIVATION_FAILURE:['p_confirmed','p_started'],
      FIRST_VALUE_GAP:['p_confirmed','p_started'],
      FULFILLMENT:['p_completed','p_problems'],
      VALUE_FAILURE:['p_value_total','p_value_problems'],
      NEXT_CYCLE:['p_repeat_eligible','p_repeat_returned'],
      CUSTOMER_MEMORY_GAP:['p_repeat_eligible','p_repeat_returned'],
      ECONOMICS:['p_revenue','p_direct_costs','p_hours'],
      CAPACITY:['p_capacity_period','p_current_volume','p_sustainable_volume'],
      DEMAND_WEAK:['p_market_people','p_market_actions'],
      DEMAND_UNCLEAR:['p_market_people','p_market_actions'],
      BUILD_DEMAND:['p_market_people','p_market_actions'],
      BUILD_ACCESS:['p_market_people','p_market_actions'],
      BUILD_MARKET_TEST:['p_market_people','p_market_actions'],
      BUILD_ECONOMICS:['p_revenue','p_direct_costs','p_hours'],
      BUILD_CAPACITY:['p_capacity_period','p_current_volume','p_sustainable_volume']
    };
    return map[code] || [];
  }

  function startPrecision(result) {
    const path = precisionQuestionsFor(result.code);
    if (!path.length) return;
    state.precisionBase = result;
    state.precisionOriginMode = state.mode;
    state.mode = 'precision';
    state.path = path;
    state.index = 0;
    renderQuestion();
  }

  function goNext() {
    const currentId = state.path[state.index];
    if (!isAnswered(currentId)) return;

    // A current business with no repeatable sales moves to BUILD or HYBRID,
    // but we first ask what can be inherited from what already works.
    if (state.mode === 'full' && currentId === 'mode_sales' && state.answers.mode_sales !== 'repeatable') {
      state.mode = state.answers.mode_sales === 'changed' ? 'hybrid' : 'build';
      state.deepAdded = false;
      if (state.answers.mode_sales === 'changed') state.answers.build_base = 'existing';
      const next = state.answers.mode_sales === 'changed' ? ['hybrid_changed'] : ['build_base'];
      state.path = state.path.slice(0, state.index + 1).concat(next);
    }

    if ((state.mode === 'build' || state.mode === 'hybrid') && currentId === 'build_base') {
      if (state.answers.build_base === 'existing') {
        state.mode = 'hybrid';
        state.path = state.path.slice(0, state.index + 1).concat(['hybrid_changed']);
      } else {
        state.mode = 'build';
        state.path = state.path.slice(0, state.index + 1).concat([
          'gate_legal','shared_resources','build_demand','build_offer','build_route','build_access','build_market','build_fulfillment','build_value','build_economics','build_capacity'
        ]);
      }
    }

    if (state.mode === 'hybrid' && currentId === 'hybrid_changed') {
      const checks = hybridBuildQuestions(state.answers.hybrid_changed);
      state.path = state.path.slice(0, state.index + 1).concat(['gate_legal','shared_resources', ...checks]);
    }

    // Ask about impact on the rest of the business only when resources are actually shared.
    if (currentId === 'shared_resources') {
      const shared = meaningful(state.answers.shared_resources);
      if (shared.length && !state.path.includes('shared_impact')) {
        state.path.splice(state.index + 1, 0, 'shared_impact');
      }
    }

    // Stop early in BUILD/HYBRID: the first failed meaningful gate is the current job.
    if (state.mode === 'build' || state.mode === 'hybrid') {
      const early = buildEarlyResult(currentId);
      if (early) { state.result = makeResult(early); renderResult(state.result); return; }
    }

    // Shared resources can block growth even when the selected product itself looks healthy.
    if (currentId === 'shared_impact' && ['other_suffer','current_suffer','overload','cash'].includes(state.answers.shared_impact)) {
      state.result = makeResult(state.answers.shared_impact === 'cash' ? 'ECONOMICS' : 'CAPACITY');
      renderResult(state.result);
      return;
    }

    // In a mature route, a hard blocker gets a short targeted clarification.
    if (state.mode === 'full' && currentId === 'gate_economics') {
      const blocker = hardGateResult();
      if (blocker === 'LEGAL_SAFETY_BLOCKER') { state.result = makeResult(blocker); renderResult(state.result); return; }
      const blockerQuestions = {
        FULFILLMENT: ['deep_f1','deep_f2'],
        ECONOMICS: ['deep_e1','deep_e3'],
        CAPACITY: ['deep_cap1','deep_cap2'],
      }[blocker] || [];
      if (blockerQuestions.length) {
        state.deepAdded = true;
        state.path = state.path.slice(0, state.index + 1).concat(blockerQuestions);
      }
    }

    if (state.mode === 'full' && currentId === 'core_data') {
      const gap = decisionCriticalUnknown();
      if (gap) { state.result = makeResult('DATA_GAP', [gap]); renderResult(state.result); return; }
    }

    if (currentId === 'deep_v2' && state.answers.deep_v2 === 'yes' && !state.path.includes('deep_v3')) {
      state.path.splice(state.index + 1, 0, 'deep_v3');
    }

    if (currentId === 'deep_f2' && state.answers.deep_f2 === 'yes' && meaningful(state.answers.deep_f1).includes('overload') && !state.path.includes('deep_cap1')) {
      state.path.splice(state.index + 1, 0, 'deep_cap1', 'deep_cap2');
    }

    if (state.index < state.path.length - 1) {
      state.index++;
      renderQuestion();
    } else {
      if (state.mode === 'full' && !state.deepAdded) {
        const deeper = chooseDeepBranches();
        if (deeper.length) {
          state.deepAdded = true;
          state.path.push(...deeper);
          state.index++;
          renderQuestion();
          return;
        }
      }
      finalizeDiagnosis();
    }
  }

  function hardGateResult() {
    const a = state.answers;
    if (a.gate_legal === 'yes') return 'LEGAL_SAFETY_BLOCKER';
    if (a.gate_fulfillment === 'regular') return 'FULFILLMENT';
    if (a.gate_economics === 'negative') return 'ECONOMICS';
    if (a.gate_capacity === 'overload') return 'CAPACITY';
    return '';
  }

  function buildEarlyResult(currentId) {
    const a = state.answers;
    if (currentId === 'gate_legal' && a.gate_legal === 'yes') return 'LEGAL_SAFETY_BLOCKER';
    const fail = {
      build_demand: () => !['yes'].includes(a.build_demand),
      build_offer: () => !['yes','mostly'].includes(a.build_offer),
      build_route: () => !['yes','mostly'].includes(a.build_route),
      build_access: () => !['yes','mostly'].includes(a.build_access),
      build_market: () => !['paid','action'].includes(a.build_market),
      build_fulfillment: () => a.build_fulfillment !== 'yes',
      build_value: () => a.build_value !== 'yes',
      build_economics: () => !['yes','maybe'].includes(a.build_economics),
      build_capacity: () => !['yes','small'].includes(a.build_capacity),
    };
    const codes = {
      build_demand:'BUILD_DEMAND', build_offer:'BUILD_OFFER', build_route:'BUILD_ROUTE', build_access:'BUILD_ACCESS',
      build_market:'BUILD_MARKET_TEST', build_fulfillment:'BUILD_FULFILLMENT', build_value:'BUILD_VALUE', build_economics:'BUILD_ECONOMICS', build_capacity:'BUILD_CAPACITY'
    };
    return fail[currentId] && fail[currentId]() ? codes[currentId] : '';
  }

  function chooseDeepBranches() {
    const candidates = collectCandidates();
    const selected = candidates.slice(0, 2).map(c => c.zone);
    const deepMap = {
      D: ['deep_d1','deep_d2','deep_d3'],
      O: ['deep_o1','deep_o2'],
      FIT: ['deep_fit1','deep_fit2'],
      A: ['deep_a1','deep_a2','deep_a3','deep_a4'],
      T: ['deep_t1','deep_t2'],
      C: ['deep_c1','deep_c2'],
      S: ['deep_s1','deep_s2','deep_s3'],
      F: ['deep_f1','deep_f2'],
      V: ['deep_v1','deep_v2'],
      R: ['deep_r1','deep_r2','deep_r3'],
      E: ['deep_e1','deep_e2','deep_e3'],
      CAP: ['deep_cap1','deep_cap2'],
    };
    return selected.flatMap(z => deepMap[z] || []);
  }

  function collectCandidates() {
    const a = state.answers;
    const list = [];
    // UNKNOWN is not a weak problem signal. It is handled separately as a decision-critical data gap.
    // Treating UNKNOWN as a candidate produced false diagnoses in retrospective real cases.
    const fulfillmentContradicted = meaningful(a.deep_f1).includes('none') && a.deep_f2 === 'no';
    const fulfillmentSev = fulfillmentContradicted ? 0 : severity(a.gate_fulfillment, { regular:4 });
    pushCandidate(list, 'F', fulfillmentSev, 95);

    const valueContradicted = a.deep_v2 === 'no' && meaningful(a.deep_v1).some(v => ['repeat','feedback','observable','usage','progress'].includes(v)) && !meaningful(a.deep_v1).includes('complaints');
    pushCandidate(list, 'V', valueContradicted ? 0 : severity(a.core_value, { no:4, issues:3 }), 90);

    const economicsContradicted = a.deep_e1 === 'no' && ['yes','likely'].includes(a.deep_e2) && ['none'].includes(a.deep_e3);
    pushCandidate(list, 'E', economicsContradicted ? 0 : severity(a.gate_economics, { negative:4, low:3 }), 88);
    pushCandidate(list, 'CAP', severity(a.gate_capacity, { overload:4, limit:3 }), 86);

    const startContradicted = a.scope_model === 'EDUCATION'
      ? (a.deep_s1 === 'most' && a.deep_s2 === 'most')
      : (a.deep_s1 === 'no');
    pushCandidate(list, 'S', startContradicted ? 0 : severity(a.core_start, { problem:4, losses:3 }), 82);

    const conversionContradicted = Array.isArray(a.deep_c1) && meaningful(a.deep_c1).length === 0 && a.deep_c2 === 'no';
    pushCandidate(list, 'C', conversionContradicted ? 0 : severity(a.core_conversion, { breaks:4, hard:3 }), 78);

    const trustContradicted = Array.isArray(a.deep_t1) && meaningful(a.deep_t1).length === 0 && a.deep_t2 === 'yes';
    pushCandidate(list, 'T', trustContradicted ? 0 : severity(a.core_trust, { almost_always:4, often:3 }), 74);
    pushCandidate(list, 'FIT', severity(a.core_fit, { bad:4, half:3 }), 72);

    const offerContradicted = Array.isArray(a.deep_o1) && meaningful(a.deep_o1).length === 0 && a.deep_o2 === 'easy';
    pushCandidate(list, 'O', offerContradicted ? 0 : severity(a.core_offer, { no:4, mostly_no:3 }), 70);
    pushCandidate(list, 'A', severity(a.core_access, { none:4, unstable:3 }), 68);
    pushCandidate(list, 'D', severity(a.core_demand, { rare:4 }), 66);
    pushCandidate(list, 'R', severity(a.core_repeat, { rare:3 }), 45);

    const goalBoost = { new_sales:['A','D','O','FIT','T','C'], stable:['A','R','CAP'], income:['E','CAP','O'], overload:['CAP','F','E'], repeat:['R','V'], unknown:[] };
    const targetBoost = {
      attended_visits:['C','S','CAP'], fill_slots:['C','A','CAP'], new_customers:['A','D','O','FIT'],
      completed_orders:['C','F','CAP','A'], paid_clients:['C','FIT','T','A'], paid_students:['C','A','O'],
      revenue:['E','C','A','CAP'], owner_money:['E','CAP'], per_sale:['E','O'], same_money_less_time:['E','CAP','F'],
      steady_orders:['A','R','CAP'], steady_income:['E','R','A'], less_channel_dependency:['A'],
      less_hours:['CAP','E','F'], fewer_urgent:['F','CAP'], stable_quality:['F','CAP'],
      repeat_orders:['R','V'], repeat_visits:['R','V'], repeat_income:['R','E','V'],
      more_orders:['A','D','C'], more_money:['E','CAP'], less_load:['CAP','F','E'], more_repeat:['R','V'], stable:['A','R','CAP']
    };
    const boost = [...new Set([...(goalBoost[a.scope_goal] || []), ...(targetBoost[a.scope_target] || [])])];
    list.forEach(x => { if (boost.includes(x.zone)) x.rank += 7; });
    return list.filter(x => x.sev > 0).sort((x,y) => (y.sev*100 + y.rank) - (x.sev*100 + x.rank));
  }

  function pushCandidate(list, zone, sev, rank) { if (sev > 0) list.push({ zone, sev, rank }); }
  function severity(value, map) { return map[value] || 0; }

  function finalizeDiagnosis() {
    if (state.mode === 'followup') return finalizeFollowup();
    if (state.mode === 'precision') return finalizePrecision();
    const diagnosis = (state.mode === 'build' || state.mode === 'hybrid') ? diagnoseBuild() : diagnoseFull();
    state.result = diagnosis;
    renderResult(diagnosis);
  }

function fmtNumber(value, maxFraction = 1) {
  if (!Number.isFinite(value)) return '';
  return new Intl.NumberFormat('ru-RU', { maximumFractionDigits:maxFraction }).format(value);
}

function percentPart(num, den) {
  if (!Number.isFinite(num) || !Number.isFinite(den) || den <= 0) return '';
  return fmtNumber((num / den) * 100, 1) + '%';
}

function precisionContradiction(message) {
  const base = state.precisionBase || {};
  return {
    ...base,
    code:'DATA_GAP',
    kind:'Нужно перепроверить вывод',
    title:'Цифры не совпали с предыдущими ответами',
    summary:message,
    precisionRefined:true,
    precisionSummary:message,
    precisionCaveat:'Это не означает, что проблемы точно нет. Сначала убедитесь, что качественные ответы и цифры относятся к одному и тому же товару, периоду и пути покупки.',
    action:numbered(
      'Проверьте, что цифры относятся к тому же периоду и именно к тому товару или услуге, которые вы оценивали.',
      'Если период один и тот же — опирайтесь на фактические случаи и обновите исходный ответ.',
      'После этого снова пройдите нужную часть проверки, не меняя бизнес на основании противоречивых данных.'
    ),
    metric:'Один и тот же период, один и тот же товар/услуга и согласующиеся между собой факты.',
    dont:'Не исправляйте процесс только потому, что первоначальный ответ звучал тревожно, если реальные случаи этого не подтверждают.',
    decisionRule:'Когда качественный ответ и фактические случаи совпадут, используйте обновлённый вывод.',
    why:[message],
    proven:'Сейчас можно уверенно сказать только то, что качественный ответ и введённые вами фактические случаи расходятся.',
    boundary:'Пока это противоречие не снято, прежний вывод нельзя считать надёжным основанием для изменения бизнеса.',
    secondary:base.secondary || [],
    date:new Date().toISOString()
  };
}

function finalizePrecision() {
  const a = state.answers;
  const base = state.precisionBase;
  if (!base) { state.mode = state.precisionOriginMode || 'full'; return showHome(); }

  const invalidPairs = [
    ['p_fit','p_inquiries','Число людей, которым вы могли продать, не может быть больше общего числа обращений.'],
    ['p_orders','p_fit','Число заказов в этом уточнении не может быть больше числа потенциальных покупателей, из которых вы его считаете.'],
    ['p_started','p_confirmed','Число реально начавших или пришедших не может быть больше числа подтверждённых.'],
    ['p_problems','p_completed','Число проблемных выполнений не может быть больше общего числа выполненных заказов или услуг.'],
    ['p_value_problems','p_value_total','Число проблем с результатом не может быть больше числа случаев, по которым у вас вообще есть информация.'],
    ['p_repeat_returned','p_repeat_eligible','Число вернувшихся клиентов не может быть больше числа клиентов, у которых был реальный повод вернуться.'],
    ['p_market_actions','p_market_people','Число реальных шагов к покупке не может быть больше числа людей, которым сделали предложение.']
  ];
  for (const [numId, denId, msg] of invalidPairs) {
    if (Number.isFinite(a[numId]) && Number.isFinite(a[denId]) && a[numId] > a[denId]) {
      state.mode = state.precisionOriginMode || 'full';
      state.result = precisionContradiction(msg);
      renderResult(state.result);
      return;
    }
  }

  let result = { ...base, precisionRefined:true, date:new Date().toISOString() };
  const code = base.code;
  let summary = '';
  const caveat = 'Цифры описывают именно выбранный период. Они помогают уточнить картину, но сами по себе не задают универсальную норму «хорошо/плохо».';

  if (Number.isFinite(a.p_inquiries)) {
    summary = `За выбранный период было ${fmtNumber(a.p_inquiries,0)} обращений.`;
    if (Number.isFinite(a.p_fit)) summary += ` Из них ${fmtNumber(a.p_fit,0)} были от людей, которым вы реально могли продать${a.p_inquiries > 0 ? ` (${percentPart(a.p_fit,a.p_inquiries)})` : ''}.`;
    if (Number.isFinite(a.p_orders)) summary += ` До заказа или подтверждённой записи дошло ${fmtNumber(a.p_orders,0)}${a.p_fit > 0 ? ` (${percentPart(a.p_orders,a.p_fit)} от потенциальных покупателей)` : ''}.`;

    if (code === 'FIT' && a.p_inquiries > 0 && a.p_fit === a.p_inquiries) {
      result = precisionContradiction(`Вы указали ${fmtNumber(a.p_inquiries,0)} обращений, и все ${fmtNumber(a.p_fit,0)} оказались от людей, которым вы реально могли продать. Эти цифры не подтверждают вывод, что основная проблема — неподходящие обращения.`);
    } else if (code === 'PURCHASE_FRICTION' && a.p_fit > 0 && a.p_orders === a.p_fit) {
      result = precisionContradiction(`По вашим цифрам все ${fmtNumber(a.p_fit,0)} потенциальных покупателей дошли до заказа или подтверждённой записи. В этом периоде потеря на оформлении не подтверждается.`);
    } else {
      result.precisionSummary = summary;
      result.precisionCaveat = caveat;
      result.metric = `${result.metric} Сейчас у вас есть исходная точка: ${fmtNumber(a.p_inquiries,0)} обращений → ${fmtNumber(a.p_fit,0)} потенциальных покупателей → ${fmtNumber(a.p_orders,0)} заказов/записей.`;
    }
  }

  if (Number.isFinite(a.p_confirmed) && Number.isFinite(a.p_started)) {
    const noun = a.scope_model === 'APPOINTMENT' ? 'визитов' : a.scope_model === 'PRODUCT' ? 'заказов, дошедших до клиента вовремя' : a.scope_model === 'EXPERT' ? 'работ, начавшихся вовремя' : code === 'FIRST_VALUE_GAP' ? 'людей, дошедших до первого результата' : 'людей, реально начавших';
    summary = `${fmtNumber(a.p_started,0)} из ${fmtNumber(a.p_confirmed,0)} — ${noun}${a.p_confirmed > 0 ? ` (${percentPart(a.p_started,a.p_confirmed)})` : ''}.`;
    if (a.p_confirmed > 0 && a.p_started === a.p_confirmed && ['START_FAILURE','ACTIVATION_FAILURE','FIRST_VALUE_GAP'].includes(code)) {
      result = precisionContradiction(`По вашим цифрам все ${fmtNumber(a.p_confirmed,0)} случаев дошли до нужного следующего шага. В этом периоде заявленная потеря после покупки или записи не подтверждается.`);
    } else {
      result.precisionSummary = summary;
      result.precisionCaveat = caveat;
      result.metric = `${result.metric} Исходная точка: ${fmtNumber(a.p_started,0)} из ${fmtNumber(a.p_confirmed,0)} (${percentPart(a.p_started,a.p_confirmed)}).`;
    }
  }

  if (Number.isFinite(a.p_completed) && Number.isFinite(a.p_problems)) {
    summary = `Из ${fmtNumber(a.p_completed,0)} выполненных заказов или услуг в ${fmtNumber(a.p_problems,0)} были серьёзная задержка, переделка, ошибка или другой отмеченный сбой${a.p_completed > 0 ? ` (${percentPart(a.p_problems,a.p_completed)})` : ''}.`;
    if (a.p_completed > 0 && a.p_problems === 0 && code === 'FULFILLMENT') {
      result = precisionContradiction(`Вы указали ${fmtNumber(a.p_completed,0)} выполненных заказов или услуг и ни одного серьёзного сбоя. Эти случаи не подтверждают вывод о регулярно повторяющейся проблеме выполнения.`);
    } else {
      result.precisionSummary=summary; result.precisionCaveat=caveat;
      result.metric = `${result.metric} Исходная точка: ${fmtNumber(a.p_problems,0)} проблемных случаев из ${fmtNumber(a.p_completed,0)}.`;
    }
  }

  if (Number.isFinite(a.p_value_total) && Number.isFinite(a.p_value_problems)) {
    summary = `По ${fmtNumber(a.p_value_total,0)} продажам у вас есть информация о результате клиента; в ${fmtNumber(a.p_value_problems,0)} из них результат не совпал с обещанным или повторилась проблема${a.p_value_total > 0 ? ` (${percentPart(a.p_value_problems,a.p_value_total)})` : ''}.`;
    if (a.p_value_total > 0 && a.p_value_problems === 0 && code === 'VALUE_FAILURE') {
      result = precisionContradiction(`По вашим данным есть ${fmtNumber(a.p_value_total,0)} случаев с известным результатом клиента и ни одного подтверждённого проблемного результата. Первоначальный вывод о повторяющейся проблеме сейчас не подтверждается этими случаями.`);
    } else {
      result.precisionSummary=summary; result.precisionCaveat=caveat;
      result.metric = `${result.metric} Исходная точка: ${fmtNumber(a.p_value_problems,0)} проблемных результатов из ${fmtNumber(a.p_value_total,0)} известных.`;
    }
  }

  if (Number.isFinite(a.p_repeat_eligible) && Number.isFinite(a.p_repeat_returned)) {
    summary = `Реальный повод купить снова был у ${fmtNumber(a.p_repeat_eligible,0)} клиентов; вернулось ${fmtNumber(a.p_repeat_returned,0)}${a.p_repeat_eligible > 0 ? ` (${percentPart(a.p_repeat_returned,a.p_repeat_eligible)})` : ''}.`;
    result.precisionSummary=summary;
    result.precisionCaveat='Сравнивать нужно только с клиентами, у которых действительно возникла повторная потребность, а не со всей старой клиентской базой.';
    result.metric = `${result.metric} Исходная точка: ${fmtNumber(a.p_repeat_returned,0)} из ${fmtNumber(a.p_repeat_eligible,0)} клиентов с реальным поводом вернуться.`;
  }

  if (Number.isFinite(a.p_revenue) && Number.isFinite(a.p_direct_costs) && Number.isFinite(a.p_hours)) {
    const contribution = a.p_revenue - a.p_direct_costs;
    const hourly = a.p_hours > 0 ? contribution / a.p_hours : null;
    summary = `Типичная продажа: ${fmtNumber(a.p_revenue,2)} от клиента − ${fmtNumber(a.p_direct_costs,2)} прямых расходов = ${fmtNumber(contribution,2)} до учёта постоянных расходов и налогов.`;
    if (hourly !== null) summary += ` При ${fmtNumber(a.p_hours,2)} ч вашего времени это примерно ${fmtNumber(hourly,2)} на час до постоянных расходов и налогов.`;
    result.precisionSummary=summary;
    result.precisionCaveat='Это не «правильная ставка». Сравните получившуюся сумму со своим приемлемым заработком, постоянными расходами и тем, чем ещё можно занять это время.';
    if (contribution < 0) {
      result.title = 'По вашим цифрам типичная продажа не покрывает даже прямые расходы';
      result.summary = 'До учёта вашего времени и постоянных расходов такая продажа уже уходит в минус.';
      result.action = numbered('Не увеличивайте количество таких продаж.', 'Проверьте цену и крупнейшие прямые расходы.', 'Только после исправления пересчитайте продажу и решайте, стоит ли её масштабировать.');
      result.dont = 'Не пытайтесь компенсировать отрицательный результат большим количеством таких же продаж.';
    }
    result.metric = `На текущих цифрах после прямых расходов остаётся ${fmtNumber(contribution,2)}${hourly !== null ? `; примерно ${fmtNumber(hourly,2)} на час вашего времени до постоянных расходов и налогов` : ''}.`;
  }

  if (Number.isFinite(a.p_current_volume) && Number.isFinite(a.p_sustainable_volume)) {
    const reserve = a.p_sustainable_volume - a.p_current_volume;
    const period = ({week:'неделю',month:'месяц',cycle:'рабочий цикл'})[a.p_capacity_period] || 'тот же период';
    summary = `Сейчас вы обычно обслуживаете ${fmtNumber(a.p_current_volume,0)} за ${period}; устойчиво, по вашей оценке, можете ${fmtNumber(a.p_sustainable_volume,0)}. Разница: ${reserve > 0 ? '+' : ''}${fmtNumber(reserve,0)}.`;
    result.precisionSummary=summary;
    result.precisionCaveat='Это ваша рабочая оценка устойчивой загрузки, а не разовый рекорд. Если объём меняется по сезонам, сравнивайте похожие периоды.';
    if (reserve <= 0) {
      result.title = 'По вашим цифрам свободного рабочего запаса сейчас нет';
      result.summary = 'Текущая загрузка уже равна или выше объёма, который вы считаете устойчивым.';
      result.dont = 'Не увеличивайте поток заказов, пока не освободите или не увеличите ресурс.';
    }
    result.metric = `Текущая загрузка: ${fmtNumber(a.p_current_volume,0)}; устойчивый объём: ${fmtNumber(a.p_sustainable_volume,0)} за ${period}.`;
  }

  if (Number.isFinite(a.p_market_people) && Number.isFinite(a.p_market_actions)) {
    summary = `Конкретное предложение получили ${fmtNumber(a.p_market_people,0)} людей; реальный шаг к покупке сделали ${fmtNumber(a.p_market_actions,0)}${a.p_market_people > 0 ? ` (${percentPart(a.p_market_actions,a.p_market_people)})` : ''}.`;
    result.precisionSummary=summary;
    result.precisionCaveat='Это не универсальная конверсия рынка: важны качество выбранных людей, условия предложения и способ показа.';
    if (code === 'BUILD_DEMAND' && a.p_market_actions > 0) {
      result.title = 'Реальный шаг к покупке уже был — не проверяйте спрос с нуля';
      result.summary = `По вашим цифрам как минимум ${fmtNumber(a.p_market_actions,0)} человек сделал реальный шаг к покупке. Это уже сильнее, чем просто интерес или похвала.`;
      result.action = numbered('Не повторяйте тот же тест только ради ещё одного подтверждения интереса.', 'Проверьте следующий неподтверждённый участок: понятность предложения, путь заказа, выполнение или экономику — в зависимости от того, что ещё не проверялось.', 'Сохраняйте те же условия, чтобы не спутать эффект с изменением цены или продукта.');
      result.decisionRule = 'Если реальные шаги к покупке повторяются на обычных условиях, переходите дальше по запуску. Если это был единичный особый случай, не считайте спрос полностью подтверждённым.';
    }
    result.metric = `Исходная точка: ${fmtNumber(a.p_market_actions,0)} реальных шагов к покупке из ${fmtNumber(a.p_market_people,0)} конкретных предложений.`;
  }

  if (!result.precisionSummary) {
    result.precisionSummary = 'Цифры сохранены, но для этого вывода они не добавили отдельного расчёта.';
    result.precisionCaveat = caveat;
  }

  state.mode = state.precisionOriginMode || 'full';
  state.result = result;
  renderResult(result);
}

  function diagnoseBuild() {
    const a = state.answers;
    if (a.gate_legal === 'yes') return makeResult('LEGAL_SAFETY_BLOCKER');
    if (['other_suffer','current_suffer','overload'].includes(a.shared_impact)) return makeResult('CAPACITY');
    if (a.shared_impact === 'cash') return makeResult('ECONOMICS');
    const buildChecks = [
      ['build_demand', v => v === 'yes', 'BUILD_DEMAND'],
      ['build_offer', v => ['yes','mostly'].includes(v), 'BUILD_OFFER'],
      ['build_route', v => ['yes','mostly'].includes(v), 'BUILD_ROUTE'],
      ['build_access', v => ['yes','mostly'].includes(v), 'BUILD_ACCESS'],
      ['build_market', v => ['paid','action'].includes(v), 'BUILD_MARKET_TEST'],
      ['build_fulfillment', v => v === 'yes', 'BUILD_FULFILLMENT'],
      ['build_value', v => v === 'yes', 'BUILD_VALUE'],
      ['build_economics', v => ['yes','maybe'].includes(v), 'BUILD_ECONOMICS'],
      ['build_capacity', v => ['yes','small'].includes(v), 'BUILD_CAPACITY'],
    ];
    for (const [id, pass, code] of buildChecks) {
      if (!state.path.includes(id)) continue;
      if (!pass(a[id])) return makeResult(code);
    }
    return makeResult('NO_CRITICAL_CONSTRAINT_FOUND', [
      state.mode === 'hybrid'
        ? 'Перепроверены только изменившиеся части. Остальные элементы работающего процесса не пришлось строить заново.'
        : 'Новый товар или услуга прошли основные проверки. Теперь оценивайте их уже по реальным повторяющимся продажам.'
    ]);
  }

  function evidenceConflict() {
    const a = state.answers;
    if (['no','mostly_no'].includes(a.core_offer) && Array.isArray(a.deep_o1) && meaningful(a.deep_o1).length === 0 && a.deep_o2 === 'easy') {
      return 'Ответы о предложении противоречат друг другу: сначала вы указали, что новому человеку трудно понять условия, а уточнение показывает, что базовая информация и выбор вроде бы понятны.';
    }
    if (['often','almost_always'].includes(a.core_trust) && Array.isArray(a.deep_t1) && meaningful(a.deep_t1).length === 0 && a.deep_t2 === 'yes') {
      return 'Ответы о сомнениях перед покупкой противоречат друг другу: повторяющиеся вопросы заявлены как частые, но конкретной темы и дефицита доказательств не обнаружено.';
    }
    if (['hard','breaks'].includes(a.core_conversion) && Array.isArray(a.deep_c1) && a.deep_c1.includes('unknown') && a.deep_c2 === 'no') {
      return 'Вы указали, что оформление часто срывается, но конкретный шаг срыва пока не известен. Без этого нельзя безопасно назначить изменение.';
    }
    if (a.scope_model === 'EDUCATION') {
      if (['losses','problem'].includes(a.core_start) && a.deep_s1 === 'most' && a.deep_s2 === 'most') return 'Ответы о старте обучения расходятся: общий скан показывает заметные потери после покупки, а уточнение — что большинство и начинает, и доходит до первого полезного действия.';
    } else if (['losses','problem'].includes(a.core_start) && a.deep_s1 === 'no') {
      return 'Ответы о начале получения расходятся: общий скан показывает заметные потери после покупки/записи, а уточнение — что таких проблем почти нет.';
    }
    if (a.gate_fulfillment === 'regular' && Array.isArray(a.deep_f1) && a.deep_f1.includes('none') && a.deep_f2 === 'no') {
      return 'Ответы о выполнении противоречат друг другу: сначала указаны регулярные сбои, но при уточнении не найдено ни одной повторяющейся причины и рост заказов их не усиливает.';
    }
    const positiveValueEvidence = Array.isArray(a.deep_v1) && meaningful(a.deep_v1).some(v => ['repeat','feedback','observable','usage','progress'].includes(v)) && !meaningful(a.deep_v1).includes('complaints');
    if (['issues','no'].includes(a.core_value) && a.deep_v2 === 'no' && positiveValueEvidence) {
      return 'Ответы о результате клиента расходятся: общий скан показывает заметные проблемы, а уточнение не находит повторяющейся причины и содержит положительные сигналы результата.';
    }
    if (['negative','low'].includes(a.gate_economics) && a.deep_e1 === 'no' && ['yes','likely'].includes(a.deep_e2) && a.deep_e3 === 'none') {
      return 'Ответы об экономике противоречат друг другу: сначала указано, что денег остаётся мало/есть убыток, а уточнение говорит, что слабых позиций нет, рост продаж увеличит заработок и основные расходы учитываются.';
    }
    return '';
  }

  function diagnoseFull() {
    const a = state.answers;
    if (a.gate_legal === 'yes') return makeResult('LEGAL_SAFETY_BLOCKER');
    const conflict = evidenceConflict();
    if (conflict) return makeResult('DATA_GAP', [conflict]);
    if (a.gate_fulfillment === 'regular') {
      if (meaningful(a.deep_f1).includes('overload') && a.deep_f2 === 'yes') return makeResult('CAPACITY');
      return makeResult('FULFILLMENT');
    }
    if (a.gate_economics === 'negative') return makeResult('ECONOMICS');
    if (a.gate_capacity === 'overload') return makeResult('CAPACITY');

    const candidates = collectCandidates();
    const decisionGap = decisionCriticalUnknown(candidates);
    if (decisionGap) return makeResult('DATA_GAP', [decisionGap]);

    // If the stated goal is growth and capacity is already almost full, solve capacity before creating more demand.
    if (a.scope_goal === 'new_sales' && a.gate_capacity === 'limit') return makeResult('CAPACITY');
    // Weak economics must be clarified before scaling acquisition.
    if (a.scope_goal === 'new_sales' && a.gate_economics === 'low') return makeResult('ECONOMICS');

    const zone = candidates[0]?.zone;
    let code = 'NO_CRITICAL_CONSTRAINT_FOUND';

    if (zone === 'D') code = diagnoseDemand();
    if (zone === 'O') code = 'OFFER';
    if (zone === 'FIT') code = 'FIT';
    if (zone === 'A') code = diagnoseAccess();
    if (zone === 'T') code = 'DECISION_GAP';
    if (zone === 'C') code = 'PURCHASE_FRICTION';
    if (zone === 'S') code = diagnoseStart();
    if (zone === 'F') code = diagnoseFulfillment();
    if (zone === 'V') code = diagnoseValue();
    if (zone === 'R') code = diagnoseRepeat();
    if (zone === 'E') code = 'ECONOMICS';
    if (zone === 'CAP') code = 'CAPACITY';

    return makeResult(code);
  }

  function diagnoseDemand() {
    const a = state.answers;
    const others = collectCandidates().filter(x => x.zone !== 'D');
    const next = others[0]?.zone;
    const codeFor = z => ({ O:'OFFER', FIT:'FIT', A:'ACCESS', T:'DECISION_GAP', C:'PURCHASE_FRICTION', S:'START_FAILURE', V:'VALUE_FAILURE', E:'ECONOMICS', CAP:'CAPACITY', R:'NEXT_CYCLE' }[z] || 'DEMAND_UNCLEAR');

    // If people ask but do not buy, demand exists. The loss is later in the route; do not call it weak demand or auto-blame the offer.
    if (a.deep_d2 === 'ask_not_buy') return next ? codeFor(next) : 'DATA_GAP';

    // A paid purchase proves that some demand exists; low volume may still be access/seasonality, not "no demand".
    if (a.deep_d1 === 'yes') {
      if (['none','unstable'].includes(a.core_access)) return 'ACCESS';
      if (next) return codeFor(next);
      return 'DEMAND_UNCLEAR';
    }

    if (a.deep_d2 === 'few_requests') {
      if (a.deep_d3 === 'yes') {
        if (['none','unstable'].includes(a.core_access)) return 'ACCESS';
        return next ? codeFor(next) : 'DEMAND_UNCLEAR';
      }
      if (a.deep_d3 === 'no') return 'DEMAND_WEAK';
      return 'DEMAND_UNCLEAR';
    }
    if (a.deep_d2 === 'seasonal' || a.deep_d2 === 'unknown' || a.core_access === 'unknown') return 'DEMAND_UNCLEAR';
    if (a.core_access === 'none') return 'ACCESS';
    return 'DEMAND_UNCLEAR';
  }

  function diagnoseAccess() {
    const a = state.answers;
    if (a.core_access === 'unknown' && a.deep_a1 === 'no' && Array.isArray(a.deep_a4) && a.deep_a4.includes('unknown')) return 'DATA_GAP';
    // If acquisition is described as unstable but attribution is incomplete, first measure source -> order.
    // Otherwise the tool may recommend scaling the wrong channel.
    if (a.core_access === 'unstable' && a.deep_a1 && a.deep_a1 !== 'yes') return 'DATA_GAP';
    if (a.deep_a2 === 'views_down') return 'DISTRIBUTION';
    if (a.deep_a2 === 'responses_down') {
      if (['no','mostly_no'].includes(a.core_offer)) return 'OFFER';
      if (['bad','half'].includes(a.core_fit)) return 'FIT';
      if (['often','almost_always'].includes(a.core_trust)) return 'DECISION_GAP';
      return 'DATA_GAP';
    }
    if (a.deep_a2 === 'buy_down') {
      if (['hard','breaks'].includes(a.core_conversion)) return 'PURCHASE_FRICTION';
      if (['bad','half'].includes(a.core_fit)) return 'FIT';
      if (['often','almost_always'].includes(a.core_trust)) return 'DECISION_GAP';
      if (['no','mostly_no'].includes(a.core_offer)) return 'OFFER';
      return 'DATA_GAP';
    }
    return 'ACCESS';
  }

  function diagnoseStart() {
    const a = state.answers;
    if (a.scope_model === 'EDUCATION') {
      if (a.deep_s1 === 'most' && a.deep_s2 === 'most') return 'DATA_GAP';
      if (a.deep_s1 === 'few') return 'ACTIVATION_FAILURE';
      if (a.deep_s2 === 'rare') return 'FIRST_VALUE_GAP';
      if (a.deep_s1 === 'half') return 'ACTIVATION_FAILURE';
    } else if (a.deep_s1 === 'no') return 'DATA_GAP';
    return 'START_FAILURE';
  }

  function diagnoseFulfillment() {
    const a = state.answers;
    if (meaningful(a.deep_f1).includes('overload') && a.deep_f2 === 'yes') return 'CAPACITY';
    return 'FULFILLMENT';
  }

  function diagnoseValue() {
    const a = state.answers;
    if (a.core_value === 'unknown' && (meaningful(a.deep_v1).length === 0 || a.deep_v2 === 'unknown')) return 'DATA_GAP';
    return 'VALUE_FAILURE';
  }

  function diagnoseRepeat() {
    const a = state.answers;
    if (a.deep_r1 === 'no' || a.core_repeat === 'na') return 'NO_CRITICAL_CONSTRAINT_FOUND';
    if (a.deep_r1 === 'unknown') return 'DATA_GAP';
    if (a.deep_r3 === 'unknown') return 'DATA_GAP';
    if (a.deep_r3 === 'no' && !['impossible','unknown'].includes(a.deep_r2)) return 'CUSTOMER_MEMORY_GAP';
    return 'NEXT_CYCLE';
  }

  function decisionCriticalUnknown(candidates = collectCandidates()) {
    const a = state.answers;
    const unknownCount = ['core_demand','core_offer','core_fit','core_access','core_trust','core_conversion','core_start','core_value','core_repeat'].filter(id => a[id] === 'unknown').length;
    const top = candidates[0];

    // These unknowns matter only if the likely next action is to create more volume.
    const growthCandidate = !top || ['A','D'].includes(top.zone);
    if (a.scope_goal === 'new_sales' && growthCandidate && (a.gate_capacity === 'unknown' || a.gate_economics === 'unknown')) {

    }

    }

    const context = meaningful(a.period_context);
    if (!strongKnown && context.some(v => ['offer_change','channel_change'].includes(v)) && ['new_sales','stable'].includes(a.scope_goal) && a.deep_a2 && !['no_decline','unknown'].includes(a.deep_a2)) {
      return 'В выбранном периоде одновременно менялся важный элемент продаж. Сначала отделите эффект этого изменения от обычной динамики, иначе легко лечить не ту причину.';
    }
    return '';
  }

  function resultKindFor(code) {
    const a = state.answers;
    if (code === 'LEGAL_SAFETY_BLOCKER') return 'Сначала решить это';
    if (code === 'FULFILLMENT' && a.gate_fulfillment === 'regular') return 'Сначала решить это';

  function meaningful(values) {
    return (Array.isArray(values) ? values : []).filter(v => !['none','unknown','normal'].includes(v));

  function numbered(...items) {

  function humanList(items) {

      out.action = numbered(
        'Пройдите путь сами как новый клиент: нашли предложение → поняли цену/условия → выбрали → оформили/записались → оплатили → получили подтверждение.',
        'Если на каком-то шаге без вашего ручного объяснения нельзя двигаться дальше — исправьте именно этот шаг.',
        'После этого дайте пройти путь одному реальному человеку.'
      );
      out.metric = 'Реальный человек проходит покупку/запись от начала до подтверждения без ручного спасения на каждом шаге.';
    }

    if (code === 'BUILD_ACCESS') {
      const hint = { PRODUCT:'площадку, где уже выбирают похожий товар', APPOINTMENT:'локальный поиск/карты или локальную площадку, где ищут услугу', EXPERT:'место, где люди уже обсуждают проблему, которую решает услуга', EDUCATION:'аудиторию или площадку, где уже есть запрос на такое обучение' }[model] || 'одно место, где уже есть нужные люди';
      out.action = numbered(`Выберите один первый канал: ${hint}.`, `Разместите там одно понятное предложение ${scope} с реальной ценой/условиями и действием «заказать / записаться».`, 'Отмечайте только новые релевантные обращения и реальные покупки.');
      out.metric = 'Новые обращения и реальные шаги к покупке из одного выбранного источника: заявка, запись, бронь или заказ.';
    }

    if (code === 'BUILD_MARKET_TEST') {
      out.action = numbered(
        `Предложите ${scope} реальному покупателю на нормальных условиях.`,
        'Не заменяйте продажу опросом «нравится ли идея» и не давайте такую скидку, которая полностью меняет экономику.',
        'После результата запишите: кто купил/отказался, для какой задачи и на каких условиях.'
      );
      out.metric = 'Реальная бронь, заказ, предоплата/оплата или конкретный отказ на реальных условиях.';
    }

    if (code === 'BUILD_FULFILLMENT') {
      out.action = numbered('Выполните один реальный заказ от подтверждения до фактического получения результата клиентом.', 'Запишите фактическое время, прямые расходы, задержки, ошибки и что пришлось делать вручную сверх плана.', 'Исправьте первый повторяемый сбой до следующего увеличения потока.');
      out.metric = 'Заказ выполнен вовремя и в обещанном качестве; фактические время и расходы известны.';
    }

    if (code === 'BUILD_VALUE') {
      out.action = numbered('После реального выполнения проверьте не «понравилось ли», а решилась ли задача, ради которой клиент покупал.', 'Если результат можно наблюдать — зафиксируйте его. Если нет — задайте один конкретный вопрос о результате и о том, что не совпало с ожиданием.');
      out.metric = 'Подтверждение конкретного клиентского результата или точная причина, почему он не получен.';
    }

    if (code === 'BUILD_ECONOMICS') {
      out.action = numbered('Возьмите уже выполненную тестовую продажу.', 'Посчитайте: сумма от клиента минус прямые расходы; отдельно запишите всё ваше время — подготовку, выполнение и поддержку.', 'Если результат отрицательный или слишком слабый, не масштабируйте: сначала меняйте цену, состав продукта или самый дорогой/долгий этап.');
      out.metric = 'Деньги после прямых расходов + фактическое время на одну тестовую продажу.';
    }

    if (code === 'BUILD_CAPACITY') {
      out.action = numbered('Представьте несколько таких продаж подряд и назовите ресурс, который закончится первым: время, слот, материалы, оборудование, доставка, поддержка или деньги на закупку.', 'Оцените не аварийный максимум, а объём, который можно повторять без ночных авралов и падения качества.', 'До роста заказов исправьте именно это узкое место или ограничьте приём тем объёмом, который реально можете выполнить нормально.');
      out.metric = 'Сколько таких заказов вы можете повторять без задержек, снижения качества и ухудшения заработка.';
    }

    if (code === 'NO_CRITICAL_CONSTRAINT_FOUND') {
      const byGoal = {
        new_sales:numbered('Не переделывайте весь бизнес. Выберите один уже знакомый источник новых клиентов и попробуйте получить из него ещё несколько реальных обращений на тех же условиях.', 'Сохраняйте тот же продукт и условия, чтобы понять эффект именно источника.'),
        stable:numbered('Начните на следующих продажах фиксировать три вещи: источник, новый/повторный клиент, ситуация покупки.', 'После сопоставимого периода посмотрите, что действительно создаёт волны: сезон, канал или повтор.'),
        income:numbered('Сравните несколько типичных товаров/услуг по двум вещам: сколько денег остаётся после прямых расходов и сколько времени они занимают.', 'Смотрите не только на больший чек, а на то, сколько денег остаётся после расходов и сколько вашего времени занимает такая продажа.'),
        overload:numbered('Во время следующей высокой загрузки запишите, какой этап первым создаёт очередь или аврал.', 'Не привлекайте больше заказов, пока не станет понятно, на каком этапе начинается перегруз.'),
        repeat:numbered('Выберите один понятный повод для повторной покупки и отмечайте, у каких клиентов и когда он действительно возникает.', 'Только после этого тестируйте уместное повторное предложение.'),
        unknown:numbered('Не меняйте систему ради изменения.', 'На следующих обращениях отмечайте: откуда пришёл человек → что хотел → купил ли. Вернитесь к проверке, когда увидите повторяющуюся картину.')
      };
      out.action = byGoal[a.scope_goal] || out.action;
      out.metric = 'Главный результат, который вы хотите улучшить, а рядом — заработок, качество и ваша нагрузка, чтобы не улучшить одно за счёт другого.';
    }

    return out;
  }

  function buildWhy(code) {
    const a = state.answers;
    const lines = [];
    const add = (cond, text) => { if (cond) lines.push(text); };
    const targetLabels = {
      attended_visits:'больше реально состоявшихся визитов', fill_slots:'заполнить свободные окна', new_customers:'больше новых клиентов',
      completed_orders:'больше выполненных заказов', paid_clients:'больше оплаченных клиентов или проектов', paid_students:'больше оплаченных участников',
      revenue:'больше выручки', owner_money:'больше денег оставлять себе', per_sale:'больше зарабатывать с каждой продажи',
      same_money_less_time:'сохранять заработок при меньших затратах времени', steady_orders:'более ровные заказы', steady_income:'более ровный доход',
      less_channel_dependency:'меньше зависеть от одного источника', less_hours:'меньше работать по времени', fewer_urgent:'меньше авралов',
      stable_quality:'сохранять качество без перегруза', repeat_orders:'больше повторных заказов', repeat_visits:'больше повторных визитов',
      repeat_income:'больше дохода от повторных клиентов'
    };
    if (targetLabels[a.scope_target]) lines.push(`Вы указали конкретную цель: ${targetLabels[a.scope_target]}. Поэтому приоритет выбирается именно под неё, а не под абстрактное «больше продаж».`);
    add(a.period_integrity && !['normal','unknown'].includes(a.period_integrity), 'Выбранный период был необычным: часть времени вы не могли работать в обычном режиме. Поэтому сравнивать продажи с другими периодами нужно осторожно.');
    add(meaningful(a.period_context).some(v => ['peak','slump','offer_change','channel_change'].includes(v)), 'В этот период были изменения — сезон, цены, товар или источник клиентов. Они могли заметно повлиять на результат.');
    add(code === 'ACCESS' && ['none','unstable'].includes(a.core_access), 'Новые люди, которые действительно могут купить у вас, приходят редко или нерегулярно.');
    add(code === 'OFFER' && ['no','mostly_no'].includes(a.core_offer), 'Новому человеку трудно быстро понять, что вы продаёте, сколько это стоит и на каких условиях.');
    add(code === 'FIT' && ['half','bad'].includes(a.core_fit), 'Среди обращений много людей, которым ваш товар или услуга не подходят по важным условиям.');
    add(code === 'DECISION_GAP' && ['often','almost_always'].includes(a.core_trust), 'Перед покупкой люди часто задают один и тот же вопрос или сомневаются в одном и том же.');
    add(code === 'PURCHASE_FRICTION' && ['hard','breaks'].includes(a.core_conversion), 'Даже люди, которые уже хотят купить, заметно теряются во время оформления.');
    add(['START_FAILURE','ACTIVATION_FAILURE','FIRST_VALUE_GAP'].includes(code) && ['losses','problem'].includes(a.core_start), 'Часть клиентов теряется уже после покупки, записи или оплаты.');
    add(code === 'FULFILLMENT' && a.gate_fulfillment === 'regular', 'При выполнении текущих заказов регулярно повторяются задержки, ошибки, переделки или другие сбои.');
    add(code === 'VALUE_FAILURE' && ['issues','no'].includes(a.core_value), 'Есть признаки, что часть клиентов не получает тот результат, который ожидала.');
    add(['NEXT_CYCLE','CUSTOMER_MEMORY_GAP'].includes(code) && a.core_repeat === 'rare', 'Повторная покупка здесь возможна, но клиенты возвращаются редко.');
    add(code === 'ECONOMICS' && ['negative','low','mixed','unknown'].includes(a.gate_economics), 'Пока неясно, сколько вы действительно зарабатываете на части продаж, либо заработок выглядит слишком низким.');
    add(code === 'CAPACITY' && ['limit','overload'].includes(a.gate_capacity), 'Вы уже близко к пределу нагрузки или не справляетесь с текущим объёмом.');
    add(['DEMAND_WEAK','DEMAND_UNCLEAR'].includes(code) && ['rare','unknown'].includes(a.core_demand), 'Пока мало реальных признаков, что люди активно пытаются купить такой товар или услугу.');
    if (!lines.length) lines.push('По вашим ответам именно этот участок сейчас больше других влияет на результат и его разумно проверить первым.');
    return lines;
  }

  
  function secondaryRisks(primary) {
    const a = state.answers;
    const risks = [];
    const add = (code, text, cond) => { if (cond && code !== primary) risks.push(text); };
    add('LEGAL','Есть вопрос по обязательным требованиям', ['maybe','unknown'].includes(a.gate_legal));
    add('FULFILLMENT','Повторяются проблемы с выполнением заказов', a.gate_fulfillment === 'regular');
    add('ECONOMICS','Некоторые продажи могут быть убыточными', a.gate_economics === 'negative');
    add('ECONOMICS','С части продаж остаётся слишком мало денег', a.gate_economics === 'low');
    add('ECONOMICS','Разные товары или услуги дают очень разный заработок', a.gate_economics === 'mixed');
    add('ECONOMICS','Пока неясно, сколько остаётся с продажи', a.gate_economics === 'unknown');
    add('CAPACITY','Нагрузка уже близка к пределу', ['limit','overload'].includes(a.gate_capacity));
    add('ACCESS','Новые клиенты приходят нерегулярно', a.core_access === 'unstable');
    add('FIT','Много обращений, которые заведомо не могут закончиться покупкой', ['half','bad'].includes(a.core_fit));
    add('R','Клиенты редко возвращаются, хотя повтор возможен', a.core_repeat === 'rare');
    add('K','Часть выводов пока основана скорее на ощущениях, чем на фактах', a.core_data === 'feelings');
    add('CHANNEL','Новые клиенты слишком сильно зависят от одного источника', ['mostly','all'].includes(a.deep_a3));
    return risks.slice(0, 4);
  }

  
  function confidenceFor(code) {
    const a = state.answers;
    if (state.mode === 'build') return 'Средняя';
    const directEvidence =
      (code === 'FULFILLMENT' && a.gate_fulfillment === 'regular' && meaningful(a.deep_f1).length) ||
      (code === 'CAPACITY' && ['overload','limit'].includes(a.gate_capacity) && a.deep_cap1 && a.deep_cap1 !== 'unknown') ||
      (code === 'PURCHASE_FRICTION' && a.core_conversion === 'breaks' && meaningful(a.deep_c1).length) ||
      (code === 'START_FAILURE' && ['losses','problem'].includes(a.core_start) && a.deep_s3 && a.deep_s3 !== 'unknown') ||
      (['ACTIVATION_FAILURE','FIRST_VALUE_GAP'].includes(code) && a.deep_s1 && a.deep_s2 && a.deep_s3 && a.deep_s3 !== 'unknown') ||
      (code === 'OFFER' && ['no','mostly_no'].includes(a.core_offer) && meaningful(a.deep_o1).length) ||
      (code === 'FIT' && ['half','bad'].includes(a.core_fit) && meaningful(a.deep_fit1).length) ||
      (code === 'VALUE_FAILURE' && a.deep_v2 === 'yes' && a.deep_v3 && a.deep_v3 !== 'unknown') ||
      (code === 'ECONOMICS' && a.gate_economics === 'negative');
    if (directEvidence && a.core_data !== 'feelings') return 'Высокая';
    if (a.core_data === 'facts' || a.core_data === 'mixed' || code === 'LEGAL_SAFETY_BLOCKER') return 'Средняя';
    return 'Низкая';
  }

  function finalizeFollowup() {
    const a = state.answers;
    const base = state.followupBase;
    let title, summary, action, metric, dont, next;
    const guard = Array.isArray(a.fu_guardrail) ? a.fu_guardrail : [];
    const guardProblem = guard.some(x => x !== 'none');

    if (a.fu_done === 'no') {
      title = 'Сначала разберитесь, почему не получилось выполнить прошлый совет';
      summary = 'Пока само действие не было выполнено, нельзя понять, помогло бы оно продажам или нет.';
      action = 'Запишите, что именно помешало: не хватило времени, денег, было слишком сложно, непонятно с чего начать или возникла другая причина. Затем упростите действие до такого шага, который реально можно выполнить.';
      metric = 'Удалось ли выполнить выбранное действие в реальной работе.';
      dont = 'Не делайте вывод, что прошлый совет был плохим или хорошим, пока вы его фактически не проверили.';
      next = 'Когда действие будет выполнено, сравните результат до и после.';
    } else if (a.fu_effect === 'better' && !guardProblem) {
      title = 'Изменение похоже на полезное';
      summary = 'Нужный показатель улучшился, а деньги, качество, сроки, нагрузка и результат для клиента по вашим ответам не пострадали.';
      action = 'Оставьте это изменение в работе и некоторое время продолжайте наблюдать, сохраняется ли эффект на обычных заказах.';
      metric = 'Сохраняется ли улучшение на следующих реальных заказах или клиентах.';
      dont = 'Не увеличивайте резко объём только из-за одного удачного случая.';
      next = 'Если улучшение сохраняется, пройдите проверку снова и посмотрите, что теперь сильнее всего мешает росту.';
    } else if (a.fu_effect === 'worse' || guardProblem) {
      title = 'В таком виде изменение лучше не оставлять';
      summary = guardProblem
        ? 'Даже если основной показатель стал лучше, одновременно ухудшилось что-то важное: деньги, качество, сроки, нагрузка или результат клиента.'
        : 'После изменения нужный показатель стал хуже.';
      action = 'Остановите или откатите изменение, если это возможно. Запишите, что именно ухудшилось, чтобы не повторять тот же шаг снова.';
      metric = 'Вернулся ли результат к прежнему уровню после отмены изменения.';
      dont = 'Не продолжайте только потому, что уже потратили на это время или деньги.';
      next = 'После отката снова проверьте ситуацию и выберите другое действие.';
    } else if (a.fu_effect === 'invalid') {
      title = 'По этой проверке пока нельзя сделать вывод';
      summary = 'Условия изменились или данные получились ненадёжными, поэтому непонятно, помогло действие или нет.';
      action = 'Если ответ всё ещё важен, повторите проверку в более понятных условиях и заранее решите, что именно будете сравнивать.';
      metric = 'Есть сравнимый результат до и после изменения.';
      dont = 'Не принимайте решение по данным, которым сами не доверяете.';
      next = 'Вернитесь к выводу после нормального сравнения.';
    } else {
      title = 'Пока непонятно, помогло изменение или нет';
      summary = 'Разница пока слишком мала либо случаев ещё недостаточно.';
      action = 'Посмотрите, дадут ли ещё несколько обычных заказов ясную картину. Если нет, не тяните проверку бесконечно — выберите другую вероятную причину и проверьте её.';
      metric = 'Тот же показатель, который вы хотели улучшить прошлым действием.';
      dont = 'Не продолжайте слабую проверку только потому, что уже начали.';
      next = 'Когда данных будет достаточно, сохраните вывод или выберите следующий шаг.';
    }

    state.result = {
      code:'FOLLOWUP',
      title, summary, action, metric, dont, next,
      confidence:'—',
      why:[base ? `Прошлый вывод: ${base.result?.title || base.title || 'сохранённый результат'}.` : 'Использован предыдущий сохранённый результат.'],
      secondary:[],
      date:new Date().toISOString(),
      followup:true
    };
    renderResult(state.result);
  }

  
  function renderResult(result) {
    const tpl = document.getElementById('resultTemplate').content.cloneNode(true);
    app.replaceChildren(tpl);
    document.getElementById('resultTitle').textContent = result.title;
    document.getElementById('resultSummary').textContent = result.summary;
    const badge = document.getElementById('confidenceBadge');
    badge.textContent = result.followup ? 'Повторная проверка' : ((result.kind || 'Вывод') + (result.precisionRefined ? ' · уточнено цифрами' : '') + ' · уверенность: ' + result.confidence.toLowerCase());
    const why = document.getElementById('resultWhy');
    result.why.forEach(x => { const d=document.createElement('div'); d.className='reason'; d.textContent=x; why.appendChild(d); });
    document.getElementById('resultProven').textContent = result.proven || '';
    document.getElementById('resultBoundary').textContent = result.boundary || '';
    document.getElementById('resultAction').textContent = result.action;
    document.getElementById('resultMetric').textContent = result.metric;
    document.getElementById('resultDont').textContent = result.dont;
    document.getElementById('resultDecisionRule').textContent = result.decisionRule || 'После изменения посмотрите, стало ли лучше по главному результату и не ухудшились ли деньги, качество и нагрузка.';
    document.getElementById('resultNext').textContent = result.next;

    const precisionCard = document.getElementById('precisionCard');
    if (result.precisionSummary) {
      precisionCard.hidden = false;
      document.getElementById('precisionSummary').textContent = result.precisionSummary;
      document.getElementById('precisionCaveat').textContent = result.precisionCaveat || '';
    }

    const secCard = document.getElementById('secondaryCard');
    const sec = document.getElementById('secondaryRisks');
    if (!result.secondary?.length) secCard.hidden = true;
    else result.secondary.forEach(x => { const t=document.createElement('span'); t.className='tag'; t.textContent=x; sec.appendChild(t); });

    const precisionButton = document.getElementById('precisionResultButton');
    const precisionPath = precisionQuestionsFor(result.code);
    if (!result.followup && !result.precisionRefined && precisionPath.length) {
      precisionButton.hidden = false;
      precisionButton.addEventListener('click', () => startPrecision(result));
    }

    const saveButton = document.getElementById('saveResultButton');
    saveButton.textContent = result.followup ? 'Сохранить проверку' : 'Сохранить результат';
    saveButton.addEventListener('click', () => {
      const item = {
        appVersion: APP_VERSION,
        date: result.date,
        mode: state.mode,
        scope: state.answers.scope_name || state.followupBase?.scope || '',
        answers: state.answers,
        result,
      };
      const saved = saveHistory(item);
      const msg = document.getElementById('saveMessage');
      msg.hidden = false;
      if (saved) {
        msg.textContent = 'Результат сохранён в этом браузере.';
        saveButton.disabled = true;
      } else {
        msg.textContent = 'Браузер не разрешил сохранить историю. Скопируйте результат, чтобы не потерять его.';
      }
    });
    document.getElementById('restartResultButton').addEventListener('click', showHome);
    document.getElementById('copyResultButton').addEventListener('click', async () => {
      const text = resultText(result);
      try {
        await navigator.clipboard.writeText(text);
        document.getElementById('copyResultButton').textContent = 'Скопировано';
      } catch {
        window.prompt('Скопируйте результат:', text);
      }
    });
    resetButton.hidden = false;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resultText(r) {
  const precision = r.precisionSummary ? `\n\nЧто показывают ваши цифры:\n${r.precisionSummary}\n${r.precisionCaveat || ''}` : '';
  return `${r.title}\n\nПочему:\n${r.why.map(x=>'• '+x).join('\n')}\n\nЧто этот вывод означает:\n${r.proven || ''}\n${r.boundary || ''}${precision}\n\nЧто сделать:\n${r.action}\n\nЧто смотреть:\n${r.metric}\n\nПока не делать:\n${r.dont}\n\nЧто дальше:\n${r.next}`;
}

  function isAnswered(id) {
    const v = state.answers[id];
    if (Array.isArray(v)) return v.length > 0;
    return v !== undefined && v !== null && String(v).trim() !== '';
  }
  function resolve(value) { return typeof value === 'function' ? value(state) : value; }
  function sectionName(id) {
    if (id.startsWith('scope') || id.startsWith('period') || id.startsWith('mode')) return 'Контекст';
    if (id.startsWith('hybrid') || id.startsWith('build_base')) return 'Что можно сохранить из уже работающего';
    if (id.startsWith('shared')) return 'Общие ресурсы';
    if (id.startsWith('gate')) return 'Защитная проверка';
    if (id.startsWith('core')) return 'Общий скан';
    if (id.startsWith('deep')) return 'Уточнение';
    if (id.startsWith('build')) return 'Новый продукт';
    if (id.startsWith('p_')) return 'Уточняем цифрами';
    if (id.startsWith('fu')) return 'Повторная проверка';
    return '';
  }
  function formatDate(iso) { try { return new Intl.DateTimeFormat('ru-RU', { day:'numeric', month:'long', year:'numeric' }).format(new Date(iso)); } catch { return ''; } }

  window.__diagTest = { state, questions, resultLibrary, startMode, showHome, goNext, collectCandidates, diagnoseFull, diagnoseBuild, diagnoseDemand, diagnoseAccess, diagnoseStart, diagnoseFulfillment, diagnoseValue, diagnoseRepeat, decisionCriticalUnknown, makeResult, concretizeResult, adaptResultToModel, chooseDeepBranches, hardGateResult, buildEarlyResult, meaningful, sectionName, resultText, precisionQuestionsFor, finalizePrecision };

  resetButton.addEventListener('click', showHome);
  brandButton.addEventListener('click', showHome);
  showHome();
})();
